<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capanna RH">
<meta name="robots" content="noindex">
<title>Capanna – Espace gérant</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<script src="lib/chart.umd.js"></script>
<style>
  :root {
    --vert:#0B4F3C; --vert-2:#13684F; --vert-clair:#E6EFEA; --or:#A8823C; --or-clair:#F4ECDD;
    --fond:#F6F3EA; --carte:#FFFFFF; --texte:#1C1F1D; --gris:#6E726F; --ligne:#E7E2D5;
    --rouge:#B3261E; --rouge-clair:#FBE9E7; --orange:#B86A00; --orange-clair:#FDF1DE; --ok:#1E7A4C; --ok-clair:#E4F3EA;
    --r:16px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; background:var(--fond); color:var(--texte); font-size:15px; -webkit-font-smoothing:antialiased; }
  a { color:var(--vert); }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:10px 14px; background:var(--vert); color:#fff; font-weight:600; }
  button.sec { background:var(--vert-clair); color:var(--vert); }
  button.or { background:var(--or); }
  button.lien { background:none; color:var(--vert); padding:4px 6px; font-weight:500; text-decoration:underline; }
  button.danger { background:var(--rouge-clair); color:var(--rouge); }
  button:disabled { opacity:.45; cursor:default; }
  input, select, textarea { font:inherit; padding:10px 12px; border:1px solid var(--ligne); border-radius:10px; background:#fff; color:var(--texte); width:100%; }
  label { display:block; font-size:13px; color:var(--gris); margin:10px 0 4px; }
  .cache { display:none !important; }

  /* --- mise en page --- */
  .app { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  nav.lat { background:var(--vert); color:#fff; padding:22px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; }
  nav.lat .marque { background:#F2EEE1; border-radius:14px; padding:14px; margin-bottom:16px; text-align:center; }
  nav.lat .marque img { width:130px; display:block; margin:0 auto; }
  nav.lat .marque small { color:var(--or); letter-spacing:2px; font-size:10px; text-transform:uppercase; }
  nav.lat a { color:#E8F0EC; text-decoration:none; padding:10px 12px; border-radius:10px; display:flex; gap:10px; align-items:center; font-weight:500; }
  nav.lat a:hover { background:rgba(255,255,255,.08); }
  nav.lat a.actif { background:#fff; color:var(--vert); }
  nav.lat .bas { margin-top:auto; font-size:12px; color:#B9D0C5; padding:8px 12px; }
  nav.lat .badge { margin-left:auto; background:var(--or); color:#fff; border-radius:20px; font-size:11px; padding:1px 7px; }
  main { padding:26px 30px 60px; max-width:1200px; width:100%; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:30px; margin:0 0 4px; color:var(--vert); }
  h2 { font-size:17px; margin:0 0 12px; }
  .sous { color:var(--gris); margin:0 0 20px; }
  .barre { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin:0 0 18px; }
  .barre > div { min-width:150px; }
  .barre label { margin-top:0; }
  .grille { display:grid; gap:14px; }
  .g4 { grid-template-columns:repeat(4,minmax(0,1fr)); } .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); } .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .grille > * { min-width:0; }
  main { min-width:0; overflow-x:hidden; }
  .carte { background:var(--carte); border-radius:var(--r); padding:18px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(30,40,30,.05); border:1px solid #EFEBE0; }
  .kpi .v { font-size:28px; font-weight:700; letter-spacing:-.5px; margin-top:4px; }
  .kpi .l { font-size:12.5px; color:var(--gris); text-transform:uppercase; letter-spacing:.6px; }
  .kpi .d { font-size:13px; color:var(--gris); margin-top:4px; }
  .kpi.or .v { color:var(--or); } .kpi.rouge .v { color:var(--rouge); } .kpi.vert .v { color:var(--vert); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--gris); font-weight:600; padding:8px 8px; border-bottom:1px solid var(--ligne); white-space:nowrap; }
  td { padding:9px 8px; border-bottom:1px solid #F1EDE3; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  tr.clic { cursor:pointer; } tr.clic:hover td { background:#FAF8F2; }
  .tab { overflow-x:auto; }
  .pastille { display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap; }
  .p-ok { background:var(--ok-clair); color:var(--ok); } .p-rouge { background:var(--rouge-clair); color:var(--rouge); }
  .p-orange { background:var(--orange-clair); color:var(--orange); } .p-gris { background:#EFEDE6; color:var(--gris); }
  .p-or { background:var(--or-clair); color:var(--or); }
  .alerte { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #F1EDE3; }
  .alerte:last-child { border-bottom:0; }
  .alerte .pt { width:9px; height:9px; border-radius:50%; margin-top:6px; flex:none; }
  .pt.rouge { background:var(--rouge); } .pt.orange { background:var(--orange); } .pt.info { background:#9AA39E; }
  .vide { color:var(--gris); font-style:italic; padding:8px 0; }
  .ligne-flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .entete-fiche { display:flex; justify-content:space-between; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .avatar { width:52px; height:52px; border-radius:50%; background:var(--vert-clair); color:var(--vert); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; font-family:Georgia,serif; }
  .chart-box { position:relative; height:260px; }
  .msg { padding:10px 14px; border-radius:10px; margin:10px 0; font-size:14px; }
  .msg.bon { background:var(--ok-clair); color:var(--ok); } .msg.mal { background:var(--rouge-clair); color:var(--rouge); }
  .chargement { color:var(--gris); padding:30px 0; text-align:center; }
  .jours7 { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .jours7 .j { background:#FAF8F2; border:1px solid var(--ligne); border-radius:12px; padding:10px; min-height:84px; font-size:13px; }
  .jours7 .j b { display:block; font-size:12px; color:var(--gris); text-transform:uppercase; margin-bottom:6px; }
  .jours7 .j.off { opacity:.55; }
  .emo { font-size:20px; line-height:1; }
  .humeurs { display:flex; gap:12px; flex-wrap:wrap; margin:0 0 14px; }
  .humeurs .carte { flex:1 1 240px; display:flex; gap:14px; align-items:center; }
  .humeurs .gros { font-size:44px; line-height:1; }

  /* --- connexion --- */
  .login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login .carte { width:100%; max-width:380px; text-align:center; padding:30px; }
  .login img { width:170px; }

  /* --- fenêtre --- */
  .voile { position:fixed; inset:0; background:rgba(20,30,25,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .fenetre { background:#fff; border-radius:18px; padding:22px; width:100%; max-width:460px; max-height:90vh; overflow:auto; }
  .fenetre h2 { margin-bottom:6px; }
  .fenetre .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }

  /* --- mobile --- */
  .menu-mobile { display:none; }
  @media (max-width: 900px) {
    .app { grid-template-columns:1fr; }
    nav.lat { position:fixed; bottom:0; top:auto; left:0; right:0; height:auto; flex-direction:row; padding:6px; z-index:20; overflow-x:auto; gap:2px; }
    nav.lat .marque, nav.lat .bas { display:none; }
    nav.lat a { flex-direction:column; gap:2px; font-size:11px; padding:6px 8px; white-space:nowrap; }
    nav.lat .badge { margin:0; position:absolute; }
    main { padding:18px 14px 90px; }
    .g4 { grid-template-columns:repeat(2,minmax(0,1fr)); } .g3, .g2 { grid-template-columns:minmax(0,1fr); }
    .barre > div { min-width:0; flex:1 1 140px; }
    .kpi .d { font-size:12px; }
    .carte { padding:14px; }
    h1 { font-size:24px; }
    .kpi .v { font-size:22px; }
    .jours7 { grid-template-columns:repeat(2,1fr); }
    .masque-mobile { display:none; }
  }
</style>
</head>
<body>

<!-- ============ CONNEXION ============ -->
<div class="login" id="ecran-login">
  <div class="carte">
    <img src="logo.png" alt="Capanna Restaurante">
    <p style="color:var(--or);letter-spacing:2px;font-size:12px;text-transform:uppercase;margin:10px 0 18px">Espace gérant</p>
    <h2 id="titre-login" style="text-align:left">Connexion</h2>
    <input id="code" type="password" placeholder="Code gérant" autocomplete="current-password">
    <input id="code2" type="password" placeholder="Confirme le code" class="cache" style="margin-top:8px" autocomplete="new-password">
    <button id="btn-login" style="width:100%;margin-top:12px;padding:13px">Entrer</button>
    <div id="msg-login"></div>
  </div>
</div>

<!-- ============ APPLICATION ============ -->
<div class="app cache" id="ecran-app">
  <nav class="lat" id="nav">
    <div class="marque"><img src="logo.png" alt="Capanna"><small>Gestion du personnel</small></div>
    <a href="#tableau" data-v="tableau">📊 <span>Tableau de bord</span></a>
    <a href="#equipe" data-v="equipe">👥 <span>Équipe</span></a>
    <a href="#absences" data-v="absences">🗓️ <span>Congés</span><span class="badge cache" id="badge-dem"></span></a>
    <a href="#planning" data-v="planning">🕒 <span>Planning</span></a>
    <a href="#rapports" data-v="rapports">📄 <span>Rapports</span></a>
    <a href="#reglages" data-v="reglages">⚙️ <span>Réglages</span></a>
    <div class="bas">Pointage Wi-Fi Capanna<br><a href="#" id="deconnexion" style="color:#B9D0C5;padding:0">Se déconnecter</a></div>
  </nav>
  <main id="vue"></main>
</div>

<div id="fenetre"></div>

<script>
const API = "https://cqtnjliywdwzbbgutqlq.supabase.co/functions/v1/pointage";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const JOURS = ["", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
const TYPES = { conge: "Congé", maladie: "Maladie", absence_autorisee: "Absence autorisée", absence_injustifiee: "Absence injustifiée", retard_justifie: "Retard justifié" };
const STATUTS = {
  travaille: ["Travaillé", "p-ok"], present: ["Sur place", "p-ok"], depart_non_pointe: ["Départ non pointé", "p-orange"],
  absence_injustifiee: ["Absence injustifiée", "p-rouge"], absence_justifiee: ["Absence justifiée", "p-gris"],
  absent_en_cours: ["Pas encore arrivé", "p-orange"], a_venir: ["À venir", "p-gris"], hors_planning: ["Hors planning", "p-or"],
};
const ST_DEM = { demandee: ["En attente", "p-orange"], validee: ["Validée", "p-ok"], refusee: ["Refusée", "p-rouge"], annulee: ["Annulée", "p-gris"] };

let CODE = "";
try { CODE = sessionStorage.getItem("capanna_code") || ""; } catch {}
let EMPLOYES = [];
const charts = [];

// ---------- utilitaires ----------
async function api(action, corps = {}) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action, code: CODE, ...corps }) });
  const j = await r.json().catch(() => ({ erreur: "Réponse illisible" }));
  if (!r.ok || j.erreur) throw new Error(j.erreur || "Erreur " + r.status);
  return j;
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function duree(m) { // 75 -> "1 h 15"
  if (m == null) return "—";
  m = Math.round(m); if (m === 0) return "0";
  const h = Math.floor(Math.abs(m) / 60), r = Math.abs(m) % 60;
  return (m < 0 ? "−" : "") + (h ? `${h} h ${String(r).padStart(2, "0")}` : `${r} min`);
}
const hm = (m) => m == null ? "—" : `${String(Math.floor(m / 60) % 24).padStart(2, "0")}h${String(m % 60).padStart(2, "0")}`;
const tm = (t) => t ? t.slice(0, 5).replace(":", "h") : "—";
const dfr = (d) => d ? d.split("-").reverse().join("/") : "";
const djour = (d) => { const x = new Date(d + "T12:00:00Z"); return x.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "UTC" }); };
const pct = (p) => p == null ? "—" : `${p.toString().replace(".", ",")} %`;
const pastille = (txt, cls) => `<span class="pastille ${cls}">${esc(txt)}</span>`;
const statut = (s) => { const x = STATUTS[s] || [s, "p-gris"]; return pastille(x[0], x[1]); };
const aujourdhui = () => { const d = new Date(Date.now() - 5 * 3600e3); return d.toLocaleDateString("en-CA", { timeZone: "Africa/Casablanca" }); };
function addJ(d, n) { return new Date(new Date(d + "T12:00:00Z").getTime() + n * 864e5).toISOString().slice(0, 10); }
function lundi(d) { const w = new Date(d + "T12:00:00Z").getUTCDay() || 7; return addJ(d, 1 - w); }
function periode(code) {
  const a = aujourdhui();
  if (code === "jour") return [a, a];
  if (code === "semaine") return [lundi(a), a];
  if (code === "mois") return [a.slice(0, 8) + "01", a];
  if (code === "mois-1") { const p = addJ(a.slice(0, 8) + "01", -1); return [p.slice(0, 8) + "01", p]; }
  if (code === "30j") return [addJ(a, -29), a];
  return [a.slice(0, 8) + "01", a];
}
function message(el, txt, bon) { el.innerHTML = `<div class="msg ${bon ? "bon" : "mal"}">${esc(txt)}</div>`; }
function viderCharts() { while (charts.length) charts.pop().destroy(); }

// ---------- fenêtre (remplace prompt/confirm) ----------
function fenetre({ titre, texte = "", champs = [], ok = "Valider", danger = false }) {
  return new Promise((res) => {
    const f = $("#fenetre");
    f.innerHTML = `<div class="voile"><div class="fenetre">
      <h2>${esc(titre)}</h2>${texte ? `<p class="sous" style="margin-bottom:6px">${texte}</p>` : ""}
      ${champs.map((c, i) => `<label>${esc(c.label)}</label>${
        c.type === "select" ? `<select data-i="${i}">${c.options.map((o) => `<option value="${esc(o[0])}" ${o[0] === c.valeur ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`
        : c.type === "textarea" ? `<textarea data-i="${i}" rows="3" placeholder="${esc(c.placeholder || "")}">${esc(c.valeur || "")}</textarea>`
        : `<input data-i="${i}" type="${c.type || "text"}" value="${esc(c.valeur || "")}" placeholder="${esc(c.placeholder || "")}">`}`).join("")}
      <div id="msg-fen"></div>
      <div class="actions"><button class="sec" data-x="non">Annuler</button><button class="${danger ? "danger" : ""}" data-x="oui">${esc(ok)}</button></div>
    </div></div>`;
    const fermer = (v) => { f.innerHTML = ""; res(v); };
    $("[data-x=non]", f).onclick = () => fermer(null);
    $("[data-x=oui]", f).onclick = () => {
      const vals = $$("[data-i]", f).map((x) => x.value.trim());
      const manque = champs.findIndex((c, i) => c.requis && !vals[i]);
      if (manque >= 0) return message($("#msg-fen"), `« ${champs[manque].label} » est obligatoire.`, false);
      fermer(vals);
    };
    const premier = $("[data-i]", f); if (premier) premier.focus();
  });
}
const champMotif = { label: "Motif (obligatoire, conservé dans l'historique)", type: "textarea", requis: true, placeholder: "Ex. : oubli de pointage confirmé par le chef" };

// ---------- connexion ----------
let creation = false;
async function demarrer() {
  try {
    const s = await api("admin_statut");
    if (!s.configure) {
      creation = true;
      $("#titre-login").textContent = "Créer le code gérant";
      $("#code2").classList.remove("cache"); $("#btn-login").textContent = "Créer";
    }
    if (CODE) { try { await api("admin_connexion"); return ouvrir(); } catch { CODE = ""; } }
  } catch (e) { message($("#msg-login"), e.message, false); }
}
$("#btn-login").onclick = async () => {
  const c = $("#code").value;
  try {
    if (creation) {
      if (c !== $("#code2").value) return message($("#msg-login"), "Les deux codes ne sont pas identiques.", false);
      await api("admin_creer", { code: c });
    }
    CODE = c; await api("admin_connexion");
    try { sessionStorage.setItem("capanna_code", c); } catch {}
    ouvrir();
  } catch (e) { CODE = ""; message($("#msg-login"), e.message, false); }
};
$("#code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#btn-login").click(); });
$("#deconnexion").onclick = (e) => { e.preventDefault(); CODE = ""; try { sessionStorage.removeItem("capanna_code"); } catch {} location.hash = ""; location.reload(); };

async function ouvrir() {
  $("#ecran-login").classList.add("cache"); $("#ecran-app").classList.remove("cache");
  const eq = await api("admin_equipe"); EMPLOYES = eq.equipe;
  majBadge();
  router();
}
async function majBadge() {
  try {
    const a = await api("admin_absences", { statut: "demandee" });
    const b = $("#badge-dem"); b.textContent = a.absences.length; b.classList.toggle("cache", !a.absences.length);
  } catch {}
}
window.addEventListener("hashchange", () => { if (CODE) router(); });
function router() {
  const h = location.hash.replace("#", "") || "tableau";
  const [v, arg] = h.split("-");
  $$("#nav a[data-v]").forEach((a) => a.classList.toggle("actif", a.dataset.v === v || (v === "fiche" && a.dataset.v === "equipe")));
  viderCharts();
  const vues = { tableau: vueTableau, equipe: vueEquipe, fiche: vueFiche, absences: vueAbsences, planning: vuePlanning, rapports: vueRapports, reglages: vueReglages };
  (vues[v] || vueTableau)(arg);
  window.scrollTo(0, 0);
}
const services = () => [...new Set(EMPLOYES.map((e) => e.service))].sort();

// ======================= TABLEAU DE BORD =======================
let filtreT = { per: "mois", service: "", employe: "" };
let HUM = {};
const emoJ = (id) => HUM[id]?.jour ? `<span class="emo" title="${esc(HUM[id].jour.msg)}">${HUM[id].jour.emoji}</span>` : "";
const emoM = (id) => HUM[id]?.mois ? `<span class="emo" title="${esc(HUM[id].mois.msg)}">${HUM[id].mois.emoji}</span>` : "";
async function vueTableau() {
  const V = $("#vue");
  V.innerHTML = `<h1>Tableau de bord</h1><p class="sous" id="t-sous">Chargement…</p>
  <div class="barre">
    <div><label>Période</label><select id="f-per">
      <option value="jour">Aujourd'hui</option><option value="semaine">Cette semaine</option><option value="mois">Ce mois</option>
      <option value="mois-1">Mois dernier</option><option value="30j">30 derniers jours</option><option value="perso">Personnalisée…</option></select></div>
    <div id="f-dates" class="cache ligne-flex"><div><label>Du</label><input type="date" id="f-d"></div><div><label>Au</label><input type="date" id="f-f"></div></div>
    <div><label>Poste</label><select id="f-svc"><option value="">Tous</option>${services().map((s) => `<option>${esc(s)}</option>`).join("")}</select></div>
    <div><label>Employé</label><select id="f-emp"><option value="">Tous</option>${EMPLOYES.map((e) => `<option value="${e.id}">${esc(e.nom)}</option>`).join("")}</select></div>
  </div>
  <div id="t-corps"><div class="chargement">Calcul en cours…</div></div>`;
  $("#f-per").value = filtreT.per; $("#f-svc").value = filtreT.service; $("#f-emp").value = filtreT.employe;
  const go = () => {
    filtreT = { per: $("#f-per").value, service: $("#f-svc").value, employe: $("#f-emp").value };
    $("#f-dates").classList.toggle("cache", filtreT.per !== "perso");
    if (filtreT.per === "perso" && !($("#f-d").value && $("#f-f").value)) return;
    chargerTableau();
  };
  ["#f-per", "#f-svc", "#f-emp", "#f-d", "#f-f"].forEach((s) => $(s).onchange = go);
  chargerTableau();
}
async function chargerTableau() {
  const [debut, fin] = filtreT.per === "perso" ? [$("#f-d").value, $("#f-f").value] : periode(filtreT.per);
  let t;
  try { t = await api("admin_tableau", { debut, fin, service: filtreT.service || undefined, employe_id: filtreT.employe || undefined }); }
  catch (e) { return message($("#t-corps"), e.message, false); }
  viderCharts();
  HUM = t.humeurs || {};
  const E = t.equipe, J = t.jour;
  const avantSuivi = t.aujourdhui < t.debut_suivi;
  $("#t-sous").innerHTML = `Du ${dfr(t.debut)} au ${dfr(t.fin)} · suivi officiel depuis le ${dfr(t.debut_suivi)} · tolérance ${t.parametres.tolerance_retard_min} min · heures sup après ${t.parametres.seuil_heures_sup_min} min`;
  const classe = t.classement.filter((c) => c.creneaux_travailles > 0);

function tableClassement(l, mode) {
  if (!l.length) return `<div class="vide">Pas encore de données.</div>`;
  return `<table><tr><th>#</th><th>Employé</th><th>${mode === "p" ? "Ponctualité" : "Retard cumulé"}</th><th class="masque-mobile">${mode === "p" ? "Services" : "Nb retards"}</th></tr>
  ${l.map((c, i) => `<tr class="clic" data-fiche="${c.employe_id}"><td>${i + 1}</td><td><b>${esc(c.nom)}</b> ${emoM(c.employe_id)}<br><small style="color:var(--gris)">${esc(c.service)}</small></td>
  <td>${mode === "p" ? pct(c.ponctualite_pct) : duree(c.retard_total_min)}</td><td class="masque-mobile">${mode === "p" ? c.creneaux_travailles : c.nb_retards}</td></tr>`).join("")}</table>`;
}
function tableEquipeStats(l) {
  if (!l.length) return `<div class="vide">Pas encore de données sur cette période.</div>`;
  return `<table><tr><th>Employé</th><th title="Ponctualité du jour">Auj.</th><th title="Discipline du mois">Mois</th><th>Poste</th><th>Jours</th><th>Retards</th><th>Cumul</th><th>Ponctualité</th><th>Absences inj.</th><th>Heures sup</th><th>Travail effectif</th></tr>
  ${[...l].sort((a, b) => a.nom.localeCompare(b.nom)).map((c) => `<tr class="clic" data-fiche="${c.employe_id}"><td><b>${esc(c.nom)}</b></td><td>${emoJ(c.employe_id)}</td><td>${emoM(c.employe_id)}</td><td>${esc(c.service)}</td><td>${c.jours_travailles}</td><td>${c.nb_retards}</td><td>${duree(c.retard_total_min)}</td><td>${pct(c.ponctualite_pct)}</td><td>${c.absences_injustifiees || ""}</td><td>${c.heures_sup_min ? duree(c.heures_sup_min) : ""}</td><td>${duree(c.travail_min)}</td></tr>`).join("")}</table>`;
}
function graphe(id, labels, serie) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  charts.push(new Chart(el, {
    data: { labels, datasets: [
      { type: "bar", label: "Retards (min)", data: serie.map((s) => s.retard_total_min), backgroundColor: "#A8823C", borderRadius: 6, maxBarThickness: 46, yAxisID: "y" },
      { type: "bar", label: "Heures sup (min)", data: serie.map((s) => s.heures_sup_min), backgroundColor: "#9CC5B2", borderRadius: 6, maxBarThickness: 46, yAxisID: "y" },
      { type: "line", label: "Ponctualité (%)", data: serie.map((s) => s.ponctualite_pct), borderColor: "#0B4F3C", backgroundColor: "#0B4F3C", tension: .3, yAxisID: "y2" },
    ] },
    options: { maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 12 } } },
      scales: { y: { beginAtZero: true, grid: { color: "#EFEBE0" } }, y2: { position: "right", min: 0, max: 100, grid: { display: false } }, x: { grid: { display: false } } } },
  }));
}

async function modifierJour(id, nom, j, cs, apres) {
  const c1 = cs[0] || {}, c2 = cs[1] || {};
  const r = await fenetre({ titre: `${nom} – ${JOURS[j]}`, texte: "Laisse le 2e service vide s'il n'y en a pas. Vide aussi le 1er pour un jour OFF.", champs: [
    { label: "Service 1 – début", type: "time", valeur: c1.debut?.slice(0, 5) || "" }, { label: "Service 1 – fin", type: "time", valeur: c1.fin?.slice(0, 5) || "" },
    { label: "Service 1 – pause (min)", type: "number", valeur: String(c1.pause_min ?? 0) },
    { label: "Service 2 – début (double service)", type: "time", valeur: c2.debut?.slice(0, 5) || "" }, { label: "Service 2 – fin", type: "time", valeur: c2.fin?.slice(0, 5) || "" },
    { label: "Service 2 – pause (min)", type: "number", valeur: String(c2.pause_min ?? 0) }, champMotif], ok: "Enregistrer" });
  if (!r) return;
  const creneaux = [];
  if (r[0] && r[1]) creneaux.push({ debut: r[0], fin: r[1], pause_min: +r[2] || 0 });
  if (r[3] && r[4]) creneaux.push({ debut: r[3], fin: r[4], pause_min: +r[5] || 0 });
  try { await api("admin_creneaux_jour", { employe_id: id, jour: j, creneaux, motif: r[6] }); apres(); } catch (x) { alerteErreur(x); }
}

function charger(src) { return new Promise((ok, ko) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }

  const motif = r[r.length - 1];
  let conf;
  if (r[r.length - 2] === "oui") conf = def;
  else {
    let k = 0; const v = () => r[k++];
    const num = (x) => x === "" ? undefined : parseInt(x, 10);
    conf = { avance_min: parseInt(v(), 10), avance: { emoji: v(), msg: v() }, heure: { emoji: v(), msg: v() }, jour: [], mois: [] };
    c.jour.forEach(() => { const m = num(v()); conf.jour.push({ ...(m === undefined ? {} : { max: m }), emoji: v(), msg: v() }); });
    c.mois.forEach(() => { const m = num(v()); conf.mois.push({ ...(m === undefined ? {} : { max: m }), emoji: v(), msg: v() }); });
  }
  try { await api("admin_parametre_modifier", { cle: "emojis", valeur: JSON.stringify(conf), motif }); vueReglages(); }
  catch (x) { alerteErreur(new Error(x.message === "Valeur invalide." ? "Réglage refusé : vérifie que les seuils sont des nombres croissants et que seul le dernier palier est vide." : x.message)); }
}
function resume(o) {
  if (o == null) return "—";
  if (Array.isArray(o)) return o.length ? o.map((c) => `${(c.debut || "").slice(0, 5)}–${(c.fin || "").slice(0, 5)}${c.pause_min ? ` (pause ${c.pause_min})` : ""}`).join(" + ") : "OFF";
  return Object.entries(o).filter(([k]) => !["employe_id", "nouveau_id", "decide_par", "decide_le", "demande_par"].includes(k)).map(([k, v]) => `${k} : ${String(v).length > 60 ? "(nouvelle configuration)" : v}`).join(", ");
}
function nomObjet(x) {
  if (x.objet === "creneau") { const [id, j] = String(x.objet_id).split("/"); const e = EMPLOYES.find((e) => e.id == id); return `${e ? e.nom : id} (${j})`; }
  if (x.objet === "appareil" || x.objet === "employe") { const e = EMPLOYES.find((e) => e.id == x.objet_id); return e ? e.nom : ""; }
  if (x.objet === "parametre") return x.objet_id;
  return "";
}
