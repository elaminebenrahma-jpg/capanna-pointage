<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KeyNet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="keynet-icon.png">
<title>Capanna – Pointage</title>
<style>
:root{--vert:#C8F542;--vert-2:#B4DF2E;--or:#8A939D;--fond:#07080A;--carte:#111317;--ligne:rgba(255,255,255,.08);--texte:#F2F4F6;--gris:#8A939D;--rouge:#FF6B61;
  --carte-2:#171A1F;--carte-3:#1E2228;--sur-accent:#07080A;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --s-vert:#2E9E5B;--s-jaune:#D9A400;--s-orange:#E2742B;--s-rouge:#D2453F;--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte);
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 12px);font-size:15px;line-height:1.4}
header.marque{text-align:center;padding:22px 16px 6px}
header.marque img{display:block;width:160px;max-width:50%;height:auto;margin:0 auto}
header.marque p{margin:4px 0 0;color:var(--or);font-size:12px;letter-spacing:2px;text-transform:uppercase}
main{max-width:480px;margin:0 auto;padding:0 14px}
body.admin main{max-width:1100px}
.carte{background:var(--carte);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em} h2{font-size:20px} h3{font-size:16px}
.sous{color:var(--gris);font-size:14px;margin:4px 0 0}
.petit{font-size:13px;color:var(--gris)}
.cache{display:none!important}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:default}
.b-principal{background:var(--vert);color:#fff}.b-or{background:var(--or);color:#fff}
.b-sec{background:#EEE9DA;color:var(--texte);font-weight:500}.b-danger{background:#FBE7E6;color:var(--rouge)}
.b-lien{background:none;color:var(--vert);padding:6px 8px;font-weight:600}
.b-plein{width:100%}.b-grand{font-size:18px;padding:17px}
.pile{display:grid;gap:10px}.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ligne>.flex{flex:1;min-width:120px}
label{display:block;font-size:13px;color:var(--gris);margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border-radius:12px;border:1px solid #D8D2BF;background:#fff;font-size:16px;color:var(--texte)}
textarea{min-height:84px;resize:vertical}
.msg{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:14px}
.msg.bon{background:#E5F3EA;color:#145C33}.msg.mal{background:#FBE7E6;color:var(--rouge)}.msg.info{background:#F4EFE0;color:#5c4b22}
.wifi{display:flex;align-items:center;gap:10px}.pastille{width:11px;height:11px;border-radius:50%;background:#c9c9c9;flex:none}
.wifi.ok .pastille{background:var(--s-vert)}.wifi.ko .pastille{background:var(--rouge)}.wifi.attente .pastille{background:var(--s-orange)}
.journal-jour li.attente{color:var(--s-orange)}.bandeau-attente{border-left:4px solid var(--s-orange)}
.onglets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:8px 0 2px;-webkit-overflow-scrolling:touch}
.onglets::-webkit-scrollbar{display:none}
.onglet{flex:none;background:#E9E3D2;color:#3b3b3b;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;position:relative}
.onglet.actif{background:var(--vert);color:#fff}
.badge{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rouge);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:6px}
.puce{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#EEE9DA;color:#444;white-space:nowrap}
.puce.attente{background:#FFF4D6;color:#8A6400}.puce.complement{background:#FDEBDC;color:#9A4A12}.puce.validee{background:#E5F3EA;color:#145C33}
.puce.refusee{background:#FBE7E6;color:var(--rouge)}.puce.annulee{background:#eee;color:#777}.puce.manquant{background:#FBE7E6;color:var(--rouge)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}.kpi span{font-size:13px;color:var(--gris)}
.grille2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.liste{list-style:none;margin:0;padding:0}.liste li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid #F0EBDD}
.liste li:first-child{border-top:0}.liste .t{font-weight:600}.liste .flex{flex:1;min-width:0}
.cliquable{cursor:pointer}.cliquable:hover{background:#FBF9F3}
.tableau{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-top:1px solid #F0EBDD;vertical-align:middle;white-space:nowrap}
th{color:var(--gris);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.barre td{color:#aaa;text-decoration:line-through}
.resultat{display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px;border-radius:14px;background:#FBF9F3}
.resultat .t{font-weight:650;font-size:16px}
.journal-jour{list-style:none;padding:0;margin:12px 0 0}.journal-jour li{padding:7px 0;border-top:1px solid #F0EBDD}
.apercu{margin-top:10px;border:1px dashed #D8D2BF;border-radius:12px;padding:10px;display:flex;gap:12px;align-items:center}
.apercu img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#eee}
.apercu .doc{width:72px;height:72px;border-radius:8px;background:#F4EFE0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--or)}
.voile{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.feuille{background:var(--fond);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
@media(min-width:700px){.voile{align-items:center;padding:20px}.feuille{border-radius:20px}}
.feuille .entete{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.doc-vue img{max-width:100%;border-radius:12px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .j{background:#fff;border-radius:10px;min-height:64px;padding:5px;font-size:11px;overflow:hidden}
.cal .j.hors{opacity:.35}.cal .j.auj{outline:2px solid var(--vert)}
.cal .j .n{font-weight:700;font-size:12px;color:#555}.cal .j .ev{margin-top:3px;padding:2px 4px;border-radius:5px;background:#E5F3EA;color:#145C33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .j .ev.conge{background:#E6EEF9;color:#1E4C8F}.cal .j .ev.maladie{background:#FBE7E6;color:#8E1F19}.cal .j .ev.attente{background:#FFF4D6;color:#8A6400}
.cal .tete{font-size:11px;color:var(--gris);text-align:center;font-weight:600;padding:2px 0}
.creneaux-jour{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:start;padding:10px 0;border-top:1px solid #F0EBDD}
.creneau{display:grid;grid-template-columns:1fr 1fr 74px 32px;gap:6px;margin-bottom:6px}
.creneau input{padding:9px 8px;font-size:15px}
.x{background:#F4EFE0;border-radius:10px;padding:0;width:32px;height:40px;color:#666}
.graph svg{width:100%;height:auto;display:block}
.vide{color:var(--gris);text-align:center;padding:18px 8px;font-size:14px}
.retour{display:inline-flex;align-items:center;gap:4px}
/* smileys */
.smiley{display:inline-block;vertical-align:middle;max-width:100%;height:auto;flex:none}
.smiley-anime{animation:smiley-entree .45s cubic-bezier(.2,.8,.2,1) both}
.smiley-anime .smiley-visage{stroke-dasharray:126;stroke-dashoffset:126;animation:smiley-trait .6s .05s ease-out forwards}
.smiley-anime .smiley-oeil,.smiley-anime .smiley-bouche{opacity:0;animation:smiley-fondu .25s .45s ease-out forwards}
@keyframes smiley-entree{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes smiley-trait{to{stroke-dashoffset:0}}
@keyframes smiley-fondu{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.smiley-anime,.smiley-anime *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
/* impression (rapport PDF) */
/* ---------- barre de navigation flottante (espace gérant) ---------- */
:root{--nav-h:72px;--nav-bas:calc(env(safe-area-inset-bottom) + 12px);--nav-actif:#C8F542;--nav-inactif:#7C858F}
body.admin{padding-bottom:calc(var(--nav-h) + var(--nav-bas) + 28px)}
.nav-bas{position:fixed;z-index:40;left:50%;bottom:var(--nav-bas);transform:translateX(-50%);
  width:min(calc(100% - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)),720px);height:var(--nav-h);
  display:grid;grid-template-columns:repeat(var(--nav-n,6),minmax(0,1fr));align-items:stretch;padding:6px;border-radius:26px;
  background:rgba(242,243,243,.72);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 10px 30px -8px rgba(35,40,45,.20),0 2px 8px rgba(35,40,45,.06),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav-bas{background:rgba(242,243,243,.97)}}
.nav-bas.masquee{transform:translate(-50%,calc(100% + var(--nav-bas) + 8px));opacity:0;pointer-events:none}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;
  background:none;border-radius:20px;padding:2px 2px 9px;color:var(--nav-inactif);font-weight:560;font-size:10.5px;letter-spacing:.005em;line-height:1.1;
  transition:color .22s ease,transform .18s ease}
.nav-item svg{width:23px;height:23px;flex:none;stroke-width:1.9;transition:transform .28s cubic-bezier(.34,1.56,.64,1),stroke-width .2s}
.nav-item .nav-lib{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;padding-top:1px}
.nav-item>[data-badge]{position:absolute;inset:0;pointer-events:none}
.nav-item .nav-lib-court{display:none}
.nav-item::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;border-radius:2px;background:var(--nav-actif);
  transform:translateX(-50%) scale(0);opacity:0;transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .2s,width .28s}
.nav-item.actif{color:var(--nav-actif);font-weight:650}
.nav-item.actif svg{transform:scale(1.12) translateY(-1px);stroke-width:2.1}
.nav-item.actif::after{transform:translateX(-50%) scale(1);opacity:1;width:14px}
.nav-item:active{transform:scale(.93)}
.nav-item:focus-visible{outline:2px solid rgba(51,56,61,.45);outline-offset:-2px}
@media(hover:hover){.nav-item:not(.actif):hover{color:#5F6469}.nav-item:not(.actif):hover svg{transform:translateY(-1px)}}
.nav-pastille{position:absolute;top:3px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#D2453F;color:#fff;
  font-size:10.5px;font-weight:700;line-height:17px;text-align:center;box-shadow:0 0 0 2px rgba(242,243,243,.95)}
@media(max-width:400px){.nav-item .nav-lib-long{display:none}.nav-item .nav-lib-court{display:inline}.nav-item{font-size:10px}}
@media(min-width:700px){:root{--nav-h:76px}.nav-item{font-size:11.5px}.nav-item svg{width:24px;height:24px}}
@media(prefers-reduced-motion:reduce){.nav-bas,.nav-item,.nav-item svg,.nav-item::after{transition:none!important}}
.entete-g{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;min-height:40px}
.entete-g h2{font-size:22px}
.segments{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;gap:2px;padding:3px;margin:10px 0 2px;border-radius:12px;background:rgba(51,56,61,.07)}
.segments button{flex:none;white-space:nowrap;background:none;border-radius:9px;padding:7px 14px;font-size:14px;font-weight:600;color:#6E7378;transition:background .2s,color .2s}
.segments button.actif{background:#fff;color:var(--nav-actif);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* ---------- planning hebdomadaire ---------- */
.pl-barre{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:12px 0 8px}
.pl-sem{display:flex;align-items:center;gap:8px}
.pl-fl{width:40px;height:40px;padding:0;border-radius:12px;background:#fff;color:#33383D;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pl-fl svg{width:20px;height:20px}
.pl-titre{display:flex;flex-direction:column;line-height:1.2;padding:0 4px;min-width:0}.pl-titre b{font-size:16px;white-space:nowrap}.pl-titre>span{font-size:12px;color:var(--gris)}
.pl-auj{padding:0;font-size:12px}
.pl-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pl-actions select{width:auto;padding:10px 12px;font-size:14px}
.pl-actions button{padding:11px 15px;font-size:14px}
.pl-ic{display:inline-flex;align-items:center;justify-content:center;gap:8px}.pl-ic svg{width:17px;height:17px;flex:none}
.pl-bandeau{background:#FFF7E0;border:1px solid #F0DFA8;color:#6B5310;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:4px 0 8px}
.pl-bandeau b{display:block;margin-bottom:2px;color:#4f3c06}
.pl-legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--gris);margin:6px 2px 10px}
.pl-legende i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.pl-legende .pl-exc-l{width:7px;height:7px;border-radius:50%;background:#33383D;opacity:.55;vertical-align:0}
.pl-carte{padding:0;overflow:hidden;margin-top:4px}
.pl.edition .pl-carte{box-shadow:0 0 0 2px rgba(51,56,61,.22),0 4px 14px rgba(0,0,0,.05)}
.pl-scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.pl-table{border-collapse:separate;border-spacing:0;width:100%;min-width:880px;font-size:13px;table-layout:fixed}
.pl-table th,.pl-table td{border-top:1px solid #F0EBDD;padding:0;white-space:normal;vertical-align:top;text-align:left}
.pl-table thead th{position:sticky;top:0;background:#FBF9F3;z-index:2;text-align:center;padding:10px 4px;font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;border-top:0;border-bottom:1px solid #EDE7D6;font-weight:600}
.pl-table thead th b{display:block;font-size:17px;color:var(--texte);letter-spacing:0;margin:3px auto 0;width:30px;height:30px;line-height:30px;border-radius:9px}
.pl-table thead th.auj{color:var(--vert)}.pl-table thead th.auj b{color:#fff;background:var(--vert)}
.pl-table thead th.passe b{color:#9a9a9a}
.pl-col-nom{position:sticky;left:0;z-index:1;background:#fff;text-align:left!important;min-width:172px;width:172px;padding:10px 12px!important;border-right:1px solid #F0EBDD;vertical-align:middle!important}
.pl-table thead .pl-col-nom{z-index:3;background:#FBF9F3;vertical-align:bottom!important}
.pl-nom{font-weight:650;font-size:14px;color:var(--texte);text-transform:none;letter-spacing:0}
.pl-poste{font-size:12px;color:var(--gris);font-weight:500;text-transform:none;letter-spacing:0;margin-top:1px}
.pl-neuf{display:inline-block;font-size:10px;font-weight:700;background:#33383D;color:#fff;border-radius:5px;padding:1px 5px;vertical-align:1px;letter-spacing:.03em}
.pl-retirer{padding:2px 0;font-size:12px;color:var(--rouge)}
.pl-sel-poste{width:100%;margin-top:5px;padding:5px 7px;font-size:12.5px;border-radius:8px}
.pl-col-tot{text-align:right!important;padding:10px 12px!important;color:#55595d;font-variant-numeric:tabular-nums;width:76px;font-weight:650;vertical-align:middle!important}
.pl-table thead .pl-col-tot{vertical-align:bottom!important}
.pl-groupe td{background:#F7F4EC;padding:7px 0!important;font-size:11.5px;font-weight:700;color:#4a4a4a;text-transform:uppercase;letter-spacing:.06em}
.pl-groupe .st{position:sticky;left:12px;display:inline-flex;align-items:center;gap:7px;padding-left:12px}
.pl-groupe .nb{font-weight:600;color:#9a9a9a}
.pl-pastille{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pl-case{min-width:98px;position:relative}
.pl-case-in{display:flex;flex-direction:column;gap:3px;padding:7px 6px;min-height:56px;border-radius:9px;transition:background .15s}
.pl-case.auj{background:rgba(11,79,60,.035)}
.pl-case.passe .pl-case-in{opacity:.55}
.pl-cr{display:block;background:#F4F5F6;border-left:3px solid var(--c);border-radius:6px;padding:4px 6px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;color:#2b2f33;white-space:nowrap}
.pl-cr.barre{text-decoration:line-through;color:#a3a3a3;border-left-color:#d4d4d4;font-weight:500}
.pl-repos{display:block;text-align:center;color:#A6A9AC;font-size:12px;padding:6px 0;border:1px dashed #E3E0D7;border-radius:6px}
.pl-repos.grand{padding:16px;font-size:14px;margin-top:10px}
.pl-plus{display:block;text-align:center;color:#9AA0A6;font-size:18px;line-height:1;padding:7px 0;border:1px dashed #D5D8DB;border-radius:6px}
.pl-abs{display:block;border-radius:6px;padding:4px 6px;font-size:12px;font-weight:650;text-align:center}
.t-conge{background:#E6EEFA;color:#2F5A9A}.t-maladie{background:#FBEAEA;color:#A33B3B}.t-absence_autorisee{background:#EFEAF8;color:#664A9E}.t-absence_injustifiee{background:#F3F0EA;color:#7A6A4A}
.pl-tag{display:block;font-size:11px;font-weight:600;color:#8A6400;background:#FFF4D6;border-radius:5px;padding:2px 5px;text-align:center;white-space:nowrap}
.pl-tag.attente{color:#7a7a7a;background:#F0EEE8;font-weight:500}
.pl-exc{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#33383D;opacity:.5}
.pl-eff{text-align:center!important;padding:8px 4px!important;font-weight:650;color:#55595d;font-variant-numeric:tabular-nums;background:#FBF9F3}
.pl-table tfoot .pl-col-nom{background:#FBF9F3}
.pl-case.editable{cursor:pointer}
.pl-case.editable:hover .pl-case-in{background:rgba(51,56,61,.05)}
.pl-case.editable:focus-visible{outline:none}.pl-case.editable:focus-visible .pl-case-in{box-shadow:inset 0 0 0 2px rgba(51,56,61,.5)}
.pl-case.modifie .pl-case-in,.pl-ligne.modifie{box-shadow:inset 0 0 0 2px #33383D;background:#FAFAF8}
.pl.edition .pl-case.passe{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.03) 6px 12px)}
.pl-ajout{margin-top:12px;border:1.5px dashed #CFC9B8;background:transparent}
.pl-mob,.pl-jchips,.pl-jliste{display:none}
.pl-jchips{grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0 6px}
.pl-jchips button{background:#fff;border-radius:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--gris);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .15s,color .15s}
.pl-jchips button b{font-size:16px;color:var(--texte)}
.pl-jchips button.actif{background:#33383D;color:#d9dbdd}.pl-jchips button.actif b{color:#fff}
.pl-jchips button.auj:not(.actif){box-shadow:inset 0 0 0 1.5px var(--vert)}
.pl-grp{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#4a4a4a;margin:16px 4px 6px;display:flex;align-items:center;gap:7px}

.g-ligne{transition:background .4s}.g-ligne.hors{background:rgba(255,107,97,.05)}.g-ligne.hors .g-av{box-shadow:0 0 0 2px #FF7A70}
.g-ligne.a_verifier .g-av{box-shadow:0 0 0 2px #F3A36B}.g-ligne.dans .g-av{box-shadow:0 0 0 2px rgba(95,211,139,.7)}
.g-prio{flex:none;width:4px;align-self:stretch;border-radius:2px;background:#F3A36B;margin-right:8px}
.g-alerte.haute .g-prio{background:#FF7A70}.g-alerte.info .g-prio{background:#5FD38B}
.g-barres{display:grid;gap:8px}.g-barre{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.g-barre .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.g-barre .v{color:var(--gris);font-size:12px;white-space:nowrap}
.g-barre .b{position:relative;height:10px;border-radius:5px;background:var(--carte-3);overflow:hidden}
.g-barre .b i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:rgba(242,244,246,.35)}.g-barre .b i.nj{background:#FF7A70}
.g-leg{display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(242,244,246,.35);vertical-align:-1px}.g-leg.nj{background:#FF7A70}
.g-param{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ligne)}.g-param:first-of-type{border-top:0}.g-param label{margin:0}
@media(prefers-reduced-motion:reduce){.g-rouge i{animation:none}}
/* ================= fin du thème sombre ================= */
#impression{display:none}
@media print{
  body{background:#fff;padding:0}body>*:not(#impression){display:none!important}
  #impression{display:block;font-size:12px;color:#000}#impression h1{font-size:20px}#impression table{font-size:11px}
  #impression th,#impression td{white-space:normal;padding:5px 6px;border-top:1px solid #ddd}
  #impression .kpis{grid-template-columns:repeat(4,1fr)}#impression .kpi{box-shadow:none;border:1px solid #ddd;padding:8px}#impression .kpi b{font-size:18px}
  @page{margin:14mm}
}
</style>

// ---------- Mon planning (lecture seule) ----------
async function vueMonPlanning() {
  const v = $("#vue-e"), js = E.etat.jour_service;
  E.plMode ||= "semaine"; E.plRef ||= lundiDe(js);
  let debut, fin;
  if (E.plMode === "semaine") { debut = E.plRef; fin = plusJours(debut, 6); }
  else { const m1 = debutMois(E.plRef); debut = lundiDe(m1); const fm = finMois(m1); fin = plusJours(fm, 7 - dow(fm)); }
  v.innerHTML = `<div class="carte"><div class="vide">Chargement de ton planning…</div></div>`;
  let r;
  try { r = await api({ action: "mon_planning", token: E.token, debut, fin }); } catch (e) { return msg(v, e.message); }
  const parJour = {}, absJ = {}, attJ = {};
  for (const p of r.planning) (parJour[p.jour] ||= []).push(p);
  const etaler = (l, cible) => { for (const a of l) for (let j = a.date_debut < debut ? debut : a.date_debut; j <= a.date_fin && j <= fin; j = plusJours(j, 1)) (cible[j] ||= []).push(a); };
  etaler(r.absences, absJ); etaler(r.en_attente, attJ);
  const absTotale = (j) => (absJ[j] || []).find((a) => ABS_JOUR.includes(a.type) && !a.heure_debut);
  const contenu = (j, grand) => {
    const crs = (parJour[j] || []).sort((a, b) => a.ordre - b.ordre), at = absTotale(j);
    let h = at ? `<span class="pl-abs t-${at.type}">${LIB_TYPE[at.type]}</span>` : "";
    if (crs.length) h += crs.map((c) => `<span class="mp-h ${at ? "barre" : ""}">${c.debut.replace(":", "h")} – ${c.fin.replace(":", "h")}${grand && c.pause_min ? `<small>pause ${c.pause_min} min</small>` : ""}</span>`).join("");
    else if (!at) h += `<span class="mp-repos">Repos</span>`;
    for (const a of (absJ[j] || []).filter((x) => x !== at)) h += `<span class="pl-tag">${LIB_TYPE[a.type]}${a.type === "retard_justifie" && a.heure_fin ? ` · arrivée ${hcourt(a.heure_fin)}` : ""}${a.type === "depart_anticipe" && a.heure_debut ? ` · départ ${hcourt(a.heure_debut)}` : ""}</span>`;
    if (attJ[j]) h += `<span class="pl-tag attente">Demande en attente</span>`;
    if (crs.some((c) => c.source === "jour")) h += `<span class="mp-chg">Changement pour ce jour</span>`;
    return h;
  };
  const titre = E.plMode === "semaine" ? titreSemaine(debut, fin) : `${MOIS[+E.plRef.slice(5, 7) - 1].replace(/^./, (c) => c.toUpperCase())} ${E.plRef.slice(0, 4)}`;
  let corps = "";
  if (E.plMode === "semaine") {
    let jours = 0, minutes = 0;
    const liste = [0, 1, 2, 3, 4, 5, 6].map((i) => plusJours(debut, i)).map((j) => {
      const crs = parJour[j] || [];
      if (crs.length && !absTotale(j)) { jours++; minutes += crs.reduce((s, c) => s + dureeCr(c), 0); }
      return `<div class="mp-jour ${j === js ? "auj" : ""} ${j < js ? "passe" : ""} ${j === E.plFocus ? "focus" : ""}" id="mp-${j}">
        <div class="mp-date"><span>${JOURS_C[dow(j)]}</span><b>${+j.slice(8)}</b>${j === js ? `<i>Aujourd'hui</i>` : ""}</div><div class="mp-info">${contenu(j, true)}</div></div>`;
    }).join("");
    corps = `<div class="mp-resume">${jours} jour${jours > 1 ? "s" : ""} de travail · ${fmtDuree(minutes)} prévues</div>${liste}`;
  } else {
    const m = E.plRef.slice(0, 7);
    E.plFocus = E.plFocus && E.plFocus.startsWith(m) ? E.plFocus : (js.startsWith(m) ? js : debutMois(E.plRef));
    const cases = [];
    for (let j = debut; j <= fin; j = plusJours(j, 1)) {
      const crs = parJour[j] || [], at = absTotale(j), hors = !j.startsWith(m);
      const mini = at ? `<i class="mp-pt t-${at.type}"></i>` : crs.length ? `<small>${crs[0].debut.replace(":", "h").replace(/h00$/, "h")}</small>` : `<small class="r">R</small>`;
      cases.push(`<button class="mp-c ${hors ? "hors" : ""} ${j === js ? "auj" : ""} ${j === E.plFocus ? "sel" : ""} ${crs.length && !at ? "travail" : ""}" data-j="${j}" aria-label="${dateFr(j)}">
        <b>${+j.slice(8)}</b>${hors ? "" : mini}</button>`);
    }
    corps = `<div class="carte mp-mois"><div class="mp-sem">${["L", "M", "M", "J", "V", "S", "D"].map((x) => `<span>${x}</span>`).join("")}</div><div class="mp-grille">${cases.join("")}</div>
      <p class="petit" style="margin:10px 2px 0">« R » = repos. Touche un jour pour voir le détail.</p></div>
      <div class="mp-jour detail"><div class="mp-date"><span>${JOURS_C[dow(E.plFocus)]}</span><b>${+E.plFocus.slice(8)}</b></div><div class="mp-info">${contenu(E.plFocus, true)}</div></div>`;
  }
  v.innerHTML = `<div class="mp">
    <div class="ligne" style="justify-content:space-between;margin-top:10px">
      <div class="segments" role="tablist" style="margin:0"><button data-m="semaine" class="${E.plMode === "semaine" ? "actif" : ""}">Semaine</button><button data-m="mois" class="${E.plMode === "mois" ? "actif" : ""}">Mois</button></div>
      <span class="petit">${esc(r.service)}</span></div>
    <div class="pl-sem" style="margin:12px 0 8px"><button class="pl-fl" data-nav="-1" aria-label="Précédent">${svgPl("g")}</button>
      <div class="pl-titre" style="flex:1;text-align:center;align-items:center"><b>${titre}</b>${(E.plMode === "semaine" ? debut <= js && js <= fin : js.startsWith(E.plRef.slice(0, 7))) ? "" : `<button class="b-lien pl-auj" data-nav="0">Revenir à aujourd'hui</button>`}</div>
      <button class="pl-fl" data-nav="1" aria-label="Suivant">${svgPl("d")}</button></div>
    ${corps}
    <p class="petit mp-note">Planning en lecture seule, mis à jour par ton responsable. Tu es prévenu à chaque changement.</p></div>`;
  $$("[data-m]", v).forEach((b) => b.onclick = () => { E.plMode = b.dataset.m; E.plRef = E.plMode === "semaine" ? lundiDe(E.plFocus || js) : debutMois(E.plFocus || js); vueMonPlanning(); });
  $$("[data-nav]", v).forEach((b) => b.onclick = () => {
    const n = +b.dataset.nav;
    if (!n) { E.plRef = E.plMode === "semaine" ? lundiDe(js) : debutMois(js); E.plFocus = js; }
    else if (E.plMode === "semaine") E.plRef = plusJours(E.plRef, 7 * n);
    else { const d = new Date(E.plRef + "T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() + n, 1); E.plRef = d.toISOString().slice(0, 10); }
    vueMonPlanning();
  });
  $$(".mp-c[data-j]", v).forEach((b) => b.onclick = () => { E.plFocus = b.dataset.j; if (!b.dataset.j.startsWith(E.plRef.slice(0, 7))) E.plRef = debutMois(b.dataset.j); vueMonPlanning(); });
  if (E.plMode === "semaine" && E.plFocus) setTimeout(() => $(`#mp-${E.plFocus}`)?.scrollIntoView({ block: "center", behavior: "smooth" }), 80);
}

// ---------- compte à rebours : temps restant avant la fin du service en cours ----------
const secServiceDe = (d) => { // secondes depuis minuit de la journée de service (avant 05h00 = nuit suivante)
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));
  const s = +p.hour * 3600 + +p.minute * 60 + +p.second;
  return +p.hour < 5 ? s + 86400 : s;
};
const minService = (h) => { const m = +h.slice(0, 2) * 60 + +h.slice(3, 5); return m < 300 ? m + 1440 : m; };
async function creneauxDuJourE() {
  const js = E.etat.jour_service;
  if (E.crJour?.js === js) return E.crJour.l;
  try {
    const r = await api({ action: "mon_planning", token: E.token, debut: js, fin: js });
    E.crJour = { js, l: (r.planning || []).filter((x) => String(x.jour).slice(0, 10) === js) };
  } catch { return []; }
  return E.crJour.l;
}
async function lancerCompte(arrivee) {
  clearInterval(E.minuteur);
  const z = $("#p-compte"); if (!z) return;
  if (!arrivee) { z.innerHTML = ""; return; }
  const crs = await creneauxDuJourE();
  if (!crs.length || !$("#p-compte")) { z.innerHTML = ""; return; }
  const a = secServiceDe(new Date(arrivee.horodatage)) / 60;
  const plages = crs.map((c) => { const d = minService(c.debut); let f = minService(c.fin); if (f <= d) f += 1440; return { c, d, f }; });
  const cr = plages.sort((x, y) => Math.abs(a - x.d) - Math.abs(a - y.d))[0];
  const deux = (n) => String(n).padStart(2, "0");
  const tic = () => {
    const el = $("#p-compte"); if (!el) return clearInterval(E.minuteur);
    const now = secServiceDe(new Date()), reste = cr.f * 60 - now;
    const total = (cr.f - cr.d) * 60, fait = Math.min(100, Math.max(0, 100 * (now - cr.d * 60) / total));
    if (reste <= 0) {
      const dep = Math.floor(-reste / 60);
      el.innerHTML = `<div class="compte fini"><div class="lib">Service terminé</div><div class="chrono">${cr.c.fin}</div>
        <div class="petit">Ta fin de service était prévue à ${cr.c.fin}${dep ? ` (il y a ${duree(dep)})` : ""}. Pense à pointer ton départ.</div></div>`;
      return clearInterval(E.minuteur);
    }
    const h = Math.floor(reste / 3600), m = Math.floor(reste % 3600 / 60), sec = reste % 60;
    const txt = `${deux(h)}<small>h</small>${deux(m)}<small>min</small>${deux(sec)}<small>s</small>`;
    const chrono = el.querySelector(".compte:not(.fini) .chrono");
    if (chrono) { chrono.innerHTML = txt; el.querySelector(".barre i").style.width = fait.toFixed(1) + "%"; return; }
    el.innerHTML = `<div class="compte"><div class="lib">Fin du service dans</div>
      <div class="chrono" aria-live="off">${txt}</div>
      <div class="petit">Service ${cr.c.debut} – ${cr.c.fin}</div><div class="barre"><i style="width:${fait.toFixed(1)}%"></i></div></div>`;
  };
  tic(); E.minuteur = setInterval(tic, 1000);
}

// position du téléphone (jamais bloquant : sans réponse en 10 s, on pointe sans)
// Mesure la position et la relance automatiquement tant que la précision dépasse 10 m (20 s au plus).
// Renvoie la meilleure mesure obtenue, ou null si la localisation est refusée ou indisponible.
function position(suivi = () => {}, cible = 10, maxMs = 20000) {
  return new Promise((ok) => {
    position.erreur = null;
    if (!navigator.geolocation) { position.erreur = "indisponible"; return ok(null); }
    // plusieurs mesures sur quelques secondes : un vrai GPS varie légèrement, une fausse position non
    let meilleure = null, fini = false, id = null; const ech = [], t0 = Date.now();
    const fin = () => { if (fini) return; fini = true; if (id !== null) navigator.geolocation.clearWatch(id); if (meilleure) meilleure.echantillons = ech.slice(-12); ok(meilleure); };
    setTimeout(() => { if (!meilleure && !position.erreur) position.erreur = "delai"; fin(); }, maxMs);
    id = navigator.geolocation.watchPosition((p) => {
      const m = { lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy };
      ech.push({ lat: m.lat, lng: m.lng, acc: m.precision, t: p.timestamp });
      if (!meilleure || m.precision < meilleure.precision) meilleure = m;
      if (meilleure.precision <= cible && ech.length >= 3 && Date.now() - t0 >= 2500) return fin();
      suivi(Math.round(meilleure.precision));
    }, (e) => { if (!meilleure) position.erreur = e?.code === 1 ? "refusee" : e?.code === 3 ? "delai" : "indisponible"; fin(); }, { enableHighAccuracy: true, maximumAge: 0, timeout: maxMs });
  });
}

const AVEC_ARRIVEE = (r) => r.arrivee_min !== null && r.arrivee_min !== undefined;
function stats(rows) {
  const arr = rows.filter(AVEC_ARRIVEE), prev = arr.filter((r) => r.prevu_debut);
  const ret = rows.filter((r) => r.retard_min > 0);
  const cumul = ret.reduce((s, r) => s + r.retard_min, 0);
  const abs = new Set(rows.filter((r) => r.statut === "absence_injustifiee").map((r) => r.employe_id + "|" + r.jour));
  const absJ = new Set(rows.filter((r) => r.statut === "absence_justifiee").map((r) => r.employe_id + "|" + r.jour));
  return {
    nb_retards: ret.length, cumul, moyenne: ret.length ? Math.round(cumul / ret.length) : 0,
    ponctualite: prev.length ? Math.round(100 * prev.filter((r) => r.retard_min === 0).length / prev.length) : null,
    a_lheure: prev.filter((r) => r.retard_min === 0).length, jours_prevus: prev.length,
    jours: new Set(arr.map((r) => r.employe_id + "|" + r.jour)).size, absences: abs.size, absences_justifiees: absJ.size,
    heures_sup: rows.reduce((s, r) => s + (r.heures_sup_min || 0), 0), travail: rows.reduce((s, r) => s + (r.travail_min || 0), 0),
    anomalies: rows.filter((r) => ["depart_non_pointe", "coupure_non_pointee"].includes(r.statut)).length,
  };
}
// « 0 % » après un seul jour induit en erreur : on affiche le nombre de jours à l'heure
const aLheure = (s) => s.jours_prevus ? `${s.a_lheure}/${s.jours_prevus} jour${s.jours_prevus > 1 ? "s" : ""} à l'heure` : "pas encore de jour prévu";
function filtrer(rows, f) {
  return rows.filter((r) => (!f.employe || r.employe_id === +f.employe) && (!f.service || r.service === f.service));
}
function niveauMois(rows) {
  const c = G.cfg.mois, s = stats(rows);
  let n = s.nb_retards > 0 ? 1 : 0;
  for (let i = 0; i < 3; i++) if (s.nb_retards >= c.nombre[i] || s.cumul >= c.minutes[i]) n = Math.max(n, i + 2);
  return { smiley: c.smileys[n], niveau: n, s };
}
function barres(series, opts = {}) {
  // histogramme simple en SVG : [{ etiquette, valeur }]
  const w = 640, h = 190, g = 34, b = 22, max = Math.max(1, ...series.map((x) => x.valeur));
  const pas = (w - g - 8) / Math.max(1, series.length), lb = Math.min(46, pas * 0.6);
  const y = (v) => h - b - (v / max) * (h - b - 18);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.titre || "")}">
    <line x1="${g}" x2="${w}" y1="${h - b}" y2="${h - b}" class="axe" stroke="#2A2F36"/>
    ${series.map((x, i) => { const cx = g + pas * i + pas / 2; return `<g><rect x="${cx - lb / 2}" y="${y(x.valeur)}" width="${lb}" height="${h - b - y(x.valeur)}" rx="5" fill="${x.couleur || "#C8F542"}" opacity="${x.valeur ? 1 : .25}"><title>${esc(x.etiquette)} : ${esc(opts.format ? opts.format(x.valeur) : x.valeur)}</title></rect>
      <text x="${cx}" y="${y(x.valeur) - 5}" text-anchor="middle" font-size="11" class="val" fill="#C9CFD5">${x.valeur ? esc(opts.format ? opts.format(x.valeur) : x.valeur) : ""}</text>
      <text x="${cx}" y="${h - 6}" text-anchor="middle" font-size="11" class="eti" fill="#8A939D">${esc(x.etiquette)}</text></g>`; }).join("")}
  </svg>`;
}

// signaux qui doivent attirer l'œil du responsable avant de valider
function alertesAttente(x, liste) {
  const a = [];
  if (/suspecte/.test(x.raison || "")) a.push("Position suspecte");
  if (/hors planning/.test(x.raison || "")) a.push("Hors planning");
  const autre = liste.find((y) => y.id !== x.id && y.employe_id === x.employe_id && y.type !== x.type && Math.abs(new Date(y.horodatage) - new Date(x.horodatage)) < 10 * 60e3);
  if (autre) a.push(`Arrivée et départ à ${Math.max(1, Math.round(Math.abs(new Date(autre.horodatage) - new Date(x.horodatage)) / 60e3))} min d'intervalle`);
  return a.length ? `<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${a.map((t) => `<span class="puce refusee">${esc(t)}</span>`).join("")}</div>` : "";
}
// tant que les notifications ne sont pas actives sur ce téléphone, on le propose en haut du tableau de bord
async function proposerPushGerant(v) {
  const etat = await etatPush();
  if (etat === "actif" || etat === "indisponible" || !v.isConnected) return;
  let cle = null; try { cle = (await ga({ action: "admin_notifications", limite: 1 })).vapid; } catch {}
  if (!v.isConnected || $("[data-push-zone]", v)) return;

  brancherPush(v, "gerant", cle, (abonnement) => ga({ action: "admin_push_abonner", abonnement }));
}

async function voirNotifications() {
  const n = await ga({ action: "admin_notifications" });
  const liste = n.notifications || [];
  const f = feuille(`<div class="entete"><h2>Notifications</h2><button class="b-sec" data-fermer>Fermer</button></div>

  $("#gn-tout", f.el).onclick = async () => { await ga({ action: "admin_notifications", marquer_lues: true }); f.fermer(); rafraichirBadges(); voirNotifications(); };
  $$("[data-n]", f.el).forEach((b) => b.onclick = async () => {

// ---------- Calendrier des absences ----------
async function vueCalendrier(v, mois) {
  G.moisCal = mois || G.moisCal || G.js.slice(0, 7);
  const debut = G.moisCal + "-01", fin = finMois(debut);
  const fc = G.filtreCal ||= { employe: "", service: "", attente: false };
  const r = await ga({ action: "admin_calendrier", debut, fin, employe_id: fc.employe || undefined, service: fc.service || undefined, inclure_attente: fc.attente });
  const ev = r.evenements || [];
  const prem = lundiDe(debut), cases = [];
  for (let d = prem; d <= fin || dow(d) !== 1; d = plusJours(d, 1)) cases.push(d);
  const [y, m] = G.moisCal.split("-").map(Number);
  const autre = (k) => { const d = new Date(Date.UTC(y, m - 1 + k, 1)); return d.toISOString().slice(0, 7); };
  v.innerHTML = `<div class="carte"><div class="ligne"><button class="b-sec" id="c-prec">‹</button><h2 class="flex" style="text-align:center">${MOIS[m - 1]} ${y}</h2><button class="b-sec" id="c-suiv">›</button></div>
    <div class="ligne" style="margin-top:10px"><select id="c-emp" class="flex">${optionsEmployes(fc.employe)}</select><select id="c-srv" class="flex">${optionsServices(fc.service)}</select>
    <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--texte)"><input type="checkbox" id="c-att" style="width:auto" ${fc.attente ? "checked" : ""}> Inclure les demandes en attente</label></div></div>
    <div class="cal">${[1, 2, 3, 4, 5, 6, 7].map((j) => `<div class="tete">${JOURS_C[j]}</div>`).join("")}
    ${cases.map((d) => { const du = ev.filter((x) => x.date_debut <= d && x.date_fin >= d);
      return `<div class="j ${d.slice(0, 7) !== G.moisCal ? "hors" : ""} ${d === G.js ? "auj" : ""}"><div class="n">${+d.slice(8)}</div>${du.map((x) => `<div class="ev ${x.statut !== "validee" ? "attente" : x.type}" title="${esc(x.hr_employes?.nom + " · " + LIB_TYPE[x.type])}">${esc((x.hr_employes?.nom || "").split(" ")[0])}</div>`).join("")}</div>`; }).join("")}</div>
    <div class="carte"><h3>Liste</h3><ul class="liste">${ev.map((x) => `<li class="cliquable" data-dem="${x.id}"><div class="flex"><div class="t">${esc(x.hr_employes?.nom)} · ${esc(LIB_TYPE[x.type])}</div><div class="petit">${esc(x.hr_employes?.service)} · ${esc(periodeDemande(x))}</div></div><span class="puce ${CLASSE_STATUT[x.statut]}">${LIB_STATUT[x.statut]}</span></li>`).join("") || `<li class="vide">Aucune absence ce mois-ci.</li>`}</ul></div>`;
  $("#c-prec").onclick = () => allerA("calendrier", autre(-1)); $("#c-suiv").onclick = () => allerA("calendrier", autre(1));
  $("#c-emp").onchange = (e) => { fc.employe = e.target.value; allerA("calendrier"); };
  $("#c-srv").onchange = (e) => { fc.service = e.target.value; allerA("calendrier"); };
  $("#c-att").onchange = (e) => { fc.attente = e.target.checked; allerA("calendrier"); };
  $$("[data-dem]", v).forEach((li) => li.onclick = () => ficheDemande(+li.dataset.dem));
}

async function vuePointages(v, arg) {
  const fp = G.filtreP ||= { jour: G.js, employe: "" };
  if (arg?.employe) fp.employe = String(arg.employe);
  const [pts, jr] = await Promise.all([ga({ action: "admin_pointages", debut: fp.jour, fin: fp.jour, employe_id: fp.employe || undefined }), ga({ action: "admin_journees", debut: fp.jour, fin: fp.jour })]);
  const emo = {}; jr.journees.forEach((r) => { if (r.emoji_jour) emo[r.employe_id] = r.emoji_jour; });
  // une ligne par employé et par service : arrivée et départ côte à côte
  const resume = jr.journees.filter((r) => r.statut !== "a_venir" || r.arrivee_min !== null)
    .filter((r) => !fp.employe || r.employe_id === +fp.employe)
    .sort((a, b) => a.nom.localeCompare(b.nom) || a.creneau_ordre - b.creneau_ordre);

    ${resume.map((r) => `<tr class="cliquable" data-fiche="${r.employe_id}"><td>${r.emoji_jour ? smileyDe(r.emoji_jour, 22) : ""}</td><td>${esc(r.nom)}</td>
      <td>${r.prevu_debut ? hcourt(r.prevu_debut) + "–" + hcourt(r.prevu_fin) : "—"}</td><td>${hhmm(r.arrivee_min)}</td>
      <td>${r.depart_min !== null && r.depart_min !== undefined ? hhmm(r.depart_min) : r.arrivee_min !== null && r.arrivee_min !== undefined ? `<span class="petit">${r.statut === "present" ? "en service" : "non pointé"}</span>` : "—"}</td>
      <td class="num">${r.retard_min ? r.retard_min + " min" : "—"}</td><td class="num">${r.travail_min ? duree(r.travail_min) : "—"}</td>
      <td>${esc(LIB_JOUR[r.statut] || r.statut)}</td></tr>`).join("") || `<tr><td colspan="8" class="vide">Personne n'était prévu ni n'a pointé ce jour-là.</td></tr>`}
    </tbody></table></div></div>
    <div class="carte"><h3>Détail des pointages</h3><div class="tableau"><table><thead><tr><th></th><th>Employé</th><th>Type</th><th>Heure</th><th>Source</th><th>Détail</th><th></th></tr></thead><tbody>
    ${pts.pointages.map((p) => { const e = employeDe(p.employe_id) || {}; return `<tr class="${p.annule ? "barre" : ""}"><td>${p.type === "arrivee" && !p.annule && p.accepte && emo[p.employe_id] ? smileyDe(emo[p.employe_id], 22) : ""}</td>
      <td>${esc(e.nom || "?")}</td><td>${p.type === "arrivee" ? "Arrivée" : "Départ"}</td><td>${esc(p.heure)}</td>
      <td>${p.accepte ? ({ manuel: "Manuel", gps: "Position GPS", collegue: "Code d'un collègue" }[p.source] || (p.verif === "valide_gerant" ? "Validé par le gérant" : p.verif === "valide_reseau" ? "Réseau reconnu" : "Wi-Fi"))
        : p.verif === "a_verifier" ? `<span class="puce attente">À vérifier</span>` : p.verif === "doublon" ? `<span class="petit">Tentative répétée</span>` : `<span class="puce refusee">Refusé</span>`}</td>
      <td class="petit" style="white-space:normal;max-width:260px">${esc(p.annule ? "Annulé" : p.motif || (p.source === "collegue" || p.verif === "valide_gerant" ? p.verif_detail || "" : ""))}${p.remplace_id ? " (correction)" : ""}</td>

    <label>Heure (journée du ${esc(dateFr(fp.jour))} ; avant 05h00 = nuit suivante)</label><input type="time" id="m-heure">` });
}

// ---------- Horaires ----------
async function vueHoraires(v, id) {
  G.empH = id ? String(id) : (G.empH || String(G.equipe.find((x) => x.actif)?.id || ""));
  const cr = (await ga({ action: "admin_creneaux", employe_id: G.empH })).creneaux;
  const parJour = {}; for (let j = 1; j <= 7; j++) parJour[j] = cr.filter((c) => c.jour === j).map((c) => ({ debut: c.debut.slice(0, 5), fin: c.fin.slice(0, 5), pause_min: c.pause_min }));
  const ligneC = (c) => `<div class="creneau"><input type="time" value="${c.debut}" data-k="debut" aria-label="Début"><input type="time" value="${c.fin}" data-k="fin" aria-label="Fin"><input type="number" min="0" max="240" value="${c.pause_min || 0}" data-k="pause_min" aria-label="Pause (min)" title="Pause en minutes"><button class="x" data-suppr aria-label="Retirer">×</button></div>`;
  v.innerHTML = `<div class="carte"><label>Employé</label><select id="h-emp">${optionsEmployes(G.empH, "Choisir…")}</select>
    <p class="petit" style="margin-top:8px">Pour chaque jour : début, fin et pause (minutes). Aucun créneau = jour OFF. Un service après minuit se termine le lendemain (ex. 19:00 → 02:00).</p>
    <div id="h-jours">${[1, 2, 3, 4, 5, 6, 7].map((j) => `<div class="creneaux-jour" data-j="${j}"><div><b>${JOURS[j]}</b><div><button class="b-lien" data-ajout style="padding:4px 0">+ créneau</button></div></div>
      <div data-liste>${parJour[j].map(ligneC).join("") || `<span class="petit">OFF</span>`}</div></div>`).join("")}</div>
    <div id="h-msg"></div><div class="pile" style="margin-top:12px"><button class="b-principal" id="h-ok">Enregistrer les modifications</button></div></div>`;
  $("#h-emp").onchange = (e) => allerA("horaires", e.target.value);
  const lire = (bloc) => $$(".creneau", bloc).map((l) => ({ debut: $('[data-k="debut"]', l).value, fin: $('[data-k="fin"]', l).value, pause_min: +$('[data-k="pause_min"]', l).value || 0 })).filter((c) => c.debut && c.fin);
  const origine = JSON.stringify(parJour);
  $$(".creneaux-jour", v).forEach((bloc) => {
    const liste = $("[data-liste]", bloc);
    const brancher = () => $$("[data-suppr]", liste).forEach((b) => b.onclick = () => { b.parentElement.remove(); if (!$(".creneau", liste)) liste.innerHTML = `<span class="petit">OFF</span>`; });
    $("[data-ajout]", bloc).onclick = () => { if ($$(".creneau", liste).length >= 4) return; if (!$(".creneau", liste)) liste.innerHTML = ""; liste.insertAdjacentHTML("beforeend", ligneC({ debut: "", fin: "", pause_min: 0 })); brancher(); };
    brancher();
  });
  $("#h-ok").onclick = () => {
    const nouveaux = {}; $$(".creneaux-jour", v).forEach((b) => nouveaux[b.dataset.j] = lire(b));
    const changes = Object.keys(nouveaux).filter((j) => JSON.stringify(nouveaux[j]) !== JSON.stringify(JSON.parse(origine)[j]));
    if (!changes.length) return msg($("#h-msg"), "Aucune modification.", "info");
    demanderMotif("Enregistrer les horaires", `${changes.length} jour(s) modifié(s) : ${changes.map((j) => JOURS[j]).join(", ")}.`, async (m) => {
      for (const j of changes) await ga({ action: "admin_creneaux_enregistrer", employe_id: G.empH, jour: +j, creneaux: nouveaux[j], motif: m });
      allerA("horaires", G.empH);
    }, { placeholder: "Ex. : nouveau planning de décembre" });
  };
}

const svgPl = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC_PL[k]}</svg>`;
const COUL_POSTES = ["#5B7FA6", "#B07A3B", "#5E8C6A", "#9A5C8F", "#7A7F86", "#A65B5B", "#4F8A8B", "#8C8A3E"];
function couleurPoste(s) {
  const l = [...new Set((PL.d?.employes || []).map((e) => e.service))].sort();
  let i = l.indexOf(s); if (i < 0) i = [...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0);
  return COUL_POSTES[i % COUL_POSTES.length];
}
const cleCase = (e, j) => `${e}|${j}`;
const minH = (h) => +h.slice(0, 2) * 60 + +h.slice(3, 5);
const dureeCr = (c) => { let d = minH(c.fin) - minH(c.debut); if (d <= 0) d += 1440; return Math.max(0, d - (c.pause_min || 0)); };
const fmtDuree = (m) => m ? `${Math.floor(m / 60)}h${m % 60 ? String(m % 60).padStart(2, "0") : ""}` : "—";
const ABS_JOUR = ["conge", "maladie", "absence_autorisee", "absence_injustifiee"];
const nbChangementsPl = () => PL.br ? Object.keys(PL.br.cases).length + Object.keys(PL.br.postes).length + PL.br.nouveaux.length : 0;
window.addEventListener("beforeunload", (e) => { if (PL.edition && nbChangementsPl()) { e.preventDefault(); e.returnValue = ""; } });

function titreSemaine(l, dim) {
  const [a, b] = [l, dim].map((x) => ({ j: +x.slice(8), m: MOIS[+x.slice(5, 7) - 1], y: x.slice(0, 4) }));
  if (a.m === b.m) return `${a.j} – ${b.j} ${b.m} ${b.y}`;
  return `${a.j} ${a.m.slice(0, 4)}. – ${b.j} ${b.m.slice(0, 4)}. ${b.y}`;
}
function indexerPlanning(d) {
  d.jours = [0, 1, 2, 3, 4, 5, 6].map((i) => plusJours(d.lundi, i));
  d.parCase = {}; d.absParCase = {}; d.attParCase = {};
  for (const p of d.planning) (d.parCase[cleCase(p.employe_id, p.jour)] ||= []).push(p);
  for (const k in d.parCase) d.parCase[k].sort((a, b) => a.ordre - b.ordre);
  const etaler = (liste, cible) => { for (const a of liste) for (const j of d.jours) if (a.date_debut <= j && a.date_fin >= j) (cible[cleCase(a.employe_id, j)] ||= []).push(a); };
  etaler(d.absences, d.absParCase); etaler(d.en_attente, d.attParCase);
}
function creneauxServeur(e, j) { return (PL.d.parCase[cleCase(e, j)] || []).map((c) => ({ debut: c.debut, fin: c.fin, pause_min: c.pause_min })); }
function creneauxCase(e, j) { const k = cleCase(e, j); return PL.br && k in PL.br.cases ? PL.br.cases[k] : creneauxServeur(e, j); }
function employesPlanning() {
  const l = PL.d.employes.map((e) => ({ ...e, service: PL.br?.postes[e.id] ?? e.service }));
  if (PL.br) for (const n of PL.br.nouveaux) l.push({ id: n.ref, nom: n.nom, service: n.service, actif: true, nouveau: true });
  return l.filter((e) => !PL.poste || e.service === PL.poste)
    .sort((a, b) => a.service.localeCompare(b.service) || a.nom.localeCompare(b.nom));
}
const grouper = (l) => l.reduce((g, e) => ((g[e.service] ||= []).push(e), g), {});
function postesConnus() {
  const s = new Set(PL.d.employes.map((e) => e.service));
  if (PL.br) { Object.values(PL.br.postes).forEach((x) => s.add(x)); PL.br.nouveaux.forEach((n) => s.add(n.service)); }
  return [...s].sort();
}

function contenuCase(e, j) {
  const k = cleCase(e.id, j), crs = creneauxCase(e.id, j), js = PL.d.jour_service;
  const abs = PL.d.absParCase[k] || [], att = PL.d.attParCase[k] || [];
  const absJour = abs.find((a) => ABS_JOUR.includes(a.type) && !a.heure_debut);
  const partiels = abs.filter((a) => a !== absJour);
  const modif = !!(PL.br && k in PL.br.cases), passe = j < js;
  const exc = !modif && (PL.d.parCase[k] || []).some((c) => c.source === "jour");
  const col = couleurPoste(e.service);
  let h = absJour ? `<span class="pl-abs t-${absJour.type}">${LIB_TYPE[absJour.type]}</span>` : "";
  h += crs.length ? crs.map((c) => `<span class="pl-cr ${absJour ? "barre" : ""}" style="--c:${col}" title="${c.pause_min ? `Pause ${c.pause_min} min` : "Sans pause"}">${c.debut}–${c.fin}</span>`).join("")
    : absJour ? "" : (PL.edition ? `<span class="pl-plus" aria-hidden="true">+</span>` : `<span class="pl-repos">Repos</span>`);
  for (const a of partiels) h += `<span class="pl-tag">${LIB_TYPE[a.type] || a.type}${a.type === "retard_justifie" && a.heure_fin ? ` · ${a.heure_fin.slice(0, 5)}` : ""}${a.type === "depart_anticipe" && a.heure_debut ? ` · ${a.heure_debut.slice(0, 5)}` : ""}</span>`;
  if (att.length) h += `<span class="pl-tag attente" title="Demande pas encore validée : sans effet sur le planning">Demande en attente</span>`;
  const editable = PL.edition; // les jours passés se corrigent aussi (ce jour-là seulement, motif journalisé)
  const label = `${e.nom}, ${JOURS[dow(j)]} ${+j.slice(8)} : ${crs.length ? crs.map((c) => `${c.debut} à ${c.fin}`).join(" puis ") : "repos"}`;
  return { h, modif, passe, exc, editable, absJour, crs, label };
}

async function vuePlanning(v, arg) {
  if (arg && arg.lundi) PL.lundi = arg.lundi;
  const d = await ga({ action: "admin_planning", lundi: PL.lundi || undefined });
  PL.lundi = d.lundi; PL.d = d; indexerPlanning(d);
  if (!PL.jour || PL.jour < d.lundi || PL.jour > d.dimanche) PL.jour = d.jour_service >= d.lundi && d.jour_service <= d.dimanche ? d.jour_service : d.lundi;
  dessinerPlanning(v);
}

function dessinerPlanning(v = $("#vue-g")) {
  const d = PL.d, ed = PL.edition, n = nbChangementsPl(), js = d.jour_service;
  const emps = employesPlanning(), groupes = grouper(emps);

  const entetes = d.jours.map((j) => `<th scope="col" class="${j === js ? "auj" : ""} ${j < js ? "passe" : ""}"><span>${JOURS_C[dow(j)]}</span><b>${+j.slice(8)}</b></th>`).join("");
  let corps = "";
  for (const [poste, liste] of Object.entries(groupes)) {

    for (const e of liste) {
      let total = 0;
      const cases = d.jours.map((j) => {

        return `<td class="pl-case ${c.passe ? "passe" : ""} ${j === js ? "auj" : ""} ${c.modif ? "modifie" : ""} ${c.editable ? "editable" : ""}" ${c.editable ? `data-e="${e.id}" data-j="${j}" tabindex="0" role="button" aria-label="Modifier : ${esc(c.label)}"` : ""}>${c.exc ? `<i class="pl-exc" title="Horaire modifié pour cette date uniquement"></i>` : ""}<div class="pl-case-in">${c.h}</div></td>`;
      }).join("");
      const tete = ed
        ? `<select class="pl-sel-poste" data-poste="${e.id}" aria-label="Poste de ${esc(e.nom)}">${postesConnus().map((p) => `<option ${p === e.service ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>`

      corps += `<tr><th scope="row" class="pl-col-nom"><div class="pl-nom">${ed ? `<button class="b-lien pl-nom-sem" data-semaine="${e.id}" title="Modifier toute la semaine">${esc(e.nom)} ${svgPl("crayon")}</button>` : esc(e.nom)}${e.nouveau ? ` <span class="pl-neuf">Nouveau</span>` : ""}</div>${tete}${e.nouveau ? `<button class="b-lien pl-retirer" data-retirer="${e.id}">Retirer</button>` : ""}</th>${cases}<td class="pl-col-tot">${fmtDuree(total)}</td></tr>`;
    }
  }
  if (!emps.length) corps = `<tr><td colspan="9"><div class="vide">Aucun employé pour ce poste.</div></td></tr>`;
  const effectifs = d.jours.map((j) => emps.filter((e) => { const c = contenuCase(e, j); return c.crs.length && !c.absJour; }).length);
  const pied = `<tfoot><tr><th scope="row" class="pl-col-nom"><div class="pl-poste">Prévus au travail</div></th>${effectifs.map((x, i) => `<td class="pl-eff ${d.jours[i] === js ? "auj" : ""}">${x}</td>`).join("")}<td class="pl-col-tot"></td></tr></tfoot>`;

  // vue « jour » (téléphone)
  const jr = PL.jour;
  let liste = "";
  for (const [poste, l] of Object.entries(groupes)) {
    liste += `<div class="pl-grp"><span class="pl-pastille" style="background:${couleurPoste(poste)}"></span>${esc(poste)}</div>`;
    liste += l.map((e) => { const c = contenuCase(e, jr);
      return `<div class="pl-ligne ${c.modif ? "modifie" : ""} ${c.editable ? "editable" : ""} ${c.passe ? "passe" : ""}" ${c.editable ? `data-e="${e.id}" data-j="${jr}" tabindex="0" role="button" aria-label="Modifier : ${esc(c.label)}"` : ""}>
        <div class="qui"><b>${esc(e.nom)}${e.nouveau ? ` <span class="pl-neuf">Nouveau</span>` : ""}</b><span>${esc(e.service)}</span>${ed ? `<button class="b-lien pl-sem-lien" data-semaine="${e.id}">Toute la semaine</button>` : ""}</div><div class="quoi">${c.h}</div></div>`; }).join("");
  }

  v.innerHTML = `<div class="pl ${ed ? "edition" : ""} pl-m-${PL.vueM}">
    <div class="pl-barre">
      <div class="pl-sem">
        <button class="pl-fl" data-sem="-7" aria-label="Semaine précédente">${svgPl("g")}</button>
        <div class="pl-titre"><b>${titreSemaine(d.lundi, d.dimanche)}</b><span>${etat}${d.lundi > js || d.dimanche < js ? ` · <button class="b-lien pl-auj" data-sem="0">Revenir à aujourd'hui</button>` : ""}</span></div>
        <button class="pl-fl" data-sem="7" aria-label="Semaine suivante">${svgPl("d")}</button>
      </div>
      <div class="pl-actions">
        <select id="pl-poste" aria-label="Filtrer par poste"><option value="">Tous les postes</option>${postesConnus().map((p) => `<option ${p === PL.poste ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
        ${ed ? `<button class="b-sec" id="pl-annuler">Annuler</button><button class="b-principal" id="pl-enreg" ${n ? "" : "disabled"}>Enregistrer les modifications${n ? ` (${n})` : ""}</button>`
             : `<button class="b-sec pl-ic" id="pl-imprimer" title="Imprimer le planning de la semaine">${svgPl("impr")}<span>Imprimer</span></button><button class="b-sec pl-ic" id="pl-fixe">${svgPl("crayon")}<span>Planning fixe</span></button><button class="b-principal pl-ic" id="pl-modifier">${svgPl("crayon")}<span>Modifier le planning</span></button>`}
      </div>
    </div>
    ${ed ? `<div class="pl-bandeau"><b>Mode modification</b> Touche une case pour changer un jour, ou le nom d'un employé (« Toute la semaine ») pour changer toute sa semaine. Rien n'est enregistré avant « Enregistrer les modifications ». Corriger un jour passé ne change que ce jour-là et recalcule ses retards et absences.</div>` : ""}
    <div class="pl-legende"><span><i style="background:#1E2228;box-shadow:inset 3px 0 0 #7A7F86"></i>Service</span><span><i style="border:1px dashed rgba(255,255,255,.25)"></i>Repos</span><span><i class="t-conge"></i>Congé</span><span><i class="t-maladie"></i>Maladie</span><span><i class="t-absence_autorisee"></i>Absence autorisée</span><span><i style="background:#FFF4D6"></i>Retard / départ autorisé</span><span><i class="pl-exc-l"></i>Modifié pour cette date</span></div>
    <div class="segments pl-mob" role="tablist"><button data-vm="jour" class="${PL.vueM === "jour" ? "actif" : ""}">Jour</button><button data-vm="semaine" class="${PL.vueM === "semaine" ? "actif" : ""}">Semaine</button></div>
    <div class="pl-jchips">${d.jours.map((j) => `<button data-jour="${j}" class="${j === jr ? "actif" : ""} ${j === js ? "auj" : ""}"><span>${JOURS_C[dow(j)]}</span><b>${+j.slice(8)}</b></button>`).join("")}</div>
    <div class="pl-jliste">${liste || `<div class="vide">Aucun employé.</div>`}</div>
    <div class="carte pl-carte"><div class="pl-scroll"><table class="pl-table"><thead><tr><th scope="col" class="pl-col-nom">Employé</th>${entetes}<th scope="col" class="pl-col-tot">Total</th></tr></thead><tbody>${corps}</tbody>${pied}</table></div></div>
    ${ed ? `<button class="b-sec b-plein pl-ajout" id="pl-ajout-emp">+ Ajouter un employé au planning</button>` : ""}
  </div>`;

  $$("[data-sem]", v).forEach((b) => b.onclick = () => allerA("planning", { lundi: b.dataset.sem === "0" ? lundiDe(js) : plusJours(d.lundi, +b.dataset.sem) }));
  $("#pl-poste", v).onchange = (e) => { PL.poste = e.target.value; dessinerPlanning(v); };
  $$("[data-vm]", v).forEach((b) => b.onclick = () => { PL.vueM = b.dataset.vm; dessinerPlanning(v); });
  $$("[data-jour]", v).forEach((b) => b.onclick = () => { PL.jour = b.dataset.jour; dessinerPlanning(v); });
  $$("[data-semaine]", v).forEach((b) => b.onclick = (ev) => { ev.stopPropagation(); editerSemaine(b.dataset.semaine); });
  $$("[data-e][data-j]", v).forEach((c) => {
    c.onclick = () => editerCase(c.dataset.e, c.dataset.j);
    c.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); editerCase(c.dataset.e, c.dataset.j); } };
  });
  if (!ed) {
    $("#pl-modifier", v).onclick = () => { PL.edition = true; PL.br = { cases: {}, postes: {}, nouveaux: [], n: 0 }; dessinerPlanning(v); };
    $("#pl-imprimer", v).onclick = imprimerPlanning;
    $("#pl-fixe", v).onclick = () => choisirEmployeFixe();
    return;
  }
  $("#pl-annuler", v).onclick = () => {
    const sortir = () => { PL.edition = false; PL.br = null; dessinerPlanning(); };
    if (!nbChangementsPl()) return sortir();
    const f = feuille(`<div class="entete"><h2>Abandonner les modifications ?</h2></div>
      <p class="sous">${nbChangementsPl()} modification(s) non enregistrée(s) seront perdues. Le planning actuel reste inchangé.</p>
      <div class="ligne" style="margin-top:14px"><button class="b-sec flex" data-fermer>Continuer à modifier</button><button class="b-danger flex" id="pl-abandon">Abandonner</button></div>`);
    $("#pl-abandon", f.el).onclick = () => { f.fermer(); sortir(); };
  };
  $("#pl-enreg", v).onclick = confirmerPlanning;
  $("#pl-ajout-emp", v).onclick = ajouterEmployePlanning;
  $$("[data-poste]", v).forEach((s) => s.onchange = () => {
    const id = s.dataset.poste, nv = PL.br.nouveaux.find((x) => x.ref === id);
    if (nv) nv.service = s.value;
    else { const orig = PL.d.employes.find((e) => String(e.id) === id)?.service; if (s.value === orig) delete PL.br.postes[id]; else PL.br.postes[id] = s.value; }
    dessinerPlanning(v);
  });
  $$("[data-retirer]", v).forEach((b) => b.onclick = () => {
    const r = b.dataset.retirer; PL.br.nouveaux = PL.br.nouveaux.filter((x) => x.ref !== r);
    for (const k of Object.keys(PL.br.cases)) if (k.startsWith(r + "|")) delete PL.br.cases[k];
    dessinerPlanning(v);
  });
}

// contrôle d'une journée de services ; renvoie les services triés ou un message d'erreur
function verifierServices(l) {
  if (l.some((c) => !c.debut || !c.fin)) return { err: "Indique l'heure de début et de fin de chaque service." };
  if (l.some((c) => c.debut === c.fin)) return { err: "Un service ne peut pas commencer et finir à la même heure." };
  const tri = [...l].sort((a, b) => minH(a.debut) - minH(b.debut));
  for (let i = 0; i < tri.length; i++) {
    if (tri[i].pause_min >= dureeCr({ ...tri[i], pause_min: 0 })) return { err: "La pause est plus longue que le service." };
    if (i && minH(tri[i].debut) < minH(tri[i - 1].debut) + dureeCr({ ...tri[i - 1], pause_min: 0 })) return { err: "Deux services se chevauchent." };
  }
  return { tri };
}
function editerSemaine(eId) {
  const e = employesPlanning().find((x) => String(x.id) === String(eId)) || PL.d.employes.find((x) => String(x.id) === String(eId));
  if (!e) return;
  const js = PL.d.jour_service, jours = PL.d.jours, pauses = [0, 15, 20, 30, 45, 60, 90, 120];
  const sem = Object.fromEntries(jours.map((j) => [j, creneauxCase(e.id, j).map((c) => ({ ...c }))]));
  const f = feuille(`<div class="entete"><h2>Semaine de ${esc(e.nom)}</h2><button class="b-sec" data-fermer>Fermer</button></div>
    <div class="segments" style="margin:4px 0 10px"><button class="actif">Cette semaine seulement</button><button id="cs-fixe">Planning fixe (chaque semaine)</button></div>
    <p class="sous">${esc(titreSemaine(PL.d.lundi, PL.d.dimanche))} · ${esc(e.service)}. Changement ponctuel pour cette semaine ; rien n'est enregistré avant « Enregistrer les modifications ».</p>
    <div id="cs-jours"></div>
    <p class="petit" style="margin-top:8px">Un service après minuit se termine le lendemain (ex. 19:00 → 02:00). Corriger un jour passé ne change que ce jour-là.</p>
    <div id="cs-msg"></div>
    <div class="pile" style="margin-top:10px"><button class="b-principal b-plein" id="cs-ok">Valider la semaine</button></div>`);
  const el = f.el, zone = $("#cs-jours", el);
  $("#cs-fixe", el).onclick = () => { f.fermer(); editerPlanningFixe(e.id, () => allerA("planning", { lundi: PL.lundi })); };
  const lireJour = (j) => $$(`.cs-jour[data-j="${j}"] .ce-ligne`, zone).map((l) => ({ debut: $('[data-k="debut"]', l).value, fin: $('[data-k="fin"]', l).value, pause_min: +$('[data-k="pause"]', l).value || 0 }));
  const tout = () => { for (const j of jours) sem[j] = lireJour(j); };
  const rendre = () => {
    zone.innerHTML = jours.map((j) => {
      const passe = j < js, crs = sem[j];
      const titre = `${JOURS[dow(j)].replace(/^./, (c) => c.toUpperCase())} ${+j.slice(8)}`;
      return `<div class="cs-jour" data-j="${j}"><div class="cs-tete"><b>${titre}${passe ? ` <span class="puce" style="font-size:11px">passé</span>` : ""}</b>
          <span><button class="b-lien" data-cs-ajout="${j}" ${crs.length >= 4 ? "disabled" : ""}>+ service</button><button class="b-lien" data-cs-repos="${j}">Repos</button><button class="b-lien" data-cs-copier="${j}">Copier sur les jours suivants</button></span></div>
        ${crs.length ? crs.map((c, i) => `<div class="ce-ligne">
          <div><label>Début</label><input type="time" data-k="debut" value="${c.debut}"></div>
          <div><label>Fin</label><input type="time" data-k="fin" value="${c.fin}"></div>
          <div><label>Pause</label><select data-k="pause">${pauses.concat(pauses.includes(c.pause_min) ? [] : [c.pause_min]).map((p) => `<option value="${p}" ${p === c.pause_min ? "selected" : ""}>${p ? p + " min" : "Aucune"}</option>`).join("")}</select></div>
          <button class="ce-x" data-cs-suppr="${j}|${i}" aria-label="Retirer ce service">×</button></div>`).join("") : `<div class="pl-repos">Repos</div>`}</div>`;
    }).join("");
    $$("[data-cs-ajout]", zone).forEach((b) => b.onclick = () => { tout(); const l = sem[b.dataset.csAjout], der = l[l.length - 1];
      l.push(der ? { debut: der.fin, fin: der.fin, pause_min: 0 } : { debut: "10:00", fin: "15:00", pause_min: 0 }); rendre(); });
    $$("[data-cs-repos]", zone).forEach((b) => b.onclick = () => { tout(); sem[b.dataset.csRepos] = []; rendre(); });
    $$("[data-cs-suppr]", zone).forEach((b) => b.onclick = () => { tout(); const [j, i] = b.dataset.csSuppr.split("|"); sem[j].splice(+i, 1); rendre(); });
    $$("[data-cs-copier]", zone).forEach((b) => b.onclick = () => { tout(); const src = b.dataset.csCopier;
      for (const j of jours) if (j > src) sem[j] = sem[src].map((c) => ({ ...c }));
      rendre(); msg($("#cs-msg", el), "Horaires copiés sur les jours suivants. Mets en repos les jours où il ne travaille pas.", "info"); });
  };
  rendre();
  $("#cs-ok", el).onclick = () => {
    tout();
    const res = {};
    for (const j of jours) {
      const v = verifierServices(sem[j]);
      if (v.err) return msg($("#cs-msg", el), `${JOURS[dow(j)].replace(/^./, (c) => c.toUpperCase())} ${+j.slice(8)} : ${v.err}`);
      res[j] = v.tri;
    }
    for (const j in res) {
      const k = cleCase(e.id, j);
      if (typeof e.id === "number" && JSON.stringify(res[j]) === JSON.stringify(creneauxServeur(e.id, j))) delete PL.br.cases[k]; else PL.br.cases[k] = res[j];

async function scenarioSimulation(sim, dessiner) {
  const z = $("#sm-res"), ok = {}, notes = {};
  const montrer = () => { if (z) z.innerHTML = `<ul class="liste">${SIM_ETAPES.map(([k, t]) => `<li style="padding:4px 0"><span class="g-pas ${ok[k] === true ? "g-vert" : ok[k] === false ? "g-rouge" : "g-gris"}"><i></i>${ok[k] === true ? "Réussi" : ok[k] === false ? "Échec" : "…"}</span>
    <span class="petit" style="margin-left:8px">${t}${notes[k] ? " — " + esc(notes[k]) : ""}</span></li>`).join("")}</ul>`; };
  $("#sm-auto").disabled = true; montrer();
  const ligne = (r, id) => r.lignes.find((l) => l.session_id === id);
  try {
    await sim({ op: "terminer_tout" });
    let r = await sim({ op: "arrivee", nom: "Test automatique" }); const id = r.resultat.session_id;
    ok.arrivee = !!ligne(r, id) && ligne(r, id).statut === "active"; montrer();
    const pos = (m, p = 8) => sim({ op: "position", session_id: id, distance_m: m, precision_m: p });
    await pos(10); r = await pos(12); ok.presence = ligne(r, id).statut_aff === "present"; montrer();
    // position imprécise à la limite : ne déclare rien
    r = await pos(45, 40); ok.imprecis = ligne(r, id).statut_aff === "present"; notes.imprecis = "45 m ± 40 m"; montrer();
    // sortie courte : 3 mesures dehors sur plus d'une minute, retour avant 3 minutes
    await pos(80); await sim({ op: "avancer", minutes: 1 }); await pos(85); r = await pos(90);
    ok.sortie = ligne(r, id).etat === "hors"; ok.compteur = ok.sortie && !r.alertes.some((a) => a.session_id === id); montrer();
    await pos(10); r = await pos(8);
    ok.annulation = ligne(r, id).statut_aff === "present" && !r.alertes.some((a) => a.session_id === id) && r.sorties.some((x) => x.session_id === id && x.fin && x.niveau === 0); notes.annulation = "retour après ~1 min, aucune alerte"; montrer();
    // sortie longue : alerte après 3 minutes
    await pos(80); await sim({ op: "avancer", minutes: 1 }); await pos(85); await pos(90);
    r = await sim({ op: "avancer", minutes: 3 });
    ok.alerte = ligne(r, id).statut_aff === "alerte" && r.alertes.some((a) => a.session_id === id && a.type === "sortie"); montrer();
    await pos(10); r = await pos(8);
    ok.retour = ligne(r, id).statut_aff === "present" && r.sorties.filter((x) => x.session_id === id && x.fin).length === 2; montrer();
    const longue = r.sorties.find((x) => x.session_id === id && x.niveau >= 1);
    await sim({ op: "justifier", sortie_id: longue.id, type: "achat", commentaire: "Course urgente (test)" });
    r = await sim({ op: "decider", sortie_id: longue.id, decision: "acceptee", commentaire: "Test" });
    ok.justification = r.sorties.find((x) => x.id === longue.id)?.justification_statut === "acceptee"; montrer();
    r = await sim({ op: "depart", session_id: id });
    ok.depart = ligne(r, id)?.statut_aff === "termine"; montrer();
    r = await sim({ op: "position", session_id: id, distance_m: 500, precision_m: 5 }).catch((e) => ({ refus: e.message }));
    ok.arret = !!r.refus; notes.arret = "position refusée après le départ"; montrer();
    dessiner(await sim({ op: "etat" })); $("#sm-res") && ($("#sm-res").innerHTML = z.innerHTML);
  } catch (e) { const k = SIM_ETAPES.find(([k]) => ok[k] === undefined)?.[0]; if (k) { ok[k] = false; notes[k] = e.message; } montrer(); $("#sm-auto") && ($("#sm-auto").disabled = false); }
}

      <div class="pile" style="margin-top:8px"><button class="b-sec" id="r-wifi">Enregistrer le réseau actuel comme Wi-Fi Capanna</button></div><p class="petit">Si la box change d'adresse, l'appli la reconnaît toute seule dès que plusieurs employés pointent depuis le restaurant, ou grâce à la position ci-dessous. Tu peux aussi l'autoriser depuis le tableau de bord.</p></div>
    <div class="carte"><h3>Position du restaurant</h3>
      <p class="sous">${P.site_lat ? `Enregistrée · rayon ${esc(P.site_rayon_m || 15)} m` : "Pas encore enregistrée"}. Preuve de présence quand le Wi-Fi n'est pas reconnu : position à 10 m près, dans le rayon. Sinon le pointage est gardé à son heure et tu le valides ici.</p>
      <div class="ligne"><div class="flex"><label>Latitude</label><input id="r-lat" inputmode="decimal" value="${esc(P.site_lat || "")}" placeholder="34.0xxxxx"></div>
        <div class="flex"><label>Longitude</label><input id="r-lng" inputmode="decimal" value="${esc(P.site_lng || "")}" placeholder="-6.8xxxxx"></div>
        <div class="flex"><label>Rayon (mètres)</label><input type="number" id="r-rayon" min="5" max="1000" value="${esc(P.site_rayon_m || 15)}"></div></div>
      <div id="r-msg3"></div>
      <div class="ligne" style="margin-top:10px"><button class="b-principal flex" id="r-coord-ok">Enregistrer</button><button class="b-sec flex" id="r-site">Mesurer ma position ici</button></div>
      <p class="petit">« Mesurer » remplit les coordonnées depuis le téléphone, à l'intérieur du restaurant (la mesure est relancée jusqu'à 10 m de précision). Vérifie puis enregistre.</p></div>`;
  $("#r-ok1").onclick = () => {
    const changes = $$("[data-p]", v).filter((i) => String(i.value) !== String(P[i.dataset.p] ?? ""));
    if (!changes.length) return msg($("#r-msg1"), "Aucune modification.", "info");
    demanderMotif("Modifier les règles", "Les statistiques seront recalculées immédiatement.", async (m) => { for (const i of changes) await ga({ action: "admin_parametre_modifier", cle: i.dataset.p, valeur: i.value, motif: m }); allerA("reglages"); });
  };
  $("#r-ok2").onclick = () => {
    const n = (s) => +$(s).value;
    const config = { couleurs: Object.fromEntries($$("[data-coul]", v).map((i) => [i.dataset.coul, i.value])),
      jour: { avance_min: n("#s-av"), paliers: [n("#s-p1"), n("#s-p2")], messages: Object.fromEntries($$("[data-mj]", v).map((i) => [i.dataset.mj, i.value])) },
      mois: { nombre: [n("#s-n1"), n("#s-n2"), n("#s-n3")], minutes: [n("#s-m1"), n("#s-m2"), n("#s-m3")], messages: $$("[data-mm]", v).map((i) => i.value) } };
    demanderMotif("Modifier les smileys", "", async (m) => { const r = await ga({ action: "admin_emojis_config_modifier", config, motif: m }); G.cfg = r.config; Object.assign(SMILEY_COULEURS, r.config.couleurs); allerA("reglages"); });
  };
  $("#r-defaut").onclick = () => demanderMotif("Revenir aux valeurs par défaut", "", async (m) => { const r = await ga({ action: "admin_emojis_config_modifier", defaut: true, motif: m }); G.cfg = r.config; Object.assign(SMILEY_COULEURS, r.config.couleurs); allerA("reglages"); });
  $("#r-site").onclick = async () => {
    msg($("#r-msg3"), "Mesure de la position…", "info");
    const g = await position((p) => msg($("#r-msg3"), `Précision actuelle : ${p} m — nouvelle mesure en cours…`, "info"));
    if (!g) return msg($("#r-msg3"), "Position introuvable : autorise la localisation précise pour ce site et réessaie.");
    $("#r-lat").value = g.lat.toFixed(7); $("#r-lng").value = g.lng.toFixed(7);
    msg($("#r-msg3"), `Mesure obtenue à ${Math.round(g.precision)} m près${g.precision > 10 ? " (moins précis que les 10 m souhaités : réessaie près d'une fenêtre ou de l'entrée)" : ""}. Vérifie puis enregistre.`, g.precision > 10 ? "mal" : "info");
  };
  $("#r-coord-ok").onclick = () => {
    const lat = parseFloat(String($("#r-lat").value).replace(",", ".")), lng = parseFloat(String($("#r-lng").value).replace(",", "."));
    if (!isFinite(lat) || !isFinite(lng)) return msg($("#r-msg3"), "Coordonnées invalides.");
    const ray = $("#r-rayon").value, coordChange = String(lat) !== String(+P.site_lat) || String(lng) !== String(+P.site_lng);
    demanderMotif("Modifier la géolocalisation", "Coordonnées et rayon de pointage du restaurant.", async (m) => {
      if (coordChange) await ga({ action: "admin_site_enregistrer", gps: { lat, lng, precision: 0 }, motif: m });
      if (String(ray) !== String(P.site_rayon_m)) await ga({ action: "admin_parametre_modifier", cle: "site_rayon_m", valeur: ray, motif: m });
      allerA("reglages");
    });
  };
  $("#r-wifi").onclick = async () => { try { await ga({ action: "admin_ajouter_wifi" }); allerA("reglages"); } catch (e) { alert(e.message); } };
  $$("[data-ret]", v).forEach((b) => b.onclick = async () => { if (!confirm("Retirer ce réseau ? Plus personne ne pourra pointer depuis celui-ci.")) return; await ga({ action: "admin_retirer_wifi", reseau: b.dataset.ret }); allerA("reglages"); });
}

// ---------- Journal ----------
async function vueJournal(v) {
  const j = await ga({ action: "admin_journal", limite: 200 });
  const resume = (x) => { if (!x) return ""; if (typeof x !== "object") return String(x); if (Array.isArray(x)) return x.map((c) => c.debut ? `${String(c.debut).slice(0, 5)}–${String(c.fin).slice(0, 5)}` : JSON.stringify(c)).join(", ") || "OFF";
    return Object.entries(x).filter(([k]) => !["id"].includes(k)).map(([k, val]) => `${k} : ${typeof val === "object" ? "…" : val}`).join(" · "); };
  v.innerHTML = `<div class="carte"><h3>Journal des modifications</h3><p class="sous">Toutes les modifications, avec leur auteur et leur motif. Rien ne peut être effacé.</p>
    <div class="tableau" style="margin-top:8px"><table><thead><tr><th>Quand</th><th>Qui</th><th>Objet</th><th>Action</th><th>Avant</th><th>Après</th><th>Motif</th></tr></thead><tbody>
    ${j.journal.map((x) => `<tr><td>${dateHeure(x.quand)}</td><td>${esc(x.auteur)}</td><td>${esc(x.objet)} ${esc(x.objet_id || "")}</td><td>${esc(x.action)}</td>
      <td class="petit" style="white-space:normal;max-width:220px">${esc(resume(x.ancienne))}</td><td class="petit" style="white-space:normal;max-width:220px">${esc(resume(x.nouvelle))}</td><td style="white-space:normal;max-width:240px">${esc(x.motif)}</td></tr>`).join("") || `<tr><td colspan="7" class="vide">Journal vide.</td></tr>`}
    </tbody></table></div></div>`;
}

// ---------- Exports ----------
function exporterCSV(rows, nom) {
  const cols = [["Date", (r) => r.jour], ["Employé", (r) => r.nom], ["Poste", (r) => r.service], ["Prévu début", (r) => hcourt(r.prevu_debut)], ["Prévu fin", (r) => hcourt(r.prevu_fin)],
    ["Arrivée", (r) => r.arrivee_min == null ? "" : hhmm(r.arrivee_min)], ["Départ", (r) => r.depart_min == null ? "" : hhmm(r.depart_min)], ["Retard (min)", (r) => r.retard_min || 0],
    ["Retard justifié (min)", (r) => r.retard_justifie_min || 0], ["Départ anticipé (min)", (r) => r.depart_anticipe_min || 0], ["Heures sup (min)", (r) => r.heures_sup_min || 0],
    ["Présence (min)", (r) => r.presence_min ?? ""], ["Travail effectif (min)", (r) => r.travail_min ?? ""], ["Statut", (r) => LIB_JOUR[r.statut] || r.statut], ["Absence", (r) => LIB_TYPE[r.absence_type] || ""]];
  const cell = (x) => { const s = String(x ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = "﻿" + [cols.map((c) => c[0]).join(";"), ...[...rows].sort((a, b) => a.jour.localeCompare(b.jour) || a.nom.localeCompare(b.nom)).map((r) => cols.map((c) => cell(c[1](r))).join(";"))].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = nom; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function imprimer(html) { $("#impression").innerHTML = html; setTimeout(() => window.print(), 50); }
function rapportMensuelPDF(e, rows, nm) {
  const s = stats(rows), mois = MOIS[+G.js.slice(5, 7) - 1] + " " + G.js.slice(0, 4);
  imprimer(`<h1>Rapport mensuel · ${esc(e.nom)}</h1><p>${esc(e.service)} · ${esc(mois)} (jusqu'au ${dateCourte(G.js)}) · Capanna</p>
    <div style="display:flex;align-items:center;gap:10px;margin:8px 0">${smiley(nm.smiley, { taille: 36 })}<span>Discipline du mois</span></div>
    <div class="kpis">${[["Jours travaillés", s.jours], ["Retards", s.nb_retards], ["Retard cumulé", duree(s.cumul)], ["Retard moyen", duree(s.moyenne)], ["Ponctualité", (s.ponctualite ?? "—") + " %"], ["Absences injustifiées", s.absences], ["Heures sup", duree(s.heures_sup)], ["Travail effectif", duree(s.travail)]].map(([l, x]) => `<div class="kpi"><b>${esc(x)}</b><span>${l}</span></div>`).join("")}</div>
    <table style="margin-top:12px"><thead><tr><th>Date</th><th>Prévu</th><th>Arrivée</th><th>Retard</th><th>Départ</th><th>Travail</th><th>Statut</th></tr></thead><tbody>
    ${[...rows].sort((a, b) => a.jour.localeCompare(b.jour)).map((r) => `<tr><td>${dateCourte(r.jour)} ${JOURS_C[dow(r.jour)]}</td><td>${r.prevu_debut ? hcourt(r.prevu_debut) + "–" + hcourt(r.prevu_fin) : "—"}</td><td>${hhmm(r.arrivee_min)}</td><td>${r.retard_min ? r.retard_min + " min" : "—"}</td><td>${hhmm(r.depart_min)}</td><td>${r.travail_min ? duree(r.travail_min) : "—"}</td><td>${esc(LIB_JOUR[r.statut] || "")}</td></tr>`).join("")}</tbody></table>
    <p style="margin-top:14px;font-size:10px;color:#666">Édité le ${new Date().toLocaleString("fr-FR", { timeZone: TZ })} · calculé à partir des pointages réels et des horaires prévus.</p>`);
}
function rapportGlobalPDF(rows, f) {
  const par = {}; rows.forEach((r) => (par[r.employe_id] ||= []).push(r));
  const lignes = Object.values(par).map((rs) => ({ nom: rs[0].nom, service: rs[0].service, ...stats(rs), n: niveauMois(rs) })).sort((a, b) => a.nom.localeCompare(b.nom));
  const s = stats(rows);
  imprimer(`<h1>Rapport du personnel · Capanna</h1><p>Du ${dateCourte(f.debut)} au ${dateCourte(f.fin)}</p>
    <div class="kpis">${[["Ponctualité", (s.ponctualite ?? "—") + " %"], ["Retards", s.nb_retards], ["Retard cumulé", duree(s.cumul)], ["Heures sup", duree(s.heures_sup)]].map(([l, x]) => `<div class="kpi"><b>${esc(x)}</b><span>${l}</span></div>`).join("")}</div>
    <table style="margin-top:12px"><thead><tr><th></th><th>Employé</th><th>Poste</th><th>Jours</th><th>Retards</th><th>Cumul</th><th>Ponctualité</th><th>Absences</th><th>Heures sup</th><th>Travail</th></tr></thead><tbody>
    ${lignes.map((x) => `<tr><td>${smiley(x.n.smiley, { taille: 18 })}</td><td>${esc(x.nom)}</td><td>${esc(x.service)}</td><td>${x.jours}</td><td>${x.nb_retards}</td><td>${duree(x.cumul)}</td><td>${x.ponctualite ?? "—"} %</td><td>${x.absences}</td><td>${duree(x.heures_sup)}</td><td>${duree(x.travail)}</td></tr>`).join("")}</tbody></table>`);
}

// ---------- mise à jour automatique ----------
// À chaque publication, version.json change : l'appli ouverte (y compris depuis l'écran d'accueil)
// se recharge d'elle-même sur la nouvelle version, sans jamais interrompre une saisie.
const VERSION_APP = "20261123-104354";
let majEnAttente = null;
function majPossible() {
  if ($(".voile")) return false;                                   // une fenêtre est ouverte
  if (typeof PL !== "undefined" && PL.edition && nbChangementsPl()) return false; // planning en cours de modification
  const a = document.activeElement;
  if (a && a.matches && a.matches("input, textarea, select")) return false;       // saisie en cours
  return true;
}
function appliquerMaj(force) {
  if (!majEnAttente) return;
  // Pas de rechargement visible : juste à l'ouverture (avant toute action), sinon quand l'appli passe en arrière-plan.
  if (!force && document.visibilityState === "visible") return;   // jamais pendant l'utilisation
  if (!majPossible()) return setTimeout(() => appliquerMaj(force), 5000);
  // anti-boucle : si la page rechargée est encore l'ancienne (publication pas encore propagée), on attend 5 min
  try {
    const t = JSON.parse(sessionStorage.getItem("capanna_maj") || "{}");
    if (t.v === majEnAttente && Date.now() - t.quand < 300000) return;
    sessionStorage.setItem("capanna_maj", JSON.stringify({ v: majEnAttente, quand: Date.now() }));
  } catch {}
  location.replace(`v2.html?v=${encodeURIComponent(majEnAttente)}${location.hash}`);
  return true;
}
async function verifierMaj() {
  if (VERSION_APP.startsWith("__")) return;
  try {
    const r = await fetch(`version.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return;
    const v = (await r.json()).version;
    if (v && v !== VERSION_APP) { majEnAttente = v; appliquerMaj(); }
  } catch {}
}
setTimeout(verifierMaj, 2000);
setInterval(() => { if (document.visibilityState === "visible") verifierMaj(); }, 120000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && majEnAttente) appliquerMaj(true);   // l'appli est en arrière-plan : on peut recharger sans gêner
  else if (document.visibilityState === "visible") verifierMaj();
});
window.addEventListener("pageshow", (e) => { if (e.persisted) verifierMaj(); });

function route() {
  const h = location.hash;
  if (h.startsWith("#gerant")) { const m = h.match(/^#gerant\/demande\/(\d+)/); G.ouvrirDemande = m ? +m[1] : null; if (/^#gerant\/geo/.test(h)) G.onglet = "geo_direct"; return demarrerGerant(); }
  if ((!h || h === "#") && store.get("capanna_mode") === "gerant" && !E.token) { history.replaceState(null, "", location.pathname + location.search + "#gerant"); return route(); }
  const m = h.match(/^#e\/(pointage|planning|demandes|notifications)(?:\/(\d{4}-\d{2}-\d{2}))?/);
  if (m) { E.onglet = m[1]; if (m[2]) { E.plMode = "semaine"; E.plRef = lundiDe(m[2]); E.plFocus = m[2]; } }
  demarrerEmploye();
}
window.addEventListener("hashchange", route);
// Démarrage : la version est vérifiée AVANT le premier affichage. S'il y en a une nouvelle,
// on la charge tout de suite (écran encore vide) : aucun écran ne se recharge sous les yeux.
(async () => {
  if (!VERSION_APP.startsWith("__")) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 1500);
      const r = await fetch(`version.json?t=${Date.now()}`, { cache: "no-store", signal: ctl.signal });
      clearTimeout(t);
      const v = r.ok ? (await r.json()).version : null;
      if (v && v !== VERSION_APP) { majEnAttente = v; if (appliquerMaj(true)) return; }
    } catch {}
  }
  route();
})();
</script>
