<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capanna">
<title>Capanna – Pointage</title>
<style>
:root{--vert:#0B4F3C;--vert-2:#0E6B51;--or:#A8823C;--fond:#F2EEE1;--carte:#fff;--ligne:#E6E0CF;--texte:#1d1d1d;--gris:#6b6b6b;--rouge:#B3261E;
  --s-vert:#2E9E5B;--s-jaune:#D9A400;--s-orange:#E2742B;--s-rouge:#D2453F;--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte);
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 12px);font-size:15px;line-height:1.4}
header.marque{text-align:center;padding:22px 16px 6px}
header.marque img{display:block;width:160px;max-width:50%;height:auto;margin:0 auto}
header.marque p{margin:4px 0 0;color:var(--or);font-size:12px;letter-spacing:2px;text-transform:uppercase}
main{max-width:480px;margin:0 auto;padding:0 14px}
body.admin main{max-width:1100px}
.carte{background:var(--carte);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em} h2{font-size:20px} h3{font-size:16px}
.sous{color:var(--gris);font-size:14px;margin:4px 0 0}
.petit{font-size:13px;color:var(--gris)}
.cache{display:none!important}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:default}
.b-principal{background:var(--vert);color:#fff}.b-or{background:var(--or);color:#fff}
.b-sec{background:#EEE9DA;color:var(--texte);font-weight:500}.b-danger{background:#FBE7E6;color:var(--rouge)}
.b-lien{background:none;color:var(--vert);padding:6px 8px;font-weight:600}
.b-plein{width:100%}.b-grand{font-size:18px;padding:17px}
.pile{display:grid;gap:10px}.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ligne>.flex{flex:1;min-width:120px}
label{display:block;font-size:13px;color:var(--gris);margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border-radius:12px;border:1px solid #D8D2BF;background:#fff;font-size:16px;color:var(--texte)}
textarea{min-height:84px;resize:vertical}
.msg{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:14px}
.msg.bon{background:#E5F3EA;color:#145C33}.msg.mal{background:#FBE7E6;color:var(--rouge)}.msg.info{background:#F4EFE0;color:#5c4b22}
.wifi{display:flex;align-items:center;gap:10px}.pastille{width:11px;height:11px;border-radius:50%;background:#c9c9c9;flex:none}
.wifi.ok .pastille{background:var(--s-vert)}.wifi.ko .pastille{background:var(--rouge)}
.onglets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:8px 0 2px;-webkit-overflow-scrolling:touch}
.onglets::-webkit-scrollbar{display:none}
.onglet{flex:none;background:#E9E3D2;color:#3b3b3b;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;position:relative}
.onglet.actif{background:var(--vert);color:#fff}
.badge{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rouge);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:6px}
.puce{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#EEE9DA;color:#444;white-space:nowrap}
.puce.attente{background:#FFF4D6;color:#8A6400}.puce.complement{background:#FDEBDC;color:#9A4A12}.puce.validee{background:#E5F3EA;color:#145C33}
.puce.refusee{background:#FBE7E6;color:var(--rouge)}.puce.annulee{background:#eee;color:#777}.puce.manquant{background:#FBE7E6;color:var(--rouge)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}.kpi span{font-size:13px;color:var(--gris)}
.grille2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.liste{list-style:none;margin:0;padding:0}.liste li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid #F0EBDD}
.liste li:first-child{border-top:0}.liste .t{font-weight:600}.liste .flex{flex:1;min-width:0}
.cliquable{cursor:pointer}.cliquable:hover{background:#FBF9F3}
.tableau{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-top:1px solid #F0EBDD;vertical-align:middle;white-space:nowrap}
th{color:var(--gris);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.barre td{color:#aaa;text-decoration:line-through}
.resultat{display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px;border-radius:14px;background:#FBF9F3}
.resultat .t{font-weight:650;font-size:16px}
.journal-jour{list-style:none;padding:0;margin:12px 0 0}.journal-jour li{padding:7px 0;border-top:1px solid #F0EBDD}
.apercu{margin-top:10px;border:1px dashed #D8D2BF;border-radius:12px;padding:10px;display:flex;gap:12px;align-items:center}
.apercu img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#eee}
.apercu .doc{width:72px;height:72px;border-radius:8px;background:#F4EFE0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--or)}
.voile{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.feuille{background:var(--fond);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
@media(min-width:700px){.voile{align-items:center;padding:20px}.feuille{border-radius:20px}}
.feuille .entete{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.doc-vue img{max-width:100%;border-radius:12px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .j{background:#fff;border-radius:10px;min-height:64px;padding:5px;font-size:11px;overflow:hidden}
.cal .j.hors{opacity:.35}.cal .j.auj{outline:2px solid var(--vert)}
.cal .j .n{font-weight:700;font-size:12px;color:#555}.cal .j .ev{margin-top:3px;padding:2px 4px;border-radius:5px;background:#E5F3EA;color:#145C33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .j .ev.conge{background:#E6EEF9;color:#1E4C8F}.cal .j .ev.maladie{background:#FBE7E6;color:#8E1F19}.cal .j .ev.attente{background:#FFF4D6;color:#8A6400}
.cal .tete{font-size:11px;color:var(--gris);text-align:center;font-weight:600;padding:2px 0}
.creneaux-jour{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:start;padding:10px 0;border-top:1px solid #F0EBDD}
.creneau{display:grid;grid-template-columns:1fr 1fr 74px 32px;gap:6px;margin-bottom:6px}
.creneau input{padding:9px 8px;font-size:15px}
.x{background:#F4EFE0;border-radius:10px;padding:0;width:32px;height:40px;color:#666}
.graph svg{width:100%;height:auto;display:block}
.vide{color:var(--gris);text-align:center;padding:18px 8px;font-size:14px}
.retour{display:inline-flex;align-items:center;gap:4px}
/* smileys */
.smiley{display:inline-block;vertical-align:middle;max-width:100%;height:auto;flex:none}
.smiley-anime{animation:smiley-entree .45s cubic-bezier(.2,.8,.2,1) both}
.smiley-anime .smiley-visage{stroke-dasharray:126;stroke-dashoffset:126;animation:smiley-trait .6s .05s ease-out forwards}
.smiley-anime .smiley-oeil,.smiley-anime .smiley-bouche{opacity:0;animation:smiley-fondu .25s .45s ease-out forwards}
@keyframes smiley-entree{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes smiley-trait{to{stroke-dashoffset:0}}
@keyframes smiley-fondu{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.smiley-anime,.smiley-anime *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
/* impression (rapport PDF) */
#impression{display:none}
@media print{
  body{background:#fff;padding:0}body>*:not(#impression){display:none!important}
  #impression{display:block;font-size:12px;color:#000}#impression h1{font-size:20px}#impression table{font-size:11px}
  #impression th,#impression td{white-space:normal;padding:5px 6px;border-top:1px solid #ddd}
  #impression .kpis{grid-template-columns:repeat(4,1fr)}#impression .kpi{box-shadow:none;border:1px solid #ddd;padding:8px}#impression .kpi b{font-size:18px}
  @page{margin:14mm}
}
</style>
</head>

// ---------- fichiers : photo compressée ou PDF, avant envoi ----------
const TAILLE_MAX = 5 * 1024 * 1024;
function lireDataURL(blob) { return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(blob); }); }
async function preparerFichier(f) {
  if (!f) return null;
  const pdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  if (pdf) {
    if (f.size > TAILLE_MAX) throw new Error("PDF trop lourd (5 Mo maximum).");
    return { nom: f.name, type: "application/pdf", taille: f.size, data: await lireDataURL(f), apercu: null };
  }
  if (!/^image\//.test(f.type) && !/\.(jpe?g|png|heic|heif)$/i.test(f.name)) throw new Error("Format refusé : photo (JPG, PNG) ou PDF uniquement.");
  // la photo est redimensionnée et réencodée en JPEG : plus légère, et sans données cachées
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error("Image illisible.")); i.src = url; });
    const max = 1800, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL("image/jpeg", 0.82);
    const taille = Math.round((data.length - data.indexOf(",") - 1) * 3 / 4);
    if (taille > TAILLE_MAX) throw new Error("Photo trop lourde, même compressée.");
    return { nom: f.name.replace(/\.\w+$/, "") + ".jpg", type: "image/jpeg", taille, data, apercu: data };
  } finally { URL.revokeObjectURL(url); }
}
const taillePropre = (o) => o > 1048576 ? (o / 1048576).toFixed(1) + " Mo" : Math.max(1, Math.round(o / 1024)) + " Ko";
function ouvrirDocument(type_mime, base64, titre) {
  const bin = atob(base64), o = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([o], { type: type_mime }));
  if (type_mime === "application/pdf") {
    feuille(`<div class="entete"><h2>${esc(titre)}</h2><button class="b-sec" data-fermer>Fermer</button></div>
      <p class="sous">Document PDF. Il s'ouvre dans un nouvel onglet, sans adresse publique : le lien disparaît à la fermeture.</p>
      <div class="pile" style="margin-top:12px"><a class="b-principal" style="text-align:center;padding:14px;border-radius:14px;color:#fff;text-decoration:none" href="${url}" target="_blank" rel="noopener">Ouvrir le PDF</a></div>`, () => URL.revokeObjectURL(url));
  } else {
    feuille(`<div class="entete"><h2>${esc(titre)}</h2><button class="b-sec" data-fermer>Fermer</button></div><div class="doc-vue"><img src="${url}" alt="${esc(titre)}"></div>`, () => URL.revokeObjectURL(url));
  }
}

// ---------- feuille modale ----------
function feuille(html, auFermer) {
  const v = document.createElement("div"); v.className = "voile";
  v.innerHTML = `<div class="feuille" role="dialog" aria-modal="true">${html}</div>`;
  const fermer = () => { v.remove(); document.body.style.overflow = ""; auFermer && auFermer(); };
  v.addEventListener("click", (e) => { if (e.target === v || e.target.closest("[data-fermer]")) fermer(); });
  const echap = (e) => { if (e.key === "Escape") { document.removeEventListener("keydown", echap); fermer(); } };
  document.addEventListener("keydown", echap);
  document.body.appendChild(v); document.body.style.overflow = "hidden";
  return { el: v.firstElementChild, fermer };
}

const CLASSE_STATUT = { demandee: "attente", complement: "complement", validee: "validee", refusee: "refusee", annulee: "annulee" };

function periodeDemande(d) {
  let t = d.date_debut === d.date_fin ? dateFr(d.date_debut) : `du ${dateCourte(d.date_debut)} au ${dateCourte(d.date_fin)}`;
  if (d.type === "retard_justifie" && d.heure_fin) t += ` · arrivée prévue ${hcourt(d.heure_fin)}`;
  else if (d.type === "depart_anticipe" && d.heure_debut) t += ` · départ à ${hcourt(d.heure_debut)}`;
  else if (d.heure_debut && d.heure_fin) t += ` · ${hcourt(d.heure_debut)}–${hcourt(d.heure_fin)}`;
  return t;
}

// ---------- statistiques (toujours depuis le moteur hr_journees) ----------
const AVEC_ARRIVEE = (r) => r.arrivee_min !== null && r.arrivee_min !== undefined;
function stats(rows) {
  const arr = rows.filter(AVEC_ARRIVEE), prev = arr.filter((r) => r.prevu_debut);
  const ret = rows.filter((r) => r.retard_min > 0);
  const cumul = ret.reduce((s, r) => s + r.retard_min, 0);
  const abs = new Set(rows.filter((r) => r.statut === "absence_injustifiee").map((r) => r.employe_id + "|" + r.jour));
  const absJ = new Set(rows.filter((r) => r.statut === "absence_justifiee").map((r) => r.employe_id + "|" + r.jour));
  return {
    nb_retards: ret.length, cumul, moyenne: ret.length ? Math.round(cumul / ret.length) : 0,
    ponctualite: prev.length ? Math.round(100 * prev.filter((r) => r.retard_min === 0).length / prev.length) : null,
    jours: new Set(arr.map((r) => r.employe_id + "|" + r.jour)).size, absences: abs.size, absences_justifiees: absJ.size,
    heures_sup: rows.reduce((s, r) => s + (r.heures_sup_min || 0), 0), travail: rows.reduce((s, r) => s + (r.travail_min || 0), 0),
    anomalies: rows.filter((r) => ["depart_non_pointe", "coupure_non_pointee"].includes(r.statut)).length,
  };
}
function filtrer(rows, f) {
  return rows.filter((r) => (!f.employe || r.employe_id === +f.employe) && (!f.service || r.service === f.service));
}
function niveauMois(rows) {
  const c = G.cfg.mois, s = stats(rows);
  let n = s.nb_retards > 0 ? 1 : 0;
  for (let i = 0; i < 3; i++) if (s.nb_retards >= c.nombre[i] || s.cumul >= c.minutes[i]) n = Math.max(n, i + 2);
  return { smiley: c.smileys[n], niveau: n, s };
}
function barres(series, opts = {}) {
  // histogramme simple en SVG : [{ etiquette, valeur }]
  const w = 640, h = 190, g = 34, b = 22, max = Math.max(1, ...series.map((x) => x.valeur));
  const pas = (w - g - 8) / Math.max(1, series.length), lb = Math.min(46, pas * 0.6);
  const y = (v) => h - b - (v / max) * (h - b - 18);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.titre || "")}">
    <line x1="${g}" x2="${w}" y1="${h - b}" y2="${h - b}" stroke="#E6E0CF"/>
    ${series.map((x, i) => { const cx = g + pas * i + pas / 2; return `<g><rect x="${cx - lb / 2}" y="${y(x.valeur)}" width="${lb}" height="${h - b - y(x.valeur)}" rx="5" fill="${x.couleur || "#0B4F3C"}" opacity="${x.valeur ? 1 : .25}"><title>${esc(x.etiquette)} : ${esc(opts.format ? opts.format(x.valeur) : x.valeur)}</title></rect>
      <text x="${cx}" y="${y(x.valeur) - 5}" text-anchor="middle" font-size="11" fill="#444">${x.valeur ? esc(opts.format ? opts.format(x.valeur) : x.valeur) : ""}</text>
      <text x="${cx}" y="${h - 6}" text-anchor="middle" font-size="11" fill="#6b6b6b">${esc(x.etiquette)}</text></g>`; }).join("")}
  </svg>`;
}

async function vueTableau(v) {
  const f = G.filtres;
  const suivi = (await ga({ action: "admin_parametres" })).parametres.debut_suivi || f.debut;
  const debut6 = [debutMois(plusJours(debutMois(G.js), -150)), suivi].sort()[1];
  const [jr, hist, eq] = await Promise.all([
    ga({ action: "admin_journees", debut: f.debut, fin: f.fin }),
    ga({ action: "admin_journees", debut: debut6, fin: G.js }),
    ga({ action: "admin_equipe" }),
  ]);
  G.equipe = eq.equipe;
  const rows = filtrer(jr.journees, f), tous = filtrer(hist.journees, f);
  const aujRows = filtrer(hist.journees.filter((r) => r.jour === G.js), f);
  const presents = eq.equipe.filter((x) => x.present && (!f.employe || x.id === +f.employe) && (!f.service || x.service === f.service));
  const absentsAuj = new Set(aujRows.filter((r) => ["absence_injustifiee", "absent_en_cours"].includes(r.statut)).map((r) => r.employe_id));
  const retardAuj = aujRows.filter((r) => r.retard_min > 0);
  const s = stats(rows);
  // classements sur la période filtrée
  const parEmp = {}; rows.forEach((r) => (parEmp[r.employe_id] ||= []).push(r));
  const classement = Object.entries(parEmp).map(([id, rs]) => ({ id: +id, nom: rs[0].nom, ...niveauMois(rs) })).filter((x) => x.s.jours > 0);
  const ponctuels = [...classement].sort((a, b) => (b.s.ponctualite ?? -1) - (a.s.ponctualite ?? -1) || a.s.cumul - b.s.cumul).slice(0, 5);
  const retardataires = [...classement].filter((x) => x.s.cumul > 0).sort((a, b) => b.s.cumul - a.s.cumul).slice(0, 5);
  // semaines (période) et mois (historique)
  const sem = {}; rows.forEach((r) => { const k = lundiDe(r.jour); sem[k] = (sem[k] || 0) + (r.retard_min || 0); });
  for (let d = lundiDe(f.debut); d <= f.fin; d = plusJours(d, 7)) sem[d] ||= 0;
  const mois = {}; tous.forEach((r) => { const k = r.jour.slice(0, 7); (mois[k] ||= []).push(r); });
  const lignesClassement = (l, vide) => l.length ? l.map((x) => `<li class="cliquable" data-fiche="${x.id}">${smiley(x.smiley, { taille: 30, titre: "Discipline : " + x.smiley })}<div class="flex"><div class="t">${esc(x.nom)}</div><div class="petit">${x.s.ponctualite ?? "—"} % ponctuel · ${x.s.nb_retards} retard${x.s.nb_retards > 1 ? "s" : ""} · ${duree(x.s.cumul)}</div></div></li>`).join("") : `<li class="vide">${vide}</li>`;
  v.innerHTML = `<div class="carte"><div class="ligne">
      <div class="flex"><label>Du</label><input type="date" id="f-debut" value="${f.debut}"></div><div class="flex"><label>Au</label><input type="date" id="f-fin" value="${f.fin}"></div>
      <div class="flex"><label>Employé</label><select id="f-emp">${optionsEmployes(f.employe)}</select></div><div class="flex"><label>Poste</label><select id="f-srv">${optionsServices(f.service)}</select></div></div></div>
    <h3 style="margin:16px 2px 8px">Aujourd'hui · ${esc(dateFr(G.js))}</h3>
    <div class="kpis">
      <div class="kpi"><b>${presents.length}</b><span>présents actuellement</span></div>
      <div class="kpi"><b>${absentsAuj.size}</b><span>absents ou pas encore arrivés</span></div>
      <div class="kpi"><b>${retardAuj.length}</b><span>en retard aujourd'hui</span></div>
    </div>
    <h3 style="margin:18px 2px 8px">Période · ${dateCourte(f.debut)} → ${dateCourte(f.fin)}</h3>
    <div class="kpis">
      <div class="kpi"><b>${s.ponctualite ?? "—"}${s.ponctualite === null ? "" : " %"}</b><span>ponctualité de l'équipe</span></div>
      <div class="kpi"><b>${duree(s.cumul)}</b><span>de retards (${s.nb_retards})</span></div>
      <div class="kpi"><b>${duree(s.heures_sup)}</b><span>d'heures supplémentaires</span></div>
      <div class="kpi"><b>${s.absences}</b><span>absences injustifiées</span></div>
      <div class="kpi"><b>${s.anomalies}</b><span>oublis de pointage</span></div>
      <div class="kpi"><b>${duree(s.travail)}</b><span>de travail effectif</span></div>
    </div>
    <div class="grille2" style="margin-top:12px">
      <div class="carte" style="margin:0"><h3>Les plus ponctuels</h3><ul class="liste">${lignesClassement(ponctuels, "Pas encore de données.")}</ul></div>
      <div class="carte" style="margin:0"><h3>Le plus de retards</h3><ul class="liste">${lignesClassement(retardataires, "Aucun retard sur la période.")}</ul></div>
    </div>
    <div class="grille2">
      <div class="carte graph"><h3>Retards par semaine</h3><p class="sous">Minutes de retard, période choisie</p>${barres(Object.keys(sem).sort().map((k) => ({ etiquette: dateCourte(k), valeur: sem[k], couleur: "#A8823C" })), { format: (x) => x + " min", titre: "Retards par semaine" })}</div>
      <div class="carte graph"><h3>Comparaison des mois</h3><p class="sous">Ponctualité de l'équipe (%)</p>${barres(Object.keys(mois).sort().map((k) => { const p = stats(mois[k]).ponctualite || 0; return { etiquette: MOIS[+k.slice(5) - 1].slice(0, 3) + ".", valeur: p, couleur: p >= 90 ? SMILEY_COULEURS.vert : p >= 75 ? SMILEY_COULEURS.jaune : p >= 60 ? SMILEY_COULEURS.orange : SMILEY_COULEURS.rouge }; }), { format: (x) => x + " %", titre: "Ponctualité par mois" })}</div>
    </div>

async function vueCalendrier(v, mois) {

  const ev = r.evenements || [];
  const prem = lundiDe(debut), cases = [];
  for (let d = prem; d <= fin || dow(d) !== 1; d = plusJours(d, 1)) cases.push(d);
  const [y, m] = G.moisCal.split("-").map(Number);

  $$("[data-dem]", v).forEach((li) => li.onclick = () => ficheDemande(+li.dataset.dem));

  $("#p-ajout").onclick = () => demanderMotif("Ajouter un pointage", "", async (m, r) => {

  }, { avant: `<label>Employé</label><select id="m-emp">${optionsEmployes(fp.employe, "Choisir…")}</select><label>Type</label><select id="m-type"><option value="arrivee">Arrivée</option><option value="depart">Départ</option></select>
    <label>Heure (journée du ${esc(dateFr(fp.jour))} ; avant 05h00 = nuit suivante)</label><input type="time" id="m-heure">` });
}

// ---------- Horaires ----------
async function vueHoraires(v, id) {
  G.empH = id ? String(id) : (G.empH || String(G.equipe.find((x) => x.actif)?.id || ""));
  const cr = (await ga({ action: "admin_creneaux", employe_id: G.empH })).creneaux;
  const parJour = {}; for (let j = 1; j <= 7; j++) parJour[j] = cr.filter((c) => c.jour === j).map((c) => ({ debut: c.debut.slice(0, 5), fin: c.fin.slice(0, 5), pause_min: c.pause_min }));
  const ligneC = (c) => `<div class="creneau"><input type="time" value="${c.debut}" data-k="debut" aria-label="Début"><input type="time" value="${c.fin}" data-k="fin" aria-label="Fin"><input type="number" min="0" max="240" value="${c.pause_min || 0}" data-k="pause_min" aria-label="Pause (min)" title="Pause en minutes"><button class="x" data-suppr aria-label="Retirer">×</button></div>`;
  v.innerHTML = `<div class="carte"><label>Employé</label><select id="h-emp">${optionsEmployes(G.empH, "Choisir…")}</select>
    <p class="petit" style="margin-top:8px">Pour chaque jour : début, fin et pause (minutes). Aucun créneau = jour OFF. Un service après minuit se termine le lendemain (ex. 19:00 → 02:00).</p>
    <div id="h-jours">${[1, 2, 3, 4, 5, 6, 7].map((j) => `<div class="creneaux-jour" data-j="${j}"><div><b>${JOURS[j]}</b><div><button class="b-lien" data-ajout style="padding:4px 0">+ créneau</button></div></div>
      <div data-liste>${parJour[j].map(ligneC).join("") || `<span class="petit">OFF</span>`}</div></div>`).join("")}</div>
    <div id="h-msg"></div><div class="pile" style="margin-top:12px"><button class="b-principal" id="h-ok">Enregistrer les modifications</button></div></div>`;
  $("#h-emp").onchange = (e) => allerA("horaires", e.target.value);
  const lire = (bloc) => $$(".creneau", bloc).map((l) => ({ debut: $('[data-k="debut"]', l).value, fin: $('[data-k="fin"]', l).value, pause_min: +$('[data-k="pause_min"]', l).value || 0 })).filter((c) => c.debut && c.fin);
  const origine = JSON.stringify(parJour);
  $$(".creneaux-jour", v).forEach((bloc) => {
    const liste = $("[data-liste]", bloc);
    const brancher = () => $$("[data-suppr]", liste).forEach((b) => b.onclick = () => { b.parentElement.remove(); if (!$(".creneau", liste)) liste.innerHTML = `<span class="petit">OFF</span>`; });
    $("[data-ajout]", bloc).onclick = () => { if ($$(".creneau", liste).length >= 4) return; if (!$(".creneau", liste)) liste.innerHTML = ""; liste.insertAdjacentHTML("beforeend", ligneC({ debut: "", fin: "", pause_min: 0 })); brancher(); };
    brancher();
  });
  $("#h-ok").onclick = () => {
    const nouveaux = {}; $$(".creneaux-jour", v).forEach((b) => nouveaux[b.dataset.j] = lire(b));
    const changes = Object.keys(nouveaux).filter((j) => JSON.stringify(nouveaux[j]) !== JSON.stringify(JSON.parse(origine)[j]));
    if (!changes.length) return msg($("#h-msg"), "Aucune modification.", "info");
    demanderMotif("Enregistrer les horaires", `${changes.length} jour(s) modifié(s) : ${changes.map((j) => JOURS[j]).join(", ")}.`, async (m) => {
      for (const j of changes) await ga({ action: "admin_creneaux_enregistrer", employe_id: G.empH, jour: +j, creneaux: nouveaux[j], motif: m });
      allerA("horaires", G.empH);
    }, { placeholder: "Ex. : nouveau planning de décembre" });
  };
}

// ---------- Réglages ----------
async function vueReglages(v) {
  const [p, cx, cfgR] = await Promise.all([ga({ action: "admin_parametres" }), ga({ action: "admin_connexion" }), ga({ action: "admin_emojis_config" })]);
  const P = p.parametres, c = cfgR.config;
  const champ = (cle, lib, type = "number", aide = "") => `<div class="flex"><label>${lib}</label><input type="${type}" data-p="${cle}" value="${esc(P[cle] ?? "")}">${aide ? `<div class="petit">${aide}</div>` : ""}</div>`;
  v.innerHTML = `<div class="carte"><h3>Règles de calcul</h3>
      <div class="ligne">${champ("tolerance_retard_min", "Tolérance de retard (min)")}${champ("seuil_heures_sup_min", "Heures sup comptées au-delà de (min)")}</div>
      <div class="ligne"><div class="flex"><label>Calcul du retard</label><select data-p="mode_retard"><option value="complet" ${P.mode_retard === "complet" ? "selected" : ""}>Tout le retard dès que la tolérance est dépassée</option><option value="deduit" ${P.mode_retard === "deduit" ? "selected" : ""}>Retard moins la tolérance</option></select></div>
      ${champ("debut_suivi", "Début du suivi", "date")}</div>
      <div class="ligne">${champ("alerte_cumul_1_min", "Alerte retard cumulé 1 (min)")}${champ("alerte_cumul_2_min", "Alerte retard cumulé 2 (min)")}</div>
      <div id="r-msg1"></div><div class="pile" style="margin-top:10px"><button class="b-principal" id="r-ok1">Enregistrer</button></div></div>
    <div class="carte"><h3>Smileys</h3><p class="sous">Le smiley n'est qu'un repère : les minutes restent toujours affichées.</p>
      <div class="ligne" style="margin:12px 0">${["vert", "jaune", "orange", "rouge"].map((n) => `<div style="text-align:center">${smiley(n, { taille: 40, couleur: c.couleurs[n] })}<input type="color" data-coul="${n}" value="${c.couleurs[n]}" style="width:56px;height:34px;padding:2px;margin-top:4px"></div>`).join("")}</div>
      <div class="ligne"><div class="flex"><label>« En avance » à partir de (min avant)</label><input type="number" id="s-av" value="${c.jour.avance_min}"></div>
        <div class="flex"><label>Petit retard jusqu'à (min)</label><input type="number" id="s-p1" value="${c.jour.paliers[0]}"></div><div class="flex"><label>Retard moyen jusqu'à (min)</label><input type="number" id="s-p2" value="${c.jour.paliers[1]}"></div></div>
      <div class="ligne"><div class="flex"><label>Mois : retards répétés dès (nombre / minutes)</label><div class="ligne"><input type="number" id="s-n1" value="${c.mois.nombre[0]}"><input type="number" id="s-m1" value="${c.mois.minutes[0]}"></div></div>
        <div class="flex"><label>Retards importants dès</label><div class="ligne"><input type="number" id="s-n2" value="${c.mois.nombre[1]}"><input type="number" id="s-m2" value="${c.mois.minutes[1]}"></div></div>
        <div class="flex"><label>Très importants dès</label><div class="ligne"><input type="number" id="s-n3" value="${c.mois.nombre[2]}"><input type="number" id="s-m3" value="${c.mois.minutes[2]}"></div></div></div>
      <details style="margin-top:12px"><summary class="petit" style="cursor:pointer">Messages affichés</summary>
        ${Object.entries(c.jour.messages).map(([k, m]) => `<label>Jour · ${esc(k)}</label><input data-mj="${k}" value="${esc(m)}" maxlength="160">`).join("")}
        ${c.mois.messages.map((m, i) => `<label>Mois · niveau ${i}</label><input data-mm="${i}" value="${esc(m)}" maxlength="160">`).join("")}
        <p class="petit">{retard} = minutes de retard · {retards} = « 3 retards » · {cumul} = minutes cumulées</p></details>
      <div id="r-msg2"></div><div class="ligne" style="margin-top:10px"><button class="b-principal flex" id="r-ok2">Enregistrer</button><button class="b-sec flex" id="r-defaut">Valeurs par défaut</button></div></div>
    <div class="carte"><h3>Wi-Fi du restaurant</h3><p class="sous">Adresse vue maintenant : ${esc(cx.ip_vue)} · ${cx.wifi ? "réseau autorisé" : "réseau non autorisé"}</p>
      <ul class="liste">${cx.reseaux.map((r) => `<li><div class="flex"><div class="t">${esc(r.libelle || "Wi-Fi")}</div><div class="petit">${esc(r.reseau)}</div></div><button class="b-lien" style="color:var(--rouge)" data-ret="${esc(r.reseau)}">Retirer</button></li>`).join("") || `<li class="vide">Aucun réseau enregistré.</li>`}</ul>
      <div class="pile" style="margin-top:8px"><button class="b-sec" id="r-wifi">Enregistrer le réseau actuel comme Wi-Fi Capanna</button></div><p class="petit">À faire depuis le restaurant, connecté au Wi-Fi Capanna. Si la box change d'adresse, refais-le.</p></div>`;
  $("#r-ok1").onclick = () => {
    const changes = $$("[data-p]", v).filter((i) => String(i.value) !== String(P[i.dataset.p] ?? ""));
    if (!changes.length) return msg($("#r-msg1"), "Aucune modification.", "info");
    demanderMotif("Modifier les règles", "Les statistiques seront recalculées immédiatement.", async (m) => { for (const i of changes) await ga({ action: "admin_parametre_modifier", cle: i.dataset.p, valeur: i.value, motif: m }); allerA("reglages"); });
  };
  $("#r-ok2").onclick = () => {
    const n = (s) => +$(s).value;
    const config = { couleurs: Object.fromEntries($$("[data-coul]", v).map((i) => [i.dataset.coul, i.value])),
      jour: { avance_min: n("#s-av"), paliers: [n("#s-p1"), n("#s-p2")], messages: Object.fromEntries($$("[data-mj]", v).map((i) => [i.dataset.mj, i.value])) },
      mois: { nombre: [n("#s-n1"), n("#s-n2"), n("#s-n3")], minutes: [n("#s-m1"), n("#s-m2"), n("#s-m3")], messages: $$("[data-mm]", v).map((i) => i.value) } };
    demanderMotif("Modifier les smileys", "", async (m) => { const r = await ga({ action: "admin_emojis_config_modifier", config, motif: m }); G.cfg = r.config; Object.assign(SMILEY_COULEURS, r.config.couleurs); allerA("reglages"); });
  };
  $("#r-defaut").onclick = () => demanderMotif("Revenir aux valeurs par défaut", "", async (m) => { const r = await ga({ action: "admin_emojis_config_modifier", defaut: true, motif: m }); G.cfg = r.config; Object.assign(SMILEY_COULEURS, r.config.couleurs); allerA("reglages"); });
  $("#r-wifi").onclick = async () => { try { await ga({ action: "admin_ajouter_wifi" }); allerA("reglages"); } catch (e) { alert(e.message); } };
  $$("[data-ret]", v).forEach((b) => b.onclick = async () => { if (!confirm("Retirer ce réseau ? Plus personne ne pourra pointer depuis celui-ci.")) return; await ga({ action: "admin_retirer_wifi", reseau: b.dataset.ret }); allerA("reglages"); });
}

// ---------- Journal ----------
async function vueJournal(v) {
  const j = await ga({ action: "admin_journal", limite: 200 });
  const resume = (x) => { if (!x) return ""; if (typeof x !== "object") return String(x); if (Array.isArray(x)) return x.map((c) => c.debut ? `${String(c.debut).slice(0, 5)}–${String(c.fin).slice(0, 5)}` : JSON.stringify(c)).join(", ") || "OFF";
    return Object.entries(x).filter(([k]) => !["id"].includes(k)).map(([k, val]) => `${k} : ${typeof val === "object" ? "…" : val}`).join(" · "); };
  v.innerHTML = `<div class="carte"><h3>Journal des modifications</h3><p class="sous">Toutes les modifications, avec leur auteur et leur motif. Rien ne peut être effacé.</p>
    <div class="tableau" style="margin-top:8px"><table><thead><tr><th>Quand</th><th>Qui</th><th>Objet</th><th>Action</th><th>Avant</th><th>Après</th><th>Motif</th></tr></thead><tbody>
    ${j.journal.map((x) => `<tr><td>${dateHeure(x.quand)}</td><td>${esc(x.auteur)}</td><td>${esc(x.objet)} ${esc(x.objet_id || "")}</td><td>${esc(x.action)}</td>
      <td class="petit" style="white-space:normal;max-width:220px">${esc(resume(x.ancienne))}</td><td class="petit" style="white-space:normal;max-width:220px">${esc(resume(x.nouvelle))}</td><td style="white-space:normal;max-width:240px">${esc(x.motif)}</td></tr>`).join("") || `<tr><td colspan="7" class="vide">Journal vide.</td></tr>`}
    </tbody></table></div></div>`;
}

// ---------- Exports ----------
function exporterCSV(rows, nom) {
  const cols = [["Date", (r) => r.jour], ["Employé", (r) => r.nom], ["Poste", (r) => r.service], ["Prévu début", (r) => hcourt(r.prevu_debut)], ["Prévu fin", (r) => hcourt(r.prevu_fin)],
    ["Arrivée", (r) => r.arrivee_min == null ? "" : hhmm(r.arrivee_min)], ["Départ", (r) => r.depart_min == null ? "" : hhmm(r.depart_min)], ["Retard (min)", (r) => r.retard_min || 0],
    ["Retard justifié (min)", (r) => r.retard_justifie_min || 0], ["Départ anticipé (min)", (r) => r.depart_anticipe_min || 0], ["Heures sup (min)", (r) => r.heures_sup_min || 0],
    ["Présence (min)", (r) => r.presence_min ?? ""], ["Travail effectif (min)", (r) => r.travail_min ?? ""], ["Statut", (r) => LIB_JOUR[r.statut] || r.statut], ["Absence", (r) => LIB_TYPE[r.absence_type] || ""]];
  const cell = (x) => { const s = String(x ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = "﻿" + [cols.map((c) => c[0]).join(";"), ...[...rows].sort((a, b) => a.jour.localeCompare(b.jour) || a.nom.localeCompare(b.nom)).map((r) => cols.map((c) => cell(c[1](r))).join(";"))].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = nom; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function imprimer(html) { $("#impression").innerHTML = html; setTimeout(() => window.print(), 50); }
function rapportMensuelPDF(e, rows, nm) {
  const s = stats(rows), mois = MOIS[+G.js.slice(5, 7) - 1] + " " + G.js.slice(0, 4);
  imprimer(`<h1>Rapport mensuel · ${esc(e.nom)}</h1><p>${esc(e.service)} · ${esc(mois)} (jusqu'au ${dateCourte(G.js)}) · Capanna</p>
    <div style="display:flex;align-items:center;gap:10px;margin:8px 0">${smiley(nm.smiley, { taille: 36 })}<span>Discipline du mois</span></div>
    <div class="kpis">${[["Jours travaillés", s.jours], ["Retards", s.nb_retards], ["Retard cumulé", duree(s.cumul)], ["Retard moyen", duree(s.moyenne)], ["Ponctualité", (s.ponctualite ?? "—") + " %"], ["Absences injustifiées", s.absences], ["Heures sup", duree(s.heures_sup)], ["Travail effectif", duree(s.travail)]].map(([l, x]) => `<div class="kpi"><b>${esc(x)}</b><span>${l}</span></div>`).join("")}</div>
    <table style="margin-top:12px"><thead><tr><th>Date</th><th>Prévu</th><th>Arrivée</th><th>Retard</th><th>Départ</th><th>Travail</th><th>Statut</th></tr></thead><tbody>
    ${[...rows].sort((a, b) => a.jour.localeCompare(b.jour)).map((r) => `<tr><td>${dateCourte(r.jour)} ${JOURS_C[dow(r.jour)]}</td><td>${r.prevu_debut ? hcourt(r.prevu_debut) + "–" + hcourt(r.prevu_fin) : "—"}</td><td>${hhmm(r.arrivee_min)}</td><td>${r.retard_min ? r.retard_min + " min" : "—"}</td><td>${hhmm(r.depart_min)}</td><td>${r.travail_min ? duree(r.travail_min) : "—"}</td><td>${esc(LIB_JOUR[r.statut] || "")}</td></tr>`).join("")}</tbody></table>
    <p style="margin-top:14px;font-size:10px;color:#666">Édité le ${new Date().toLocaleString("fr-FR", { timeZone: TZ })} · calculé à partir des pointages réels et des horaires prévus.</p>`);
}
function rapportGlobalPDF(rows, f) {
  const par = {}; rows.forEach((r) => (par[r.employe_id] ||= []).push(r));
  const lignes = Object.values(par).map((rs) => ({ nom: rs[0].nom, service: rs[0].service, ...stats(rs), n: niveauMois(rs) })).sort((a, b) => a.nom.localeCompare(b.nom));
  const s = stats(rows);
  imprimer(`<h1>Rapport du personnel · Capanna</h1><p>Du ${dateCourte(f.debut)} au ${dateCourte(f.fin)}</p>
    <div class="kpis">${[["Ponctualité", (s.ponctualite ?? "—") + " %"], ["Retards", s.nb_retards], ["Retard cumulé", duree(s.cumul)], ["Heures sup", duree(s.heures_sup)]].map(([l, x]) => `<div class="kpi"><b>${esc(x)}</b><span>${l}</span></div>`).join("")}</div>
    <table style="margin-top:12px"><thead><tr><th></th><th>Employé</th><th>Poste</th><th>Jours</th><th>Retards</th><th>Cumul</th><th>Ponctualité</th><th>Absences</th><th>Heures sup</th><th>Travail</th></tr></thead><tbody>
    ${lignes.map((x) => `<tr><td>${smiley(x.n.smiley, { taille: 18 })}</td><td>${esc(x.nom)}</td><td>${esc(x.service)}</td><td>${x.jours}</td><td>${x.nb_retards}</td><td>${duree(x.cumul)}</td><td>${x.ponctualite ?? "—"} %</td><td>${x.absences}</td><td>${duree(x.heures_sup)}</td><td>${duree(x.travail)}</td></tr>`).join("")}</tbody></table>`);
}
