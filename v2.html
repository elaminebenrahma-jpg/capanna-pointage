<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capanna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Capanna – Pointage</title>
<style>
:root{--vert:#0B4F3C;--vert-2:#0E6B51;--or:#A8823C;--fond:#F2EEE1;--carte:#fff;--ligne:#E6E0CF;--texte:#1d1d1d;--gris:#6b6b6b;--rouge:#B3261E;
  --s-vert:#2E9E5B;--s-jaune:#D9A400;--s-orange:#E2742B;--s-rouge:#D2453F;--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte);
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 12px);font-size:15px;line-height:1.4}
header.marque{text-align:center;padding:22px 16px 6px}
header.marque img{display:block;width:160px;max-width:50%;height:auto;margin:0 auto}
header.marque p{margin:4px 0 0;color:var(--or);font-size:12px;letter-spacing:2px;text-transform:uppercase}
main{max-width:480px;margin:0 auto;padding:0 14px}
body.admin main{max-width:1100px}
.carte{background:var(--carte);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em} h2{font-size:20px} h3{font-size:16px}
.sous{color:var(--gris);font-size:14px;margin:4px 0 0}
.petit{font-size:13px;color:var(--gris)}
.cache{display:none!important}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:default}
.b-principal{background:var(--vert);color:#fff}.b-or{background:var(--or);color:#fff}
.b-sec{background:#EEE9DA;color:var(--texte);font-weight:500}.b-danger{background:#FBE7E6;color:var(--rouge)}
.b-lien{background:none;color:var(--vert);padding:6px 8px;font-weight:600}
.b-plein{width:100%}.b-grand{font-size:18px;padding:17px}
.pile{display:grid;gap:10px}.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ligne>.flex{flex:1;min-width:120px}
label{display:block;font-size:13px;color:var(--gris);margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border-radius:12px;border:1px solid #D8D2BF;background:#fff;font-size:16px;color:var(--texte)}
textarea{min-height:84px;resize:vertical}
.msg{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:14px}
.msg.bon{background:#E5F3EA;color:#145C33}.msg.mal{background:#FBE7E6;color:var(--rouge)}.msg.info{background:#F4EFE0;color:#5c4b22}
.wifi{display:flex;align-items:center;gap:10px}.pastille{width:11px;height:11px;border-radius:50%;background:#c9c9c9;flex:none}
.wifi.ok .pastille{background:var(--s-vert)}.wifi.ko .pastille{background:var(--rouge)}
.onglets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:8px 0 2px;-webkit-overflow-scrolling:touch}
.onglets::-webkit-scrollbar{display:none}
.onglet{flex:none;background:#E9E3D2;color:#3b3b3b;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;position:relative}
.onglet.actif{background:var(--vert);color:#fff}
.badge{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rouge);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:6px}
.puce{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#EEE9DA;color:#444;white-space:nowrap}
.puce.attente{background:#FFF4D6;color:#8A6400}.puce.complement{background:#FDEBDC;color:#9A4A12}.puce.validee{background:#E5F3EA;color:#145C33}
.puce.refusee{background:#FBE7E6;color:var(--rouge)}.puce.annulee{background:#eee;color:#777}.puce.manquant{background:#FBE7E6;color:var(--rouge)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}.kpi span{font-size:13px;color:var(--gris)}
.grille2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.liste{list-style:none;margin:0;padding:0}.liste li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid #F0EBDD}
.liste li:first-child{border-top:0}.liste .t{font-weight:600}.liste .flex{flex:1;min-width:0}
.cliquable{cursor:pointer}.cliquable:hover{background:#FBF9F3}
.tableau{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-top:1px solid #F0EBDD;vertical-align:middle;white-space:nowrap}
th{color:var(--gris);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.barre td{color:#aaa;text-decoration:line-through}
.resultat{display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px;border-radius:14px;background:#FBF9F3}
.resultat .t{font-weight:650;font-size:16px}
.journal-jour{list-style:none;padding:0;margin:12px 0 0}.journal-jour li{padding:7px 0;border-top:1px solid #F0EBDD}
.apercu{margin-top:10px;border:1px dashed #D8D2BF;border-radius:12px;padding:10px;display:flex;gap:12px;align-items:center}
.apercu img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#eee}
.apercu .doc{width:72px;height:72px;border-radius:8px;background:#F4EFE0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--or)}
.voile{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.feuille{background:var(--fond);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
@media(min-width:700px){.voile{align-items:center;padding:20px}.feuille{border-radius:20px}}
.feuille .entete{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.doc-vue img{max-width:100%;border-radius:12px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .j{background:#fff;border-radius:10px;min-height:64px;padding:5px;font-size:11px;overflow:hidden}
.cal .j.hors{opacity:.35}.cal .j.auj{outline:2px solid var(--vert)}
.cal .j .n{font-weight:700;font-size:12px;color:#555}.cal .j .ev{margin-top:3px;padding:2px 4px;border-radius:5px;background:#E5F3EA;color:#145C33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .j .ev.conge{background:#E6EEF9;color:#1E4C8F}.cal .j .ev.maladie{background:#FBE7E6;color:#8E1F19}.cal .j .ev.attente{background:#FFF4D6;color:#8A6400}
.cal .tete{font-size:11px;color:var(--gris);text-align:center;font-weight:600;padding:2px 0}
.creneaux-jour{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:start;padding:10px 0;border-top:1px solid #F0EBDD}
.creneau{display:grid;grid-template-columns:1fr 1fr 74px 32px;gap:6px;margin-bottom:6px}
.creneau input{padding:9px 8px;font-size:15px}
.x{background:#F4EFE0;border-radius:10px;padding:0;width:32px;height:40px;color:#666}
.graph svg{width:100%;height:auto;display:block}
.vide{color:var(--gris);text-align:center;padding:18px 8px;font-size:14px}
.retour{display:inline-flex;align-items:center;gap:4px}
/* smileys */
.smiley{display:inline-block;vertical-align:middle;max-width:100%;height:auto;flex:none}
.smiley-anime{animation:smiley-entree .45s cubic-bezier(.2,.8,.2,1) both}
.smiley-anime .smiley-visage{stroke-dasharray:126;stroke-dashoffset:126;animation:smiley-trait .6s .05s ease-out forwards}
.smiley-anime .smiley-oeil,.smiley-anime .smiley-bouche{opacity:0;animation:smiley-fondu .25s .45s ease-out forwards}
@keyframes smiley-entree{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes smiley-trait{to{stroke-dashoffset:0}}
@keyframes smiley-fondu{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.smiley-anime,.smiley-anime *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
/* impression (rapport PDF) */
/* ---------- barre de navigation flottante (espace gérant) ---------- */
:root{--nav-h:72px;--nav-bas:calc(env(safe-area-inset-bottom) + 12px);--nav-actif:#33383D;--nav-inactif:#92979B}
body.admin{padding-bottom:calc(var(--nav-h) + var(--nav-bas) + 28px)}
.nav-bas{position:fixed;z-index:40;left:50%;bottom:var(--nav-bas);transform:translateX(-50%);
  width:min(calc(100% - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)),620px);height:var(--nav-h);
  display:grid;grid-template-columns:repeat(6,1fr);align-items:stretch;padding:6px;border-radius:26px;
  background:rgba(242,243,243,.72);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 10px 30px -8px rgba(35,40,45,.20),0 2px 8px rgba(35,40,45,.06),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav-bas{background:rgba(242,243,243,.97)}}
.nav-bas.masquee{transform:translate(-50%,calc(100% + var(--nav-bas) + 8px));opacity:0;pointer-events:none}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;
  background:none;border-radius:20px;padding:2px 2px 9px;color:var(--nav-inactif);font-weight:560;font-size:10.5px;letter-spacing:.005em;line-height:1.1;
  transition:color .22s ease,transform .18s ease}
.nav-item svg{width:23px;height:23px;flex:none;stroke-width:1.9;transition:transform .28s cubic-bezier(.34,1.56,.64,1),stroke-width .2s}
.nav-item .nav-lib{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;padding-top:1px}
.nav-item>[data-badge]{position:absolute;inset:0;pointer-events:none}
.nav-item .nav-lib-court{display:none}
.nav-item::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;border-radius:2px;background:var(--nav-actif);
  transform:translateX(-50%) scale(0);opacity:0;transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .2s,width .28s}
.nav-item.actif{color:var(--nav-actif);font-weight:650}
.nav-item.actif svg{transform:scale(1.12) translateY(-1px);stroke-width:2.1}
.nav-item.actif::after{transform:translateX(-50%) scale(1);opacity:1;width:14px}
.nav-item:active{transform:scale(.93)}
.nav-item:focus-visible{outline:2px solid rgba(51,56,61,.45);outline-offset:-2px}
@media(hover:hover){.nav-item:not(.actif):hover{color:#5F6469}.nav-item:not(.actif):hover svg{transform:translateY(-1px)}}
.nav-pastille{position:absolute;top:3px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#D2453F;color:#fff;
  font-size:10.5px;font-weight:700;line-height:17px;text-align:center;box-shadow:0 0 0 2px rgba(242,243,243,.95)}
@media(max-width:400px){.nav-item .nav-lib-long{display:none}.nav-item .nav-lib-court{display:inline}.nav-item{font-size:10px}}
@media(min-width:700px){:root{--nav-h:76px}.nav-item{font-size:11.5px}.nav-item svg{width:24px;height:24px}}
@media(prefers-reduced-motion:reduce){.nav-bas,.nav-item,.nav-item svg,.nav-item::after{transition:none!important}}
.entete-g{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;min-height:40px}
.entete-g h2{font-size:22px}
.segments{display:inline-flex;gap:2px;padding:3px;margin:10px 0 2px;border-radius:12px;background:rgba(51,56,61,.07)}
.segments button{background:none;border-radius:9px;padding:7px 14px;font-size:14px;font-weight:600;color:#6E7378;transition:background .2s,color .2s}
.segments button.actif{background:#fff;color:var(--nav-actif);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* ---------- planning hebdomadaire ---------- */
.pl-barre{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:12px 0 8px}
.pl-sem{display:flex;align-items:center;gap:8px}
.pl-fl{width:40px;height:40px;padding:0;border-radius:12px;background:#fff;color:#33383D;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pl-fl svg{width:20px;height:20px}
.pl-titre{display:flex;flex-direction:column;line-height:1.2;padding:0 4px;min-width:0}.pl-titre b{font-size:16px;white-space:nowrap}.pl-titre>span{font-size:12px;color:var(--gris)}
.pl-auj{padding:0;font-size:12px}
.pl-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pl-actions select{width:auto;padding:10px 12px;font-size:14px}
.pl-actions button{padding:11px 15px;font-size:14px}
.pl-ic{display:inline-flex;align-items:center;justify-content:center;gap:8px}.pl-ic svg{width:17px;height:17px;flex:none}
.pl-bandeau{background:#FFF7E0;border:1px solid #F0DFA8;color:#6B5310;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:4px 0 8px}
.pl-bandeau b{display:block;margin-bottom:2px;color:#4f3c06}
.pl-legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--gris);margin:6px 2px 10px}
.pl-legende i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.pl-legende .pl-exc-l{width:7px;height:7px;border-radius:50%;background:#33383D;opacity:.55;vertical-align:0}
.pl-carte{padding:0;overflow:hidden;margin-top:4px}
.pl.edition .pl-carte{box-shadow:0 0 0 2px rgba(51,56,61,.22),0 4px 14px rgba(0,0,0,.05)}
.pl-scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.pl-table{border-collapse:separate;border-spacing:0;width:100%;min-width:880px;font-size:13px;table-layout:fixed}
.pl-table th,.pl-table td{border-top:1px solid #F0EBDD;padding:0;white-space:normal;vertical-align:top;text-align:left}
.pl-table thead th{position:sticky;top:0;background:#FBF9F3;z-index:2;text-align:center;padding:10px 4px;font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;border-top:0;border-bottom:1px solid #EDE7D6;font-weight:600}
.pl-table thead th b{display:block;font-size:17px;color:var(--texte);letter-spacing:0;margin:3px auto 0;width:30px;height:30px;line-height:30px;border-radius:9px}
.pl-table thead th.auj{color:var(--vert)}.pl-table thead th.auj b{color:#fff;background:var(--vert)}
.pl-table thead th.passe b{color:#9a9a9a}
.pl-col-nom{position:sticky;left:0;z-index:1;background:#fff;text-align:left!important;min-width:172px;width:172px;padding:10px 12px!important;border-right:1px solid #F0EBDD;vertical-align:middle!important}
.pl-table thead .pl-col-nom{z-index:3;background:#FBF9F3;vertical-align:bottom!important}
.pl-nom{font-weight:650;font-size:14px;color:var(--texte);text-transform:none;letter-spacing:0}
.pl-poste{font-size:12px;color:var(--gris);font-weight:500;text-transform:none;letter-spacing:0;margin-top:1px}
.pl-neuf{display:inline-block;font-size:10px;font-weight:700;background:#33383D;color:#fff;border-radius:5px;padding:1px 5px;vertical-align:1px;letter-spacing:.03em}
.pl-retirer{padding:2px 0;font-size:12px;color:var(--rouge)}
.pl-sel-poste{width:100%;margin-top:5px;padding:5px 7px;font-size:12.5px;border-radius:8px}
.pl-col-tot{text-align:right!important;padding:10px 12px!important;color:#55595d;font-variant-numeric:tabular-nums;width:76px;font-weight:650;vertical-align:middle!important}
.pl-table thead .pl-col-tot{vertical-align:bottom!important}
.pl-groupe td{background:#F7F4EC;padding:7px 0!important;font-size:11.5px;font-weight:700;color:#4a4a4a;text-transform:uppercase;letter-spacing:.06em}
.pl-groupe .st{position:sticky;left:12px;display:inline-flex;align-items:center;gap:7px;padding-left:12px}
.pl-groupe .nb{font-weight:600;color:#9a9a9a}
.pl-pastille{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pl-case{min-width:98px;position:relative}
.pl-case-in{display:flex;flex-direction:column;gap:3px;padding:7px 6px;min-height:56px;border-radius:9px;transition:background .15s}
.pl-case.auj{background:rgba(11,79,60,.035)}
.pl-case.passe .pl-case-in{opacity:.55}
.pl-cr{display:block;background:#F4F5F6;border-left:3px solid var(--c);border-radius:6px;padding:4px 6px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;color:#2b2f33;white-space:nowrap}
.pl-cr.barre{text-decoration:line-through;color:#a3a3a3;border-left-color:#d4d4d4;font-weight:500}
.pl-repos{display:block;text-align:center;color:#A6A9AC;font-size:12px;padding:6px 0;border:1px dashed #E3E0D7;border-radius:6px}
.pl-repos.grand{padding:16px;font-size:14px;margin-top:10px}
.pl-plus{display:block;text-align:center;color:#9AA0A6;font-size:18px;line-height:1;padding:7px 0;border:1px dashed #D5D8DB;border-radius:6px}
.pl-abs{display:block;border-radius:6px;padding:4px 6px;font-size:12px;font-weight:650;text-align:center}
.t-conge{background:#E6EEFA;color:#2F5A9A}.t-maladie{background:#FBEAEA;color:#A33B3B}.t-absence_autorisee{background:#EFEAF8;color:#664A9E}.t-absence_injustifiee{background:#F3F0EA;color:#7A6A4A}
.pl-tag{display:block;font-size:11px;font-weight:600;color:#8A6400;background:#FFF4D6;border-radius:5px;padding:2px 5px;text-align:center;white-space:nowrap}
.pl-tag.attente{color:#7a7a7a;background:#F0EEE8;font-weight:500}
.pl-exc{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#33383D;opacity:.5}
.pl-eff{text-align:center!important;padding:8px 4px!important;font-weight:650;color:#55595d;font-variant-numeric:tabular-nums;background:#FBF9F3}
.pl-table tfoot .pl-col-nom{background:#FBF9F3}
.pl-case.editable{cursor:pointer}
.pl-case.editable:hover .pl-case-in{background:rgba(51,56,61,.05)}
.pl-case.editable:focus-visible{outline:none}.pl-case.editable:focus-visible .pl-case-in{box-shadow:inset 0 0 0 2px rgba(51,56,61,.5)}
.pl-case.modifie .pl-case-in,.pl-ligne.modifie{box-shadow:inset 0 0 0 2px #33383D;background:#FAFAF8}
.pl.edition .pl-case.passe{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.03) 6px 12px)}
.pl-ajout{margin-top:12px;border:1.5px dashed #CFC9B8;background:transparent}
.pl-mob,.pl-jchips,.pl-jliste{display:none}
.pl-jchips{grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0 6px}
.pl-jchips button{background:#fff;border-radius:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--gris);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .15s,color .15s}
.pl-jchips button b{font-size:16px;color:var(--texte)}
.pl-jchips button.actif{background:#33383D;color:#d9dbdd}.pl-jchips button.actif b{color:#fff}
.pl-jchips button.auj:not(.actif){box-shadow:inset 0 0 0 1.5px var(--vert)}
.pl-grp{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#4a4a4a;margin:16px 4px 6px;display:flex;align-items:center;gap:7px}
.pl-ligne{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:11px 12px;margin:6px 0;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative}
.pl-ligne .qui{flex:1;min-width:0}.pl-ligne .qui b{display:block;font-size:14.5px}.pl-ligne .qui span{font-size:12px;color:var(--gris)}
.pl-ligne .quoi{display:flex;flex-direction:column;gap:3px;align-items:stretch;min-width:118px}
.pl-ligne.passe .quoi{opacity:.6}
.pl-ligne.editable{cursor:pointer}
.pl-ligne.editable::after{content:"";width:7px;height:7px;border-right:2px solid #b5b8bb;border-top:2px solid #b5b8bb;transform:rotate(45deg);margin-left:2px;flex:none}
.ce-ligne{display:grid;grid-template-columns:1fr 1fr 96px 40px;gap:8px;align-items:end;margin-top:10px}
.ce-ligne label{margin:0 0 4px}
.ce-x{width:40px;height:46px;padding:0;background:#FBE7E6;color:var(--rouge);border-radius:12px;font-size:20px;font-weight:500}
.pl-recap{list-style:none;padding:0;margin:8px 0 4px;max-height:230px;overflow:auto;font-size:13.5px;background:#fff;border-radius:12px;padding:2px 12px}
.pl-recap li{padding:8px 0;border-top:1px solid #F0EBDD}.pl-recap li:first-child{border-top:0}
.pl-recap .avant{color:#9a9a9a;text-decoration:line-through}
.pl-choix{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #E6E0CF;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;color:var(--texte);font-size:14px}
.pl-choix input{width:auto;margin:3px 0 0;accent-color:#33383D}
.pl-choix small{display:block;color:var(--gris);font-size:12.5px;margin-top:2px;line-height:1.35}
.pl-choix:has(input:checked){border-color:#33383D;box-shadow:0 0 0 1px #33383D}
@media(max-width:699px){
  .pl-mob{display:inline-flex}
  .pl-m-jour .pl-jchips{display:grid}.pl-m-jour .pl-jliste{display:block}.pl-m-jour .pl-carte{display:none}
  .pl-barre{flex-direction:column;align-items:stretch}
  .pl-sem{justify-content:space-between}.pl-titre{align-items:center;text-align:center;flex:1}
  .pl-actions select{flex:1 1 100%;min-width:0}.pl-actions button{flex:1}
  #pl-imprimer{flex:none;width:48px;padding:11px 0}#pl-imprimer span{display:none}
  .pl-legende{font-size:11px;gap:4px 10px}.pl-m-jour .pl-legende{display:none}
  .pl-table{min-width:740px;font-size:12px}.pl-col-nom{min-width:120px;width:120px;padding:8px 9px!important}.pl-nom{font-size:13px}.pl-case{min-width:86px}
  .pl-cr{font-size:11.5px;padding:3px 5px}
  .ce-ligne{grid-template-columns:1fr 1fr 40px}.ce-ligne>div:nth-child(3){grid-column:1/3}.ce-ligne .ce-x{grid-row:1;grid-column:3}
}
/* ---------- signature ---------- */
.signature{display:flex;justify-content:center;align-items:baseline;gap:6px;margin:40px auto 8px;padding:0 16px;color:#4A4F54;user-select:none;-webkit-user-select:none}
.signature span{font-size:9.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
.signature b{font-size:13px;font-weight:650;letter-spacing:.03em;color:#3A3F44;font-feature-settings:"ss01"}
/* ---------- cloche et notifications ---------- */
.barre-e{display:flex;align-items:center;gap:8px}.barre-e .onglets{flex:1;min-width:0}
.cloche{position:relative;flex:none;width:42px;height:42px;padding:0;border-radius:14px;background:#fff;color:#33383D;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .15s}
.cloche svg{width:21px;height:21px}.cloche:active{transform:scale(.94)}.cloche.actif{background:#33383D;color:#fff}
.cloche-badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#D2453F;color:#fff;font-size:11px;font-weight:700;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--fond)}
.n-entete{justify-content:space-between;margin:14px 2px 6px}
.n-groupe{font-size:12px;font-weight:700;color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 6px}
.n-carte{padding:4px 6px;margin-top:0}
.notif{display:flex;width:100%;gap:12px;align-items:flex-start;text-align:left;background:none;border-radius:12px;padding:12px 10px;font-weight:400;position:relative;border-top:1px solid #F0EBDD}
.n-carte .notif:first-child{border-top:0}
.notif:hover{background:#FBF9F3}
.n-ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}.n-ic svg{width:19px;height:19px}
.n-planning{background:#ECEEF1;color:#33383D}.n-ok{background:#E5F3EA;color:#1F7A45}.n-non{background:#FBE7E6;color:#B3261E}.n-doc{background:#F4EFE0;color:#7A5B1E}.n-info{background:#EEF0F2;color:#55595d}
.n-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.n-titre{font-size:14.5px;color:#55595d;font-weight:600}.n-msg{font-size:13.5px;color:#6b6b6b;line-height:1.4}.n-heure{font-size:12px;color:#9a9a9a;margin-top:2px}
.notif.non-lue .n-titre{color:var(--texte);font-weight:700}.notif.non-lue .n-msg{color:#3b3b3b}
.n-point{flex:none;width:9px;height:9px;border-radius:50%;background:#D2453F;margin-top:6px}
.push-carte{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:14px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.push-carte b{font-size:14.5px}
.push-ic{flex:none;width:38px;height:38px;border-radius:12px;background:#33383D;color:#fff;display:grid;place-items:center}.push-ic svg{width:19px;height:19px}
.push-ok{display:flex;gap:8px;align-items:center;font-size:13px;color:#1F7A45;margin:6px 4px}.push-ok svg{width:17px;height:17px}
/* ---------- mon planning ---------- */
.mp-resume{font-size:13px;color:var(--gris);margin:2px 4px 8px}
.mp-jour{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .3s}
.mp-jour.passe{opacity:.6}.mp-jour.auj{box-shadow:inset 0 0 0 2px var(--vert)}.mp-jour.focus{box-shadow:inset 0 0 0 2px #33383D}
.mp-jour.detail{margin-top:10px}
.mp-date{flex:none;width:48px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.mp-date span{font-size:11.5px;color:var(--gris);font-weight:600;text-transform:uppercase;letter-spacing:.04em}.mp-date b{font-size:22px}
.mp-date i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--vert);margin-top:3px;text-transform:uppercase;letter-spacing:.03em}
.mp-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.mp-h{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;color:#2b2f33}.mp-h small{display:block;font-size:12px;font-weight:500;color:var(--gris)}
.mp-h.barre{text-decoration:line-through;color:#a3a3a3;font-weight:500}
.mp-repos{font-size:15px;color:#9a9da0;font-weight:500}
.mp-info .pl-abs,.mp-info .pl-tag{display:inline-block}
.mp-chg{font-size:11.5px;font-weight:600;color:#33383D;background:#ECEEF1;border-radius:6px;padding:2px 7px}
.mp-mois{padding:12px}
.mp-sem,.mp-grille{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mp-sem span{text-align:center;font-size:11px;font-weight:700;color:var(--gris);padding-bottom:4px}
.mp-c{aspect-ratio:1/1.08;padding:4px 0;border-radius:10px;background:#F7F5EF;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;font-weight:500}
.mp-c b{font-size:14px;font-weight:650}.mp-c small{font-size:10.5px;color:#55595d;font-weight:600}.mp-c small.r{color:#b0b3b6;font-weight:500}
.mp-c.travail{background:#ECEEF1}.mp-c.hors{background:transparent;color:#c4c4c4}.mp-c.auj{box-shadow:inset 0 0 0 1.5px var(--vert)}
.mp-c.sel{background:#33383D;color:#fff}.mp-c.sel small{color:#d9dbdd}
.mp-pt{width:8px;height:8px;border-radius:50%;margin-top:3px}
.mp-pt.t-conge{background:#4F7BC0}.mp-pt.t-maladie{background:#C24A4A}.mp-pt.t-absence_autorisee{background:#7D5FB8}.mp-pt.t-absence_injustifiee{background:#8A7A5A}
.barre-e .onglets{gap:5px}.barre-e .onglet{padding:9px 12px;font-size:13.5px}
@media(max-width:400px){.barre-e .onglet{padding:8px 10px;font-size:13px}}
.mp-note{text-align:center;margin:14px 8px 0}
#impression{display:none}
@media print{
  body{background:#fff;padding:0}body>*:not(#impression){display:none!important}
  #impression{display:block;font-size:12px;color:#000}#impression h1{font-size:20px}#impression table{font-size:11px}
  #impression th,#impression td{white-space:normal;padding:5px 6px;border-top:1px solid #ddd}
  #impression .kpis{grid-template-columns:repeat(4,1fr)}#impression .kpi{box-shadow:none;border:1px solid #ddd;padding:8px}#impression .kpi b{font-size:18px}
  @page{margin:14mm}
}
</style>
</head>

  if (pdf) {

    return { nom: f.name, type: "application/pdf", taille: f.size, data: await lireDataURL(f), apercu: null };
  }
  if (!/^image\//.test(f.type) && !/\.(jpe?g|png|heic|heif)$/i.test(f.name)) throw new Error("Format refusé : photo (JPG, PNG) ou PDF uniquement.");
  // la photo est redimensionnée et réencodée en JPEG : plus légère, et sans données cachées
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error("Image illisible.")); i.src = url; });
    const max = 1800, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL("image/jpeg", 0.82);
    const taille = Math.round((data.length - data.indexOf(",") - 1) * 3 / 4);
    if (taille > TAILLE_MAX) throw new Error("Photo trop lourde, même compressée.");

}

  let debut, fin;

  else { const m1 = debutMois(E.plRef); debut = lundiDe(m1); const fm = finMois(m1); fin = plusJours(fm, 7 - dow(fm)); }
  v.innerHTML = `<div class="carte"><div class="vide">Chargement de ton planning…</div></div>`;
  let r;
  try { r = await api({ action: "mon_planning", token: E.token, debut, fin }); } catch (e) { return msg(v, e.message); }
  const parJour = {}, absJ = {}, attJ = {};
  for (const p of r.planning) (parJour[p.jour] ||= []).push(p);
  const etaler = (l, cible) => { for (const a of l) for (let j = a.date_debut < debut ? debut : a.date_debut; j <= a.date_fin && j <= fin; j = plusJours(j, 1)) (cible[j] ||= []).push(a); };
  etaler(r.absences, absJ); etaler(r.en_attente, attJ);
  const absTotale = (j) => (absJ[j] || []).find((a) => ABS_JOUR.includes(a.type) && !a.heure_debut);
  const contenu = (j, grand) => {
    const crs = (parJour[j] || []).sort((a, b) => a.ordre - b.ordre), at = absTotale(j);
    let h = at ? `<span class="pl-abs t-${at.type}">${LIB_TYPE[at.type]}</span>` : "";
    if (crs.length) h += crs.map((c) => `<span class="mp-h ${at ? "barre" : ""}">${c.debut.replace(":", "h")} – ${c.fin.replace(":", "h")}${grand && c.pause_min ? `<small>pause ${c.pause_min} min</small>` : ""}</span>`).join("");
    else if (!at) h += `<span class="mp-repos">Repos</span>`;
    for (const a of (absJ[j] || []).filter((x) => x !== at)) h += `<span class="pl-tag">${LIB_TYPE[a.type]}${a.type === "retard_justifie" && a.heure_fin ? ` · arrivée ${hcourt(a.heure_fin)}` : ""}${a.type === "depart_anticipe" && a.heure_debut ? ` · départ ${hcourt(a.heure_debut)}` : ""}</span>`;
    if (attJ[j]) h += `<span class="pl-tag attente">Demande en attente</span>`;
    if (crs.some((c) => c.source === "jour")) h += `<span class="mp-chg">Changement pour ce jour</span>`;
    return h;
  };
  const titre = E.plMode === "semaine" ? titreSemaine(debut, fin) : `${MOIS[+E.plRef.slice(5, 7) - 1].replace(/^./, (c) => c.toUpperCase())} ${E.plRef.slice(0, 4)}`;
  let corps = "";
  if (E.plMode === "semaine") {
    let jours = 0, minutes = 0;
    const liste = [0, 1, 2, 3, 4, 5, 6].map((i) => plusJours(debut, i)).map((j) => {
      const crs = parJour[j] || [];
      if (crs.length && !absTotale(j)) { jours++; minutes += crs.reduce((s, c) => s + dureeCr(c), 0); }
      return `<div class="mp-jour ${j === js ? "auj" : ""} ${j < js ? "passe" : ""} ${j === E.plFocus ? "focus" : ""}" id="mp-${j}">
        <div class="mp-date"><span>${JOURS_C[dow(j)]}</span><b>${+j.slice(8)}</b>${j === js ? `<i>Aujourd'hui</i>` : ""}</div><div class="mp-info">${contenu(j, true)}</div></div>`;
    }).join("");
    corps = `<div class="mp-resume">${jours} jour${jours > 1 ? "s" : ""} de travail · ${fmtDuree(minutes)} prévues</div>${liste}`;
  } else {
    const m = E.plRef.slice(0, 7);
    E.plFocus = E.plFocus && E.plFocus.startsWith(m) ? E.plFocus : (js.startsWith(m) ? js : debutMois(E.plRef));
    const cases = [];
    for (let j = debut; j <= fin; j = plusJours(j, 1)) {
      const crs = parJour[j] || [], at = absTotale(j), hors = !j.startsWith(m);
      const mini = at ? `<i class="mp-pt t-${at.type}"></i>` : crs.length ? `<small>${crs[0].debut.replace(":", "h").replace(/h00$/, "h")}</small>` : `<small class="r">R</small>`;
      cases.push(`<button class="mp-c ${hors ? "hors" : ""} ${j === js ? "auj" : ""} ${j === E.plFocus ? "sel" : ""} ${crs.length && !at ? "travail" : ""}" data-j="${j}" aria-label="${dateFr(j)}">
        <b>${+j.slice(8)}</b>${hors ? "" : mini}</button>`);
    }
    corps = `<div class="carte mp-mois"><div class="mp-sem">${["L", "M", "M", "J", "V", "S", "D"].map((x) => `<span>${x}</span>`).join("")}</div><div class="mp-grille">${cases.join("")}</div>
      <p class="petit" style="margin:10px 2px 0">« R » = repos. Touche un jour pour voir le détail.</p></div>
      <div class="mp-jour detail"><div class="mp-date"><span>${JOURS_C[dow(E.plFocus)]}</span><b>${+E.plFocus.slice(8)}</b></div><div class="mp-info">${contenu(E.plFocus, true)}</div></div>`;
  }
  v.innerHTML = `<div class="mp">
    <div class="ligne" style="justify-content:space-between;margin-top:10px">
      <div class="segments" role="tablist" style="margin:0"><button data-m="semaine" class="${E.plMode === "semaine" ? "actif" : ""}">Semaine</button><button data-m="mois" class="${E.plMode === "mois" ? "actif" : ""}">Mois</button></div>
      <span class="petit">${esc(r.service)}</span></div>
    <div class="pl-sem" style="margin:12px 0 8px"><button class="pl-fl" data-nav="-1" aria-label="Précédent">${svgPl("g")}</button>
      <div class="pl-titre" style="flex:1;text-align:center;align-items:center"><b>${titre}</b>${(E.plMode === "semaine" ? debut <= js && js <= fin : js.startsWith(E.plRef.slice(0, 7))) ? "" : `<button class="b-lien pl-auj" data-nav="0">Revenir à aujourd'hui</button>`}</div>
      <button class="pl-fl" data-nav="1" aria-label="Suivant">${svgPl("d")}</button></div>
    ${corps}
    <p class="petit mp-note">Planning en lecture seule, mis à jour par ton responsable. Tu es prévenu à chaque changement.</p></div>`;
  $$("[data-m]", v).forEach((b) => b.onclick = () => { E.plMode = b.dataset.m; E.plRef = E.plMode === "semaine" ? lundiDe(E.plFocus || js) : debutMois(E.plFocus || js); vueMonPlanning(); });
  $$("[data-nav]", v).forEach((b) => b.onclick = () => {
    const n = +b.dataset.nav;
    if (!n) { E.plRef = E.plMode === "semaine" ? lundiDe(js) : debutMois(js); E.plFocus = js; }
    else if (E.plMode === "semaine") E.plRef = plusJours(E.plRef, 7 * n);
    else { const d = new Date(E.plRef + "T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() + n, 1); E.plRef = d.toISOString().slice(0, 10); }
    vueMonPlanning();
  });
  $$(".mp-c[data-j]", v).forEach((b) => b.onclick = () => { E.plFocus = b.dataset.j; if (!b.dataset.j.startsWith(E.plRef.slice(0, 7))) E.plRef = debutMois(b.dataset.j); vueMonPlanning(); });
  if (E.plMode === "semaine" && E.plFocus) setTimeout(() => $(`#mp-${E.plFocus}`)?.scrollIntoView({ block: "center", behavior: "smooth" }), 80);
}

const AIDE_TYPE = {
  absence_autorisee: "Pour être absent(e) une journée ou une partie de journée.",
  retard_justifie: "Indique l'heure à laquelle tu pourras arriver.",
  depart_anticipe: "Indique l'heure à laquelle tu dois partir.",
  conge: "Choisis les dates de début et de fin.",
  maladie: "Un certificat médical est demandé : tu peux le photographier maintenant ou l'ajouter plus tard.",
};
function blocJustificatif(prefixe) {
  return `<label>Justificatif (facultatif sauf maladie)</label>
    <div class="ligne"><button type="button" class="b-sec flex" id="${prefixe}-photo">Prendre une photo</button><button type="button" class="b-sec flex" id="${prefixe}-fichier">Choisir un fichier</button></div>
    <input type="file" id="${prefixe}-in-photo" accept="image/*" capture="environment" class="cache">
    <input type="file" id="${prefixe}-in-fichier" accept="image/jpeg,image/png,application/pdf" class="cache">
    <div id="${prefixe}-apercu"></div><p class="petit">Photo, JPG, PNG ou PDF · 5 Mo maximum · visible uniquement par le gérant.</p>`;
}
function brancherJustificatif(racine, prefixe, cible) {
  const montrer = () => {
    const f = cible.fichier;
    $(`#${prefixe}-apercu`, racine).innerHTML = f ? `<div class="apercu">${f.apercu ? `<img src="${f.apercu}" alt="Aperçu">` : `<div class="doc">PDF</div>`}
      <div class="flex"><div class="t">${esc(f.nom)}</div><div class="petit">${taillePropre(f.taille)}</div>
      <div class="ligne" style="margin-top:4px"><button type="button" class="b-lien" id="${prefixe}-remplacer">Remplacer</button><button type="button" class="b-lien" style="color:var(--rouge)" id="${prefixe}-retirer">Retirer</button></div></div></div>` : "";
    if (f) {
      $(`#${prefixe}-remplacer`, racine).onclick = () => $(`#${prefixe}-in-fichier`, racine).click();
      $(`#${prefixe}-retirer`, racine).onclick = () => { cible.fichier = null; montrer(); };
    }
  };
  const charger = async (input) => {
    const f = input.files[0]; input.value = "";
    if (!f) return;
    try { cible.fichier = await preparerFichier(f); montrer(); } catch (e) { $(`#${prefixe}-apercu`, racine).innerHTML = `<div class="msg mal">${esc(e.message)}</div>`; }
  };
  $(`#${prefixe}-photo`, racine).onclick = () => $(`#${prefixe}-in-photo`, racine).click();
  $(`#${prefixe}-fichier`, racine).onclick = () => $(`#${prefixe}-in-fichier`, racine).click();
  $(`#${prefixe}-in-photo`, racine).onchange = (e) => charger(e.target);
  $(`#${prefixe}-in-fichier`, racine).onchange = (e) => charger(e.target);
  montrer();
}
function formulaireDemande() {
  const auj = E.etat.jour_service;
  const cible = { fichier: null };
  const f = feuille(`<div class="entete"><h2>Nouvelle demande</h2><button class="b-sec" data-fermer>Fermer</button></div>
    <label>Type de demande</label>
    <select id="d-type">${Object.entries({ absence_autorisee: "Autorisation d'absence", retard_justifie: "Autorisation de retard", depart_anticipe: "Départ anticipé", conge: "Congé", maladie: "Absence pour maladie" }).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
    <p class="petit" id="d-aide"></p>
    <div class="ligne"><div class="flex"><label id="d-l-debut">Date</label><input type="date" id="d-debut" value="${auj}"></div>
      <div class="flex" id="d-bloc-fin"><label>Jusqu'au</label><input type="date" id="d-fin" value="${auj}"></div></div>
    <div class="ligne" id="d-heures"><div class="flex" id="d-bloc-hd"><label id="d-l-hd">De</label><input type="time" id="d-hd"></div><div class="flex" id="d-bloc-hf"><label id="d-l-hf">À</label><input type="time" id="d-hf"></div></div>
    <label>Motif</label><input id="d-motif" maxlength="200" placeholder="Ex. : rendez-vous médical">
    <label>Explication (facultatif)</label><textarea id="d-expl" maxlength="1000"></textarea>
    ${blocJustificatif("dj")}
    <div id="d-msg"></div><div class="pile" style="margin-top:14px"><button class="b-principal b-grand" id="d-ok">Envoyer la demande</button></div>`);
  const r = f.el;
  const maj = () => {
    const t = $("#d-type", r).value;
    $("#d-aide", r).textContent = AIDE_TYPE[t];
    const plage = ["conge", "maladie", "absence_autorisee"].includes(t);
    $("#d-bloc-fin", r).classList.toggle("cache", !plage);
    $("#d-l-debut", r).textContent = plage ? "Du" : "Date";
    $("#d-heures", r).classList.toggle("cache", ["conge", "maladie"].includes(t));
    $("#d-bloc-hd", r).classList.toggle("cache", t === "retard_justifie");
    $("#d-bloc-hf", r).classList.toggle("cache", t === "depart_anticipe");
    $("#d-l-hd", r).textContent = t === "depart_anticipe" ? "Heure de départ" : "De (facultatif)";
    $("#d-l-hf", r).textContent = t === "retard_justifie" ? "Heure d'arrivée prévue" : "À (facultatif)";
  };
  $("#d-type", r).onchange = maj; maj();
  brancherJustificatif(r, "dj", cible);
  $("#d-ok", r).onclick = async () => {
    const t = $("#d-type", r).value, plage = ["conge", "maladie", "absence_autorisee"].includes(t);
    const corps = {
      action: "demande_creer", token: E.token, type: t, date_debut: $("#d-debut", r).value,
      date_fin: plage ? $("#d-fin", r).value : $("#d-debut", r).value,
      heure_debut: t === "retard_justifie" || ["conge", "maladie"].includes(t) ? "" : $("#d-hd", r).value,
      heure_fin: t === "depart_anticipe" || ["conge", "maladie"].includes(t) ? "" : $("#d-hf", r).value,
      motif: $("#d-motif", r).value, explication: $("#d-expl", r).value,
    };
    if (t === "retard_justifie" && !corps.heure_fin) return msg($("#d-msg", r), "Indique ton heure d'arrivée prévue.");
    if (t === "depart_anticipe" && !corps.heure_debut) return msg($("#d-msg", r), "Indique ton heure de départ.");
    if (corps.motif.trim().length < 3) return msg($("#d-msg", r), "Indique le motif de ta demande.");
    if (cible.fichier) { corps.fichier = cible.fichier.data; corps.nom_fichier = cible.fichier.nom; }
    $("#d-ok", r).disabled = true; $("#d-ok", r).textContent = "Envoi…";
    try { await api(corps); f.fermer(); vueMesDemandes(); }
    catch (e) { msg($("#d-msg", r), e.message); $("#d-ok", r).disabled = false; $("#d-ok", r).textContent = "Envoyer la demande"; }
  };
}
function detailMaDemande(d) {

      <div id="md-msg"></div></div>

  const r = f.el;
  if (just) $("#md-voir", r).onclick = async () => { try { const x = await api({ action: "mon_justificatif", token: E.token, id: just.id }); ouvrirDocument(x.type_mime, x.fichier, "Mon justificatif"); } catch (e) { msg($("#md-msg", r), e.message); } };

// ---------- statistiques (toujours depuis le moteur hr_journees) ----------
const AVEC_ARRIVEE = (r) => r.arrivee_min !== null && r.arrivee_min !== undefined;
function stats(rows) {
  const arr = rows.filter(AVEC_ARRIVEE), prev = arr.filter((r) => r.prevu_debut);
  const ret = rows.filter((r) => r.retard_min > 0);
  const cumul = ret.reduce((s, r) => s + r.retard_min, 0);
  const abs = new Set(rows.filter((r) => r.statut === "absence_injustifiee").map((r) => r.employe_id + "|" + r.jour));
  const absJ = new Set(rows.filter((r) => r.statut === "absence_justifiee").map((r) => r.employe_id + "|" + r.jour));
  return {
    nb_retards: ret.length, cumul, moyenne: ret.length ? Math.round(cumul / ret.length) : 0,
    ponctualite: prev.length ? Math.round(100 * prev.filter((r) => r.retard_min === 0).length / prev.length) : null,
    jours: new Set(arr.map((r) => r.employe_id + "|" + r.jour)).size, absences: abs.size, absences_justifiees: absJ.size,
    heures_sup: rows.reduce((s, r) => s + (r.heures_sup_min || 0), 0), travail: rows.reduce((s, r) => s + (r.travail_min || 0), 0),
    anomalies: rows.filter((r) => ["depart_non_pointe", "coupure_non_pointee"].includes(r.statut)).length,
  };
}
function filtrer(rows, f) {
  return rows.filter((r) => (!f.employe || r.employe_id === +f.employe) && (!f.service || r.service === f.service));
}
function niveauMois(rows) {
  const c = G.cfg.mois, s = stats(rows);
  let n = s.nb_retards > 0 ? 1 : 0;
  for (let i = 0; i < 3; i++) if (s.nb_retards >= c.nombre[i] || s.cumul >= c.minutes[i]) n = Math.max(n, i + 2);
  return { smiley: c.smileys[n], niveau: n, s };
}
function barres(series, opts = {}) {
  // histogramme simple en SVG : [{ etiquette, valeur }]
  const w = 640, h = 190, g = 34, b = 22, max = Math.max(1, ...series.map((x) => x.valeur));
  const pas = (w - g - 8) / Math.max(1, series.length), lb = Math.min(46, pas * 0.6);
  const y = (v) => h - b - (v / max) * (h - b - 18);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.titre || "")}">
    <line x1="${g}" x2="${w}" y1="${h - b}" y2="${h - b}" stroke="#E6E0CF"/>
    ${series.map((x, i) => { const cx = g + pas * i + pas / 2; return `<g><rect x="${cx - lb / 2}" y="${y(x.valeur)}" width="${lb}" height="${h - b - y(x.valeur)}" rx="5" fill="${x.couleur || "#0B4F3C"}" opacity="${x.valeur ? 1 : .25}"><title>${esc(x.etiquette)} : ${esc(opts.format ? opts.format(x.valeur) : x.valeur)}</title></rect>
      <text x="${cx}" y="${y(x.valeur) - 5}" text-anchor="middle" font-size="11" fill="#444">${x.valeur ? esc(opts.format ? opts.format(x.valeur) : x.valeur) : ""}</text>
      <text x="${cx}" y="${h - 6}" text-anchor="middle" font-size="11" fill="#6b6b6b">${esc(x.etiquette)}</text></g>`; }).join("")}
  </svg>`;
}

async function vueTableau(v) {
  const f = G.filtres;

  const debut6 = [debutMois(plusJours(debutMois(G.js), -150)), suivi].sort()[1];
  const [jr, hist, eq] = await Promise.all([
    ga({ action: "admin_journees", debut: f.debut, fin: f.fin }),
    ga({ action: "admin_journees", debut: debut6, fin: G.js }),
    ga({ action: "admin_equipe" }),
  ]);
  G.equipe = eq.equipe;
  const rows = filtrer(jr.journees, f), tous = filtrer(hist.journees, f);
  const aujRows = filtrer(hist.journees.filter((r) => r.jour === G.js), f);
  const presents = eq.equipe.filter((x) => x.present && (!f.employe || x.id === +f.employe) && (!f.service || x.service === f.service));
  const absentsAuj = new Set(aujRows.filter((r) => ["absence_injustifiee", "absent_en_cours"].includes(r.statut)).map((r) => r.employe_id));
  const retardAuj = aujRows.filter((r) => r.retard_min > 0);
  const s = stats(rows);
  // classements sur la période filtrée
  const parEmp = {}; rows.forEach((r) => (parEmp[r.employe_id] ||= []).push(r));
  const classement = Object.entries(parEmp).map(([id, rs]) => ({ id: +id, nom: rs[0].nom, ...niveauMois(rs) })).filter((x) => x.s.jours > 0);
  const ponctuels = [...classement].sort((a, b) => (b.s.ponctualite ?? -1) - (a.s.ponctualite ?? -1) || a.s.cumul - b.s.cumul).slice(0, 5);
  const retardataires = [...classement].filter((x) => x.s.cumul > 0).sort((a, b) => b.s.cumul - a.s.cumul).slice(0, 5);
  // semaines (période) et mois (historique)
  const sem = {}; rows.forEach((r) => { const k = lundiDe(r.jour); sem[k] = (sem[k] || 0) + (r.retard_min || 0); });
  for (let d = lundiDe(f.debut); d <= f.fin; d = plusJours(d, 7)) sem[d] ||= 0;

  v.innerHTML = `<div class="carte"><div class="ligne">
      <div class="flex"><label>Du</label><input type="date" id="f-debut" value="${f.debut}"></div><div class="flex"><label>Au</label><input type="date" id="f-fin" value="${f.fin}"></div>
      <div class="flex"><label>Employé</label><select id="f-emp">${optionsEmployes(f.employe)}</select></div><div class="flex"><label>Poste</label><select id="f-srv">${optionsServices(f.service)}</select></div></div></div>
    <h3 style="margin:16px 2px 8px">Aujourd'hui · ${esc(dateFr(G.js))}</h3>
    <div class="kpis">
      <div class="kpi"><b>${presents.length}</b><span>présents actuellement</span></div>
      <div class="kpi"><b>${absentsAuj.size}</b><span>absents ou pas encore arrivés</span></div>
      <div class="kpi"><b>${retardAuj.length}</b><span>en retard aujourd'hui</span></div>
    </div>
    <h3 style="margin:18px 2px 8px">Période · ${dateCourte(f.debut)} → ${dateCourte(f.fin)}</h3>
    <div class="kpis">
      <div class="kpi"><b>${s.ponctualite ?? "—"}${s.ponctualite === null ? "" : " %"}</b><span>ponctualité de l'équipe</span></div>
      <div class="kpi"><b>${duree(s.cumul)}</b><span>de retards (${s.nb_retards})</span></div>
      <div class="kpi"><b>${duree(s.heures_sup)}</b><span>d'heures supplémentaires</span></div>
      <div class="kpi"><b>${s.absences}</b><span>absences injustifiées</span></div>
      <div class="kpi"><b>${s.anomalies}</b><span>oublis de pointage</span></div>

    </div>
    <div class="grille2" style="margin-top:12px">
      <div class="carte" style="margin:0"><h3>Les plus ponctuels</h3><ul class="liste">${lignesClassement(ponctuels, "Pas encore de données.")}</ul></div>
      <div class="carte" style="margin:0"><h3>Le plus de retards</h3><ul class="liste">${lignesClassement(retardataires, "Aucun retard sur la période.")}</ul></div>
    </div>
    <div class="grille2">
      <div class="carte graph"><h3>Retards par semaine</h3><p class="sous">Minutes de retard, période choisie</p>${barres(Object.keys(sem).sort().map((k) => ({ etiquette: dateCourte(k), valeur: sem[k], couleur: "#A8823C" })), { format: (x) => x + " min", titre: "Retards par semaine" })}</div>
      <div class="carte graph"><h3>Comparaison des mois</h3><p class="sous">Ponctualité de l'équipe (%)</p>${barres(Object.keys(mois).sort().map((k) => { const p = stats(mois[k]).ponctualite || 0; return { etiquette: MOIS[+k.slice(5) - 1].slice(0, 3) + ".", valeur: p, couleur: p >= 90 ? SMILEY_COULEURS.vert : p >= 75 ? SMILEY_COULEURS.jaune : p >= 60 ? SMILEY_COULEURS.orange : SMILEY_COULEURS.rouge }; }), { format: (x) => x + " %", titre: "Ponctualité par mois" })}</div>

  ["#f-debut", "#f-fin", "#f-emp", "#f-srv"].forEach((s) => $(s).onchange = relancer);

  $("#t-pdf").onclick = () => rapportGlobalPDF(rows, f);
}

  const [eq, em] = await Promise.all([ga({ action: "admin_equipe" }), ga({ action: "admin_emojis_mois" })]);
  G.equipe = eq.equipe;
  const disc = Object.fromEntries((em.employes || []).map((x) => [x.id, x]));
  v.innerHTML = `<div class="carte"><div class="ligne"><input id="e-cherche" placeholder="Rechercher un employé" class="flex"><select id="e-srv" class="flex">${optionsServices("")}</select></div>
    <ul class="liste" id="e-liste" style="margin-top:8px"></ul></div>`;
  const dessiner = () => {
    const q = $("#e-cherche").value.toLowerCase(), s = $("#e-srv").value;
    $("#e-liste").innerHTML = eq.equipe.filter((x) => x.actif && (!q || x.nom.toLowerCase().includes(q)) && (!s || x.service === s)).map((x) => {
      const d = disc[x.id];
      return `<li class="cliquable" data-fiche="${x.id}">${d ? smiley(d.smiley, { taille: 34, couleur: d.couleur, titre: d.message }) : ""}
        <div class="flex"><div class="t">${esc(x.nom)}</div><div class="petit">${esc(x.service)} · ${d ? esc(d.message) : ""}</div></div>
        <div style="text-align:right"><span class="puce ${x.present ? "validee" : ""}">${x.present ? "Présent" : "Absent"}</span>
        <div class="petit" style="margin-top:4px">${x.telephone ? "Téléphone activé" : "Code " + esc(x.pin)}</div></div></li>`;
    }).join("") || `<li class="vide">Aucun employé.</li>`;
    $$("[data-fiche]", v).forEach((li) => li.onclick = () => allerA("fiche", +li.dataset.fiche));
  };
  $("#e-cherche").oninput = dessiner; $("#e-srv").onchange = dessiner; dessiner();
}

// ---------- Fiche employé ----------
async function vueFiche(v, id) {
  const e = employeDe(id); if (!e) throw new Error("Employé introuvable.");
  const p = (await ga({ action: "admin_parametres" })).parametres;
  const suivi = p.debut_suivi || debutMois(G.js);
  const [jr, dm] = await Promise.all([
    ga({ action: "admin_journees", employe_id: id, debut: [suivi, G.js].sort()[0], fin: G.js }),
    ga({ action: "admin_demandes", employe_id: id }),
  ]);
  const rows = jr.journees.filter((r) => r.statut !== "a_venir");
  const parPeriode = (d) => rows.filter((r) => r.jour >= d);
  const sJ = stats(rows.filter((r) => r.jour === G.js)), sS = stats(parPeriode(lundiDe(G.js))), sM = stats(parPeriode(debutMois(G.js))), sT = stats(rows);
  const nm = niveauMois(parPeriode(debutMois(G.js)));
  const histo = [...rows].filter((r) => r.prevu_debut || AVEC_ARRIVEE(r)).sort((a, b) => b.jour.localeCompare(a.jour) || b.creneau_ordre - a.creneau_ordre);
  v.innerHTML = `<button class="b-lien retour" id="f-retour">‹ Équipe</button>
    <div class="carte"><div class="ligne">${smiley(nm.smiley, { taille: 56, titre: "Discipline du mois" })}<div class="flex"><h2>${esc(e.nom)}</h2><p class="sous">${esc(e.service)} · ${e.telephone ? "téléphone activé" : "téléphone non activé (code " + esc(e.pin) + ")"} · ${e.present ? "présent" : "absent"} maintenant</p></div></div>
      <div class="ligne" style="margin-top:12px"><button class="b-sec flex" id="f-rapport">Rapport du mois (PDF)</button><button class="b-sec flex" id="f-csv">Historique (Excel)</button>
      <button class="b-sec flex" id="f-horaires">Horaires</button><button class="b-sec flex" id="f-pointages">Pointages</button><button class="b-sec flex" id="f-absence">Saisir une absence</button></div>
      <div class="ligne" style="margin-top:8px"><button class="b-lien" id="f-reset">Réinitialiser le téléphone</button><button class="b-lien" id="f-code">Nouveau code</button></div><div id="f-msg"></div></div>
    <div class="kpis">
      <div class="kpi"><b>${duree(sJ.cumul)}</b><span>retard du jour</span></div>
      <div class="kpi"><b>${duree(sS.cumul)}</b><span>retard de la semaine</span></div>
      <div class="kpi"><b>${duree(sM.cumul)}</b><span>retard du mois</span></div>
      <div class="kpi"><b>${duree(sT.cumul)}</b><span>retard depuis le ${dateCourte(suivi)}</span></div>
      <div class="kpi"><b>${sT.nb_retards}</b><span>retards au total</span></div>
      <div class="kpi"><b>${duree(sT.moyenne)}</b><span>de retard en moyenne</span></div>
      <div class="kpi"><b>${sT.ponctualite ?? "—"}${sT.ponctualite === null ? "" : " %"}</b><span>de ponctualité</span></div>
      <div class="kpi"><b>${sT.jours}</b><span>jours travaillés</span></div>
      <div class="kpi"><b>${sT.absences}</b><span>absences injustifiées</span></div>
      <div class="kpi"><b>${duree(sT.heures_sup)}</b><span>d'heures supplémentaires</span></div>
    </div>
    <div class="carte"><h3>Historique</h3><div class="tableau"><table><thead><tr><th></th><th>Date</th><th>Prévu</th><th>Arrivée</th><th class="num">Retard</th><th>Départ</th><th class="num">Travail</th><th>Statut</th></tr></thead><tbody>
      ${histo.length ? histo.map((r) => `<tr><td>${r.emoji_jour ? smileyDe(r.emoji_jour, 24) : ""}</td><td>${esc(dateCourte(r.jour))} ${JOURS_C[dow(r.jour)]}</td>
        <td>${r.prevu_debut ? hcourt(r.prevu_debut) + "–" + hcourt(r.prevu_fin) : "—"}</td><td>${hhmm(r.arrivee_min)}</td>
        <td class="num">${r.retard_min ? r.retard_min + " min" : r.retard_justifie_min ? "justifié" : "—"}</td><td>${hhmm(r.depart_min)}</td>
        <td class="num">${r.travail_min ? duree(r.travail_min) : "—"}</td><td>${esc(LIB_JOUR[r.statut] || r.statut)}</td></tr>`).join("") : `<tr><td colspan="8" class="vide">Pas encore de journée suivie.</td></tr>`}
    </tbody></table></div></div>
    <div class="carte"><h3>Demandes</h3><ul class="liste">${(dm.demandes || []).slice(0, 10).map((d) => `<li class="cliquable" data-dem="${d.id}"><div class="flex"><div class="t">${esc(LIB_TYPE[d.type])}</div><div class="petit">${esc(periodeDemande(d))}</div></div><span class="puce ${CLASSE_STATUT[d.statut]}">${LIB_STATUT[d.statut]}</span></li>`).join("") || `<li class="vide">Aucune demande.</li>`}</ul></div>`;
  $("#f-retour").onclick = () => allerA("equipe");
  $("#f-horaires").onclick = () => allerA("horaires", id);
  $("#f-pointages").onclick = () => allerA("pointages", { employe: id });
  $("#f-absence").onclick = () => saisirAbsence(id, () => allerA("fiche", id));
  $("#f-csv").onclick = () => exporterCSV(histo, `capanna-${e.nom.replace(/\W+/g, "-")}.csv`);
  $("#f-rapport").onclick = () => rapportMensuelPDF(e, parPeriode(debutMois(G.js)), nm);
  $("#f-reset").onclick = () => demanderMotif("Réinitialiser le téléphone", `${esc(e.nom)} devra réactiver son téléphone avec un code.`, async (m) => { await ga({ action: "admin_reinitialiser", employe_id: id, motif: m }); e.telephone = false; allerA("fiche", id); }, { classe: "b-danger", bouton: "Réinitialiser" });
  $("#f-code").onclick = async () => { try { const r = await ga({ action: "admin_nouveau_code", employe_id: id }); e.pin = r.pin; msg($("#f-msg"), `Nouveau code d'activation : ${r.pin}`, "bon"); } catch (x) { msg($("#f-msg"), x.message); } };
  $$("[data-dem]", v).forEach((li) => li.onclick = () => ficheDemande(+li.dataset.dem));
}
function saisirAbsence(employeId, apres) {
  const f = feuille(`<div class="entete"><h2>Saisir une absence</h2><button class="b-sec" data-fermer>Fermer</button></div>
    <p class="sous">Enregistrée directement comme acceptée.</p>

    <label>Type</label><select id="s-type">${Object.entries(LIB_TYPE).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
    <div class="ligne"><div class="flex"><label>Du</label><input type="date" id="s-debut" value="${G.js}"></div><div class="flex"><label>Au</label><input type="date" id="s-fin" value="${G.js}"></div></div>
    <div class="ligne"><div class="flex"><label>De (facultatif)</label><input type="time" id="s-hd"></div><div class="flex"><label>À (facultatif)</label><input type="time" id="s-hf"></div></div>
    <p class="petit">Retard autorisé : heure d'arrivée dans « À ». Départ anticipé : heure de départ dans « De ».</p>
    <label>Motif (obligatoire)</label><input id="s-motif">
    <div id="s-msg"></div><div class="pile" style="margin-top:12px"><button class="b-principal" id="s-ok">Enregistrer</button></div>`);
  $("#s-ok", f.el).onclick = async () => {
    try {
      await ga({ action: "admin_demande_creer", employe_id: $("#s-emp", f.el).value, type: $("#s-type", f.el).value, date_debut: $("#s-debut", f.el).value, date_fin: $("#s-fin", f.el).value,
        heure_debut: $("#s-hd", f.el).value, heure_fin: $("#s-hf", f.el).value, motif: $("#s-motif", f.el).value });
      f.fermer(); apres && apres();
    } catch (e) { msg($("#s-msg", f.el), e.message); }
  };
}

// ---------- Calendrier des absences ----------
async function vueCalendrier(v, mois) {
  G.moisCal = mois || G.moisCal || G.js.slice(0, 7);
  const debut = G.moisCal + "-01", fin = finMois(debut);
  const fc = G.filtreCal ||= { employe: "", service: "", attente: false };
  const r = await ga({ action: "admin_calendrier", debut, fin, employe_id: fc.employe || undefined, service: fc.service || undefined, inclure_attente: fc.attente });
  const ev = r.evenements || [];
  const prem = lundiDe(debut), cases = [];
  for (let d = prem; d <= fin || dow(d) !== 1; d = plusJours(d, 1)) cases.push(d);
  const [y, m] = G.moisCal.split("-").map(Number);
  const autre = (k) => { const d = new Date(Date.UTC(y, m - 1 + k, 1)); return d.toISOString().slice(0, 7); };
  v.innerHTML = `<div class="carte"><div class="ligne"><button class="b-sec" id="c-prec">‹</button><h2 class="flex" style="text-align:center">${MOIS[m - 1]} ${y}</h2><button class="b-sec" id="c-suiv">›</button></div>
    <div class="ligne" style="margin-top:10px"><select id="c-emp" class="flex">${optionsEmployes(fc.employe)}</select><select id="c-srv" class="flex">${optionsServices(fc.service)}</select>
    <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--texte)"><input type="checkbox" id="c-att" style="width:auto" ${fc.attente ? "checked" : ""}> Inclure les demandes en attente</label></div></div>
    <div class="cal">${[1, 2, 3, 4, 5, 6, 7].map((j) => `<div class="tete">${JOURS_C[j]}</div>`).join("")}
    ${cases.map((d) => { const du = ev.filter((x) => x.date_debut <= d && x.date_fin >= d);
      return `<div class="j ${d.slice(0, 7) !== G.moisCal ? "hors" : ""} ${d === G.js ? "auj" : ""}"><div class="n">${+d.slice(8)}</div>${du.map((x) => `<div class="ev ${x.statut !== "validee" ? "attente" : x.type}" title="${esc(x.hr_employes?.nom + " · " + LIB_TYPE[x.type])}">${esc((x.hr_employes?.nom || "").split(" ")[0])}</div>`).join("")}</div>`; }).join("")}</div>
    <div class="carte"><h3>Liste</h3><ul class="liste">${ev.map((x) => `<li class="cliquable" data-dem="${x.id}"><div class="flex"><div class="t">${esc(x.hr_employes?.nom)} · ${esc(LIB_TYPE[x.type])}</div><div class="petit">${esc(x.hr_employes?.service)} · ${esc(periodeDemande(x))}</div></div><span class="puce ${CLASSE_STATUT[x.statut]}">${LIB_STATUT[x.statut]}</span></li>`).join("") || `<li class="vide">Aucune absence ce mois-ci.</li>`}</ul></div>`;
  $("#c-prec").onclick = () => allerA("calendrier", autre(-1)); $("#c-suiv").onclick = () => allerA("calendrier", autre(1));
  $("#c-emp").onchange = (e) => { fc.employe = e.target.value; allerA("calendrier"); };
  $("#c-srv").onchange = (e) => { fc.service = e.target.value; allerA("calendrier"); };
  $("#c-att").onchange = (e) => { fc.attente = e.target.checked; allerA("calendrier"); };
  $$("[data-dem]", v).forEach((li) => li.onclick = () => ficheDemande(+li.dataset.dem));
}

async function vuePointages(v, arg) {
  const fp = G.filtreP ||= { jour: G.js, employe: "" };
  if (arg?.employe) fp.employe = String(arg.employe);
  const [pts, jr] = await Promise.all([ga({ action: "admin_pointages", debut: fp.jour, fin: fp.jour, employe_id: fp.employe || undefined }), ga({ action: "admin_journees", debut: fp.jour, fin: fp.jour })]);
  const emo = {}; jr.journees.forEach((r) => { if (r.emoji_jour) emo[r.employe_id] = r.emoji_jour; });
  v.innerHTML = `<div class="carte"><div class="ligne"><div class="flex"><label>Journée de service</label><input type="date" id="p-jour" value="${fp.jour}"></div><div class="flex"><label>Employé</label><select id="p-emp">${optionsEmployes(fp.employe)}</select></div></div>
    <div class="pile" style="margin-top:10px"><button class="b-sec" id="p-ajout">Ajouter un pointage oublié</button></div></div>
    <div class="carte"><div class="tableau"><table><thead><tr><th></th><th>Employé</th><th>Type</th><th>Heure</th><th>Source</th><th>Détail</th><th></th></tr></thead><tbody>
    ${pts.pointages.map((p) => { const e = employeDe(p.employe_id) || {}; return `<tr class="${p.annule ? "barre" : ""}"><td>${p.type === "arrivee" && !p.annule && p.accepte && emo[p.employe_id] ? smileyDe(emo[p.employe_id], 22) : ""}</td>
      <td>${esc(e.nom || "?")}</td><td>${p.type === "arrivee" ? "Arrivée" : "Départ"}</td><td>${esc(p.heure)}</td>
